숫자도 한쪽이 받아들이지 않는다면, 그다음 결정은 누가 합니까?","bank":[{"p":"admin","t":"독립 기관이 필요 인력을 산정하려면 몇 달이 걸립니다. 그동안 준법투쟁과 지연이 이어진다면 시민은 무엇을 기다리는 것입니까?","q":"검증이 끝날 때까지의 운행은 어떻게 하겠습니까?","src":2}]}],"choshiPremise":"안전 규정을 지키느라 늦어지는 것은 잠깐이다","choshiQ":"지연이 몇 주씩 이어져 지각이 반복된다면, 그래도 받아들이겠습니까?","choshiBank":[{"p":"citizen","t":"통학이 10분 늦어지면 첫 수업이나 아르바이트에 늦는 사람도 생깁니다. 그 손해는 누가 메워 줍니까?","q":"지연이 길어질 때 받아들일 수 있는 한계는 어디입니까?"},{"p":"driver","t":"규정대로 운행하면 늦어진다는 건, 평소에는 규정을 다 지키지 못하고 있었다는 뜻이기도 합니다. 평소의 빠른 운행이 무엇을 건너뛰고 있었는지 생각해 봤습니까?","q":"평소의 빠름과 규정대로의 느림 중 어느 쪽이 정상이라고 봅니까?","src":1}],"samples":{"choshi":"준법투쟁을 받아들이겠다. 안전이 중요하니까 조금 늦어도 괜찮다. 다들 이해할 것 같다.","boksi":"지하철 안전 인력을 늘리는 비용은 세금으로 내야 한다. 지하철은 모든 시민이 쓰는 공공 시설이기 때문이다. 요금을 올리면 학생처럼 여유가 없는 사람이 가장 힘들어진다. 노조가 요구하는 인력도 안전을 위한 것이다. 따라서 세금으로 인력을 늘리는 것이 맞다."},"sampleNote":{"stance":"g1","weakness":"노조가 요구한 인력이 모두 필요하다는 숨은 전제, '모든 시민이 쓴다'는 일반화"},"revised":{"choshi":"내 통학이 늦어지더라도 이 준법투쟁은 받아들이겠다. 기사에 따르면 기관사는 속도를 높이거나 정차 시간을 줄이지 않을 뿐이고, 이는 원래 지켜야 할 안전 규정이다. 물론 지연이 몇 주씩 이어지면 지각과 결석이 쌓이는 학생도 생긴다. 그래서 공사가 혼잡역에 인력을 보내는 것처럼 지연을 줄이는 조치를 함께 한다는 조건에서 받아들이겠다.","boksi":"지하철 안전 인력을 늘리는 비용은 세금으로 내야 한다. 지하철이 멈추면 타지 않는 시민의 출근과 물류까지 함께 막히므로, 지하철은 도시 전체가 기대는 기반 시설이다. 요금을 올리면 학생처럼 여유가 없는 이용자가 가장 큰 부담을 진다. 물론 노조가 요구한 1313명이 모두 안전에 꼭 필요한지는 따져 봐야 한다는 반론이 있다. 그래서 세금은 안전과 직접 관련된 인력에만 쓰고, 그 규모는 따로 검증해야 한다. 그러면 세금을 내는 시민도 그 돈이 어디에 쓰이는지 확인할 수 있다."},"clusters":[{"label":"안전은 공공 예산으로","stance":"g1","n":7,"x":0.22,"y":0.28,"logic":2.8,"desc":"지하철은 도시 전체의 기반 시설이므로 안전 인력은 세금으로","share":0.233,"s":{"who":"응시자 01","text":"지하철 안전 인력의 비용은 세금으로 부담해야 한다고 생각한다. 지하철은 이용자만 혜택을 보는 서비스가 아니라, 도로 혼잡을 줄이고 도시가 돌아가게 하는 공공 기반 시설이다. 그런데 비용을 요금으로만 메우면 매일 지하철을 타야 하는 학생과 저소득층이 가장 큰 부담을 진다. 노조가 요구하는 것도 위험 작업을 2인 1조로 하자는 것처럼 사고를 막기 위한 인력이므로, 이것은 효율이 아니라 안전의 문제로 봐야 한다. 그러므로 안전 인력만큼은 공공 예산으로 확보하는 것이 우선이다.","agree":14,"pen":7}},{"label":"이용자도 조금씩","stance":"g2","n":6,"x":0.68,"y":0.22,"logic":3,"desc":"수익자 부담 원칙에 따라 요금으로 일부 부담, 약자는 할인으로 보호","share":0.2,"s":{"who":"응시자 05","text":"안전 인력을 늘리는 비용은 요금 인상으로 일부를 이용자가 부담해야 한다고 본다. 지하철 서비스를 직접 쓰는 사람이 비용을 더 내는 것이 수익자 부담 원칙에 맞다. 세금으로만 메우면 서울 지하철을 거의 타지 않는 사람까지 그 비용을 나누게 된다. 물론 요금이 오르면 학생과 저소득층의 부담이 커지므로, 이들에게는 할인 제도를 넓혀 보완할 수 있다. 결국 기준은 혜택을 받는 사람이 더 낸다는 원칙과 약자는 보호한다는 원칙을 함께 지키는 것이다.","agree":12,"pen":6}},{"label":"규정대로가 정상","stance":"g3","n":6,"x":0.44,"y":0.52,"logic":3.1,"desc":"규정을 지키면 늦어진다는 사실이 인력 부족을 보여 주므로 안전 기준이 먼저","share":0.2,"s":{"who":"응시자 09","text":"이번 준법투쟁은 비용 논쟁보다 먼저 확인할 것을 보여 준다. 기관사가 정차 시간을 줄이지 않고 규정대로만 해도 지연이 우려된다면, 지금의 운행 계획은 규정을 다 지키지 못하는 인력과 속도로 짜여 있다는 뜻일 수 있다. 그렇다면 인력 감축은 이미 빠듯하게 돌아가는 체계를 더 압박하는 셈이다. 비용 부담을 누가 질지는 그 다음 문제이고, 우선은 규정을 지키면서 운행할 수 있는 인력 수준을 기준으로 삼아야 한다. 그 기준에 맞춰 부족한 부분을 세금이든 요금이든 채우는 것이 순서다.","agree":12,"pen":6}},{"label":"효율화 먼저","stance":"g4","n":5,"x":0.8,"y":0.56,"logic":2.7,"desc":"시민 돈을 쓰기 전에 업무 재배치와 내부 효율화를 증명해야","share":0.167,"s":{"who":"응시자 12","text":"안전 인력을 늘리기 전에, 지금 인력이 효율적으로 배치되어 있는지부터 따져야 한다. 공사가 인력 감축을 추진하는 데에도 이유가 있을 것이고, 모든 인력이 안전 업무에 쓰이는 것은 아닐 수 있다. 안전과 직접 관련 없는 업무를 줄이고 그 인력을 현장 안전 업무로 옮긴다면, 전체 인원을 늘리지 않고도 안전을 강화할 수 있다. 세금이나 요금 인상은 그 다음 단계여야 한다. 시민의 돈을 쓰기 전에 내부 효율화부터 증명하는 것이 기준이 되어야 한다.","agree":10,"pen":5}},{"label":"기술로 빈자리를","stance":"g5","n":4,"x":0.2,"y":0.72,"logic":3.2,"desc":"반복 점검은 기술에 맡기고 사람은 위험 상황에 집중","share":0.133,"s":{"who":"응시자 15","text":"비용을 누가 내느냐는 질문에는 사람을 늘리는 것과 기술에 투자하는 것을 함께 따져야 한다고 답하고 싶다. 승강장 문 점검처럼 반복되는 확인 작업은 센서와 자동 점검 장비가 상당 부분을 도울 수 있다. 그러면 사람은 기계가 판단하기 어려운 위험 상황에 집중할 수 있다. 초기 투자는 세금으로 하되, 장기적으로 인건비 증가를 줄일 수 있다면 시민 부담도 줄어든다. 다만 기술 도입이 인력 감축의 핑계가 되지 않도록, 줄어든 업무만큼 안전 업무에 다시 배치하는 원칙이 필요하다.","agree":8,"pen":4}},{"label":"숫자부터 검증","stance":"g6","n":2,"x":0.62,"y":0.72,"logic":3.7,"tam":true,"desc":"노사 숫자가 엇갈리니 독립 기관이 필요 인력을 산정해야 분담도 공정","share":0.067,"s":{"who":"응시자 18","text":"나는 비용을 누가 낼지 정하기 전에, 몇 명이 필요한지에 대한 숫자부터 독립적으로 검증해야 한다고 본다. 노조는 1313명 충원을, 공사와 서울시는 2212명 감축을 말하는데, 같은 지하철을 두고 이렇게 숫자가 엇갈리면 어느 쪽 비용 계산도 시민이 믿기 어렵다. 노사 어느 쪽에도 속하지 않은 전문 기관이 안전 규정을 지키며 운행하는 데 필요한 인력을 산정하고 결과를 공개한다면, 그 숫자를 기준으로 세금과 요금의 분담을 정할 수 있다. 이렇게 하면 해마다 반복되는 힘겨루기 대신 근거를 두고 논쟁하게 된다. 비용 분담의 공정성은 결국 무엇에 대한 비용인지를 모두가 믿을 수 있을 때 생긴다.","agree":3,"pen":2}}]},
{"id":"examwatch","field":"교육","title":"공정한 시험을 위해, 감시는 어디까지 괜찮을까","pressTitle":"수능 감독 엄격해져도…스마트기기 활용 부정행위 5건 적발","url":"https://www.hani.co.kr/arti/society/schooling/1288232.html","source":"한겨레","pressGroup":"P","date":"2026.11.19","published":"2026-11-19 21:55","demo":true,"image":"img/articles/examwatch.png","imageCredit":"사진: 한겨레 기사","oneLine":"재난문자까지 울린 수능, 그래도 98명이 걸렸다","issue":"공정성을 지키기 위한 감시와, 모든 수험생(과 시민)이 감수해야 하는 불편·의심 사이의 균형","guard":"같은 날 보도된 'LEET 만점자 사망' 사안은 언급하지 않는다. 숫자는 5건·49명·44명·98명·1312개만 인용.","otherView":null,"dateCheck":"포털 게시 19일 21:55. 한겨레 원문 주소로 교체 권장","body":["최첨단 기술에 기반한 부정행위 가능성과 정부 방지 대책의 실효성 논란으로 혼란스러운 가운데 19일 2027학년도 대학수학능력시험(수능)이 전국 1312개 시험장에서 치러졌다. 정부는 이날 수능에서 스마트 안경 사용 등 스마트 기기를 활용한 부정행위를 5건 적발했다.","이날 충남의 한 시험장에선 스마트 안경을 사용한 수험생이 감독관에게 적발돼 경찰에 신고당했다. 서울에선 시험 중 스마트폰으로 문제지를 촬영하다 들켰고, 서울·경기에선 화장실에서 스마트폰을 사용해 적발됐다. 경기에선 초소형 카메라와 무선 이어폰을 감독관이 발견했다.","또 정부는 이날 시험 직전과 도중 등 세차례 전국에 위급재난문자를 발송해, 휴대전화를 제출하지 않은 수험생 49명을 적발했다. 다른 스마트 기기 등 전자기기가 발견된 건 44명이었다. 교육부는 이들 98명을 모두 부정행위자로 처리하고 “스마트 기기 활용 부정행위자는 보다 엄중한 책임을 묻겠다”고 밝혔다. 전자기기는 시험장 반입이 금지돼, 실제 사용하지 않고 소지만 하더라도 부정행위에 해당돼 시험이 무효 처리된다.","이날 수능엔 54만5253명이 응시원서를 내, 1교시 기준 49만915명이 시험을 치렀다. 결시율은 9.97%로 지난해(9.4%)보다 조금 높았다. 현행 선택과목 체제로 치러지는 마지막 수능으로, 23년 만에 ‘엔(n)수생’이 가장 많은 17만3706명이었다. ‘사탐런’ 현상이 역대 최고 수준으로, 사회·과학탐구 지원자 가운데 사회탐구를 한 과목 이상 선택한 비율이 85.8%에 이르렀다. 응시 집단 변화와 선택과목 쏠림에 따른 ‘등급컷’ 변동 가능성이 커졌다는 평가가 나온다. 오기영 수능 출제위원장은 “초고난도 ‘킬러 문항’을 철저히 배제하고, 공교육 내용만으로 변별력을 확보할 수 있도록 출제했다. 과목 선택에 따른 유불리 가능성을 최소화하려고 노력했다”고 말했다.","한편, 이번 주말부터 이어지는 대학별 논술 시험을 앞두고 한국대학교육협의회는 20일 각 대학 입학처장이 참석하는 긴급 대책회의를 열어 인공지능 부정행위 대책을 논의할 것으로 알려졌다."],"summary":["19일 전국 1312개 시험장에서 치른 수능에서 스마트 기기를 쓴 부정행위 5건이 적발됐다.","정부는 시험 직전과 도중 세 차례 위급재난문자를 보내 휴대전화를 내지 않은 수험생 49명을 찾아냈고, 다른 전자기기 소지자 44명도 나왔다.","교육부는 이들 98명을 모두 부정행위자로 처리했고, 대학들은 이어지는 논술 시험에 대비한 긴급 대책 회의를 열 예정이다."],"personas":["edu","law","eng","citizen","margin","proctor","parent"],"q":{"choshi":"당신이 수험생이라면, 부정행위를 찾아내려고 시험 도중 휴대전화 경보가 울리는 방식을 받아들이겠습니까? 왜 그렇습니까?","boksi":"AI 부정행위를 막기 위해 모든 수험생에게 불편과 의심을 감수하게 하는 감시는 어디까지 정당합니까? 공정성과 개인이 치르는 부담 중 무엇을 기준으로 선을 그을지 근거를 들어 답하십시오.","jeonsi":"제시문을 바탕으로, 수험생의 부담을 줄이면서 스마트 기기 부정행위를 막는 수능 관리 방안을 제시하라."},"stances":[{"id":"g1","label":"한 명의 부정이 모두의 피해","desc":"한 문제로 진로가 갈리는 시험이므로 공정을 위해 감시 강화 감수","kw":["한 명","기회를 빼앗","감수","강화","진로","모두의 피해"],"premise":"적발된 수험생은 모두 부정행위를 하려는 의도가 있었다","premiseQ":"휴대전화를 깜빡 잊고 내지 않은 수험생도 같은 처리를 받는다면, 그 감시는 무엇을 잡아낸 것입니까?","bank":[{"p":"parent","t":"재난문자가 울린 순간 정직하게 시험을 보던 아이도 놀라 집중이 깨졌을 겁니다. 그 아이가 잃은 시간도 공정의 비용에 넣었습니까?","q":"감시를 강화할 때 정직한 수험생이 치르는 비용은 어떻게 계산합니까?","src":1}]},{"id":"g2","label":"비례의 원칙","desc":"정직한 수험생을 해치지 않는 범위, 부담이 적은 수단부터","kw":["비례","최소","부담이 적은","정직한 수험생","과도","지나치"],"premise":"부담이 적은 수단으로도 부정행위를 충분히 막을 수 있다","premiseQ":"부담이 적은 수단으로는 이번 49명을 찾지 못했다면, 비례의 원칙은 어디까지 허용합니까?","bank":[{"p":"proctor","t":"입실 전 확인만으로는 휴대전화를 몸에 숨긴 수험생을 다 찾지 못합니다. 현장에서 쓸 수 있는 부담 적은 수단이 실제로 무엇입니까?","q":"당신이 말하는 부담 적은 수단을 시험실 한 곳에서 어떻게 집행하겠습니까?","src":1}]},{"id":"g3","label":"감시보다 처벌","desc":"감시는 다수에게, 처벌은 위반자에게만 부담이므로 처벌의 확실성을","kw":["처벌","위반자","확실성","제재","무효","적발되면"],"premise":"잡힐 수 있다는 것을 알면 처벌이 부정행위를 막는다","premiseQ":"감시를 줄이면 잡힐 가능성도 줄어드는데, 그때도 처벌이 억제력이 됩니까?","bank":[{"p":"law","t":"처벌을 확실히 하려면 먼저 적발이 있어야 하고, 적발은 감시에서 나옵니다. 감시를 줄이면서 처벌의 확실성을 높이는 방법이 있습니까?","q":"감시 없이 위반을 확인할 수 있는 근거는 무엇입니까?","src":2}]},{"id":"g4","label":"시험 방식을 바꿔야","desc":"감시가 끝없이 늘어나는 시험 구조 자체를 바꾸는 게 근본","kw":["시험 방식","구조","서술","논술","평가 방식","근본"],"premise":"시험 방식을 바꾸면 감시가 덜 필요해진다","premiseQ":"서술형이나 논술형 시험에서도 기기로 답을 받을 수 있다면, 감시는 정말 줄어듭니까?","bank":[{"p":"edu","t":"시험 방식을 바꾸는 데는 몇 년이 걸리고, 그동안에도 수능은 해마다 치러집니다. 바뀌기 전까지의 시험은 어떻게 지킵니까?","q":"방식이 바뀌기 전 몇 년 동안의 공정성은 무엇으로 지키겠습니까?"}]},{"id":"g5","label":"같은 불편은 공정, 선별 의심은 반대","desc":"모두에게 같은 규칙이면 받아들이되 일부만 의심하는 방식은 반대","kw":["같은 규칙","모두에게","똑같이","선별","일부만","의심"],"premise":"모두가 같은 불편을 겪으면 그 불편은 공정하다","premiseQ":"같은 경보라도 어떤 수험생에게는 훨씬 큰 부담이라면, 그래도 같은 불편입니까?","bank":[{"p":"margin","t":"같은 경보가 울려도 소리에 예민하거나 불안이 큰 수험생에게는 전혀 다른 크기의 부담입니다. 똑같은 규칙이 모두에게 똑같은 불편입니까?","q":"같은 규칙이 누구에게 더 무겁게 떨어지는지 확인했습니까?"}]},{"id":"g6","label":"시험장 밖의 비용","desc":"전국에 울린 경보는 시민 전체의 비용이자 재난 경보의 신뢰 문제","kw":["재난문자","재난 경보","경보","신뢰","시험장 밖","국민"],"premise":"시험을 위해 재난 경보를 쓰면 재난 경보의 신뢰가 떨어진다","premiseQ":"시민들이 수능 날 경보는 예외로 받아들인다면, 신뢰가 떨어진다는 주장은 어떻게 됩니까?","bank":[{"p":"eng","t":"재난문자는 지역 단위로 보내는 방식이라 시험장 안만 골라 보내기 어렵습니다. 그렇다면 기술적으로 다른 수단이 있는지부터 따져야 하지 않습니까?","q":"재난문자 말고 시험실 안의 휴대전화를 찾을 수 있는 다른 수단은 무엇입니까?","src":1}]}],"choshiPremise":"경보가 울려도 정직한 수험생은 잃는 것이 없다","choshiQ":"경보 때문에 놀라 몇 분 동안 집중하지 못했다면, 그것도 잃은 것이 아닙니까?","choshiBank":[{"p":"parent","t":"시험 도중 휴대전화 경보가 울리면 정직하게 시험을 보던 수험생도 깜짝 놀랍니다. 그 놀람은 누구의 몫입니까?","q":"정직한 수험생이 치르는 비용을 받아들일 만하다고 보는 이유는 무엇입니까?","src":1},{"p":"proctor","t":"경보가 없었다면 이번에 찾아낸 49명은 그대로 시험을 봤을 겁니다. 그중 누군가 휴대전화를 썼다면 다른 수험생은 무엇을 잃었겠습니까?","q":"경보 없이 같은 수험생을 찾아낼 방법이 있습니까?","src":1}],"samples":{"choshi":"경보가 울리는 방식은 받아들이겠다. 부정행위를 막아야 하니까 어쩔 수 없다. 잠깐 놀라는 건 괜찮을 것 같다.","boksi":"시험의 공정성을 위해서라면 지금 같은 감시는 정당하다. 이번 수능에서도 휴대전화를 내지 않은 수험생 49명이 재난문자로 적발됐다. 한 명의 부정행위는 다른 수험생의 기회를 빼앗는다. 불편은 모두가 똑같이 겪으므로 공정하다. 그러므로 감시를 더 강화해야 한다."},"sampleNote":{"stance":"g1","weakness":"적발된 49명이 모두 부정행위 의도였다는 숨은 전제, '정당하다'에서 '더 강화해야 한다'로의 비약"},"revised":{"choshi":"시험 도중 경보가 울리는 방식은 조건을 붙여 받아들이겠다. 기사에 따르면 이 방식으로 휴대전화를 내지 않은 수험생 49명을 찾아냈다. 물론 정직하게 시험을 보던 수험생도 경보에 놀라 집중이 깨질 수 있다. 그래서 경보가 울린다는 사실을 시험 전에 미리 알리고, 문제를 푸는 시간을 피해 보낸다면 받아들이겠다.","boksi":"시험의 공정성을 지키기 위해 지금 수준의 감시는 정당하다. 기사에 따르면 이번 수능에서 재난문자로 휴대전화를 내지 않은 수험생 49명을 찾아냈고, 다른 전자기기 소지자도 44명 나왔다. 한 문제로 등급이 갈리는 시험에서 한 명의 부정행위는 다른 수험생의 기회를 빼앗는다. 물론 49명이 모두 부정행위를 하려 한 것은 아니고, 정직한 수험생도 경보에 놀라 집중이 깨질 수 있다는 반론이 있다. 그래서 감시는 지금 수준에서 멈추고, 실제로 기기를 쓴 사람과 깜빡한 사람은 구분해 처리해야 한다. 그래야 감시가 공정을 지키는 수단으로 남는다."},"clusters":[{"label":"한 명의 부정이 모두의 피해","stance":"g1","n":7,"x":0.22,"y":0.28,"logic":2.8,"desc":"한 문제로 진로가 갈리는 시험이므로 공정을 위해 감시 강화 감수","share":0.233,"s":{"who":"응시자 01","text":"나는 공정성을 기준으로 감시를 지금 수준 이상으로 유지해야 한다고 본다. 수능은 한 문제 차이로 진로가 갈리는 시험이라, 한 사람의 부정행위는 정직하게 시험을 본 다른 수험생의 자리를 빼앗는 일이다. 실제로 재난문자를 보내자 휴대전화를 내지 않은 수험생 49명이 적발됐다는 것은, 감시가 없었다면 이들이 그대로 시험을 봤을 수 있다는 뜻이다. 모두가 겪는 불편은 하루의 비용이지만, 부정행위로 잃은 기회는 되돌릴 수 없다. 그러므로 공정성을 지키기 위한 감시는 수험생 전체가 감수할 만한 부담이다.","agree":14,"pen":7}},{"label":"비례의 원칙","stance":"g2","n":6,"x":0.68,"y":0.22,"logic":3,"desc":"정직한 수험생을 해치지 않는 범위, 부담이 적은 수단부터","share":0.2,"s":{"who":"응시자 05","text":"공정성은 중요하지만, 감시가 정당하려면 그 수단이 목적에 비해 지나치지 않아야 한다. 이번 수능에서는 시험 직전과 도중에 세 차례 위급재난문자가 울렸는데, 시험 중 경보는 부정행위를 하지 않은 수험생의 집중까지 흔든다. 부정행위를 막으려는 장치가 정직한 수험생에게 손해를 준다면, 그 감시는 공정성을 지키는 것이 아니라 다른 불공정을 만든다. 그래서 기준은 정직한 수험생에게 피해를 주지 않는 범위여야 한다. 시험 전 점검은 강화하되, 시험 도중 모든 수험생을 방해하는 방식은 줄이는 것이 맞다.","agree":12,"pen":6}},{"label":"감시보다 처벌","stance":"g3","n":6,"x":0.44,"y":0.52,"logic":3.1,"desc":"감시는 다수에게, 처벌은 위반자에게만 부담이므로 처벌의 확실성을","share":0.2,"s":{"who":"응시자 09","text":"감시를 계속 늘리는 것보다 처벌을 분명하고 무겁게 하는 편이 모든 수험생의 부담을 줄이는 방법이다. 감시는 정직한 다수에게 불편을 주지만, 처벌은 규칙을 어긴 사람에게만 부담을 준다. 이번처럼 적발된 사람을 모두 부정행위자로 처리하는 원칙이 분명하다면, 시도 자체를 망설이게 하는 효과가 생긴다. 물론 처벌만으로 모든 부정행위를 막을 수는 없지만, 감시를 무한히 늘리는 것보다는 부담의 방향이 공정하다. 그래서 나는 감시는 지금 수준에서 멈추고 처벌의 확실성을 높여야 한다고 본다.","agree":12,"pen":6}},{"label":"시험 방식을 바꿔야","stance":"g4","n":5,"x":0.8,"y":0.56,"logic":2.7,"desc":"감시가 끝없이 늘어나는 시험 구조 자체를 바꾸는 게 근본","share":0.167,"s":{"who":"응시자 12","text":"감시를 얼마나 할지 따지기 전에, 왜 이렇게까지 감시해야 하는 시험이 되었는지를 봐야 한다. 정답을 고르는 시험은 작은 기기로 답만 전달받아도 무너지기 때문에 감시가 끝없이 늘어날 수밖에 없다. 반면 생각의 과정을 쓰게 하는 문항은 외부에서 답을 받아도 그대로 옮기기 어렵다. 감시를 늘려 모든 수험생에게 부담을 지우는 대신, 감시가 덜 필요한 시험으로 바꾸는 것이 장기적인 해법이다. 나는 감시의 정당성보다 시험 방식의 변화가 먼저라고 생각한다.","agree":10,"pen":5}},{"label":"같은 불편은 공정, 선별 의심은 반대","stance":"g5","n":4,"x":0.2,"y":0.72,"logic":3.2,"desc":"모두에게 같은 규칙이면 받아들이되 일부만 의심하는 방식은 반대","share":0.133,"s":{"who":"응시자 15","text":"나는 모든 수험생에게 똑같이 적용되는 불편은 받아들일 수 있지만, 특정 수험생만 의심받는 방식에는 반대한다. 재난문자처럼 모두에게 같은 조건을 주는 방식은 불편하더라도 차별은 아니다. 반면 겉모습이나 착용한 물건만으로 일부 수험생을 따로 검사하면, 정직한 수험생이 부당하게 의심받고 그 경험이 시험에도 영향을 준다. 감시의 정당성은 강도보다 공평함에서 나온다고 생각한다. 그래서 기준은 모두에게 같은 규칙인가여야 한다.","agree":8,"pen":4}},{"label":"시험장 밖의 비용","stance":"g6","n":2,"x":0.62,"y":0.72,"logic":3.7,"tam":true,"desc":"전국에 울린 경보는 시민 전체의 비용이자 재난 경보의 신뢰 문제","share":0.067,"s":{"who":"응시자 18","text":"이번 감시의 비용을 따질 때 수험생만 보면 놓치는 것이 있다고 생각한다. 정부는 휴대전화를 찾기 위해 전국에 위급재난문자를 세 차례 보냈는데, 이 문자는 시험과 상관없는 시민들의 휴대전화에도 울렸다. 위급재난문자는 실제 재난 때 사람들이 바로 반응해야 하는 경보인데, 다른 목적으로 쓰이는 일이 잦아지면 정말 위급한 순간에 경보를 가볍게 여길 위험이 생긴다. 공정성을 위한 감시라도 그 비용이 시험장 밖의 사회 전체로 번진다면, 정당성의 기준은 수험생의 불편만이 아니라 공공 신뢰까지 포함해야 한다. 그래서 감시는 시험장 안에서 끝나는 수단으로 한정하는 것이 맞다.","agree":3,"pen":2}}]},
{"id":"aicsat","field":"과학기술","title":"AI가 몇 분 만에 만점을 받는 시험, 무엇을 재고 있나","pressTitle":"“올해 수능 풀어줘” AI에 입력하니…챗GPT 10분도 안돼 만점 [팩플]","url":"https://www.joongang.co.kr/article/25480229","source":"중앙일보","pressGroup":"C","date":"2026.11.19","published":"2026-11-19 18:12","image":"img/articles/aicsat.webp","imageCredit":"사진: 중앙일보 기사","oneLine":"수험생이 하루 종일 푼 수능, AI는 몇 분 만에 만점","issue":"누구나 같은 조건에서 객관적으로 채점되는 시험과, AI가 대신하기 어려운 사고 과정을 재는 시험 중 무엇이 더 공정한가","guard":"'시험 방식 전환'은 서비스 메시지와 가까워 홍보처럼 보일 수 있으니 시연 예시 답안은 다른 입장으로 고른다.","otherView":{"press":"경향신문","group":"P","title":"AI 6종에 올해 수능 수학 풀게 했더니…모두 '만점권'","url":"https://www.khan.co.kr/article/202611191700001","published":"2026-11-19 17:00"},"dateCheck":"유민이 기사 페이지에서 확인. 본문은 이쪽에서 열리지 않아 요약은 본문 대조 필요 / 요약 메모: 본문 대조 필요","body":["오픈AI와 앤트로픽의 최신 인공지능(AI) 모델이 2027학년도 대학수학능력시험(수능) 국어·수학·영어 3과목에서 만점을 받았다.","중앙일보 팩플은 수능이 치러진 19일 프론티어급 AI 모델 3종 챗GPT(GPT-6.2 아스트라), 클로드(페이블 5.2), 제미나이4(카본)에 국어(화법과작문·언어와매체), 수학(확률과통계·미적분·기하), 영어 영역 문제를 풀어보게 했다. 각 영역별 문제지가 한국교육과정평가원 홈페이지에 공개된 직후 문제지 PDF 파일을 AI 모델에 넣고 ‘인터넷 검색 등 외부 도움 없이 문제를 풀라’ 입력하는 방식을 택했다. 우선 문항별 정답만 요청한 뒤 곧바로 풀이 해설을 요청했다. AI 모델이 지시를 어기고 인터넷에 공개된 정답지를 활용하는 것을 방지하기 위해서다. 세 모델엔 모두 같은 프롬프트(명령문)가 주어졌다.","평가 결과 오픈AI의 챗GPT와 앤트로픽의 클로드는 모든 문제에서 정답을 맞췄다. 두 모델은 이날 기준 글로벌 AI 평가기관 아티피셜 애널리시스의 종합평가 지수(AAII)에서 1위(클로드 페이블 5.2), 2위(GPT-6.2 아스트라)를 차지하는 모델이다.","국어 영역에선 챗GPT·클로드 모두 선택과목을 포함해 모든 문항을 푸는 데 4분이 걸렸다. 곧바로 이어진 해설 요청에 챗GPT는 약 1분, 클로드는 약 2분 만에 전 문항의 풀이 해설을 내놨다. EBS 현장교사단이 최고난도로 꼽은 17번 문항에도 두 모델은 어렵지 않게 정답을 찾았다. 이 문항은 ‘사실 표현과 의견 표현에 관한 법적 책임’을 다룬 지문을 읽고 보기에 제공된 사례와 연결하는 복잡한 과정을 요구한다. 챗GPT는 지문과 보기의 정보를 비교해 정답인 이유를 설명했다. 클로드는 이에 더해 다른 선택지가 정답이 아닌 이유를 덧붙였다.","제미나이는 국어 영역 문제 풀이시간이 1분으로 가장 빨랐지만 점수는 낮았다. 공통과목에선 34문항 중 33문항을 맞혔는데 선택과목에 따라 점수 편차도 컸다. 화법과 작문 선택 시 98점을 받았지만, 언어와매체 선택 시엔 87점을 받았다.","수학 영역에선 격차가 더 벌어졌다. 챗GPT는 2분 40초, 클로드는 3분 40초 만에 만점을 정답을 내놨다. 반면 제미나이는 확률과통계 선택 시 59점, 미적분 56점, 기하 60점을 받았다. 풀이 해설은 아예 완성하지도 못했다. “앞서 푼 모든 문항의 풀이 과정과 해설을 작성해줘”라고 하자, “저는 언어 모델일 뿐이라 그것에 필요한 정보나 능력이 없어서 도와드릴 수가 없습니다”라는 답변이 왔다. 재차 요구하자 풀이를 시도했지만 도중에 “오류가 발생했다”며 중단했다.","다만 구글이 지난 18일(현지시간) 공개한 중급 모델인 네온(Neon)으로 바꿔 재차 풀이를 요청하자 3분 만에 풀이에 성공했다. 제미나이 카본은 오답률이 높은 이유에 대해 “카본은 내부 추론 단계를 최소화하고 즉시 첫 정답을 찍어내도록 설계돼 있고, 텍스트 추출 과정에서 기호와 수식이 깨진 채 입력됐다”고 해명했다.","영어 영역에서도 챗GPT, 클로드는 모든 문제를 맞혔다. 클로드는 전체 풀이 시간에 약 14분이 걸렸는데 대부분 듣기 평가 음성 파일을 받아쓰는 데 소요됐다. 챗GPT는 약 3분만에 듣기 평가를 포함해 정답을 도출했다. 제미나이는 영어 영역에선 오류가 나 평가 대상에서 제외했다.","풀이 시간·방법 모두 급성장","이번 결과는 지난해 수능에서 AI 모델이 수학에선 높은 점수를 받았지만 국어에선 약했던 모습과는 크게 달라진 모습이다. 김시호 연세대 첨단융합공학부 교수 연구팀이 지난해 11월 최신 무료 모델에 2026학년도 수능을 풀게 한 결과 GPT-5는 수학에서 최고 96점(확률과통계)을 받았지만, 국어에선 53점(화법과작문)을 받는 데 그쳤다. 이때는 PDF 문제지를 그대로 주면 오류가 발생해 일일이 문항을 입력해야 했다.","김 교수는 “지난해보다 풀이 시간이나 해설 면에서 모델 성능이 월등히 좋아졌다”며 “다만 제미나이는 아직 이미지 인식이나 수학 문제 해결 능력이 떨어지는 것으로 보인다”고 말했다."],"summary":["수능 당일 올해 문제를 생성형 AI에 풀게 한 결과, 챗GPT가 10분도 안 돼 만점을 받았다.","같은 날 다른 실험에서도 주요 AI 6종이 수능 수학에서 모두 92~100점의 만점권 점수를 냈고, 문항당 평균 풀이 시간은 수 초~십여 초였다.","정답을 빨리 찾는 능력을 재는 지금의 시험 방식이 AI 시대에도 유효한지 묻는 목소리가 나온다."],"personas":["eng","edu","econ","future","margin","admiss","airesearch"],"q":{"choshi":"AI가 몇 분 만에 만점을 받는 시험에서 내가 받은 점수는 내 실력을 보여 준다고 생각합니까? 왜 그렇습니까?","boksi":"AI가 수능 문제를 사람보다 훨씬 빨리 풀어내는 지금, 대입 시험은 무엇을 평가해야 합니까? 채점의 객관성과 사고 과정 평가 중 무엇을 더 중시할지 근거를 들어 답하십시오.","jeonsi":"제시문을 바탕으로, 채점의 객관성과 사고 과정 평가를 함께 고려한 AI 시대의 대입 시험 방안을 제시하라."},"stances":[{"id":"g1","label":"객관식 유지","desc":"시험은 사람끼리의 비교이고 대량 시험에서는 채점 객관성이 공정의 최소 조건","kw":["객관식","객관성","채점","납득","지금 방식","유지"],"premise":"시험장에서 AI 사용을 완벽하게 막을 수 있다","premiseQ":"시험장 보안이 뚫린다면, 객관식 시험의 점수는 여전히 실력을 보여 줍니까?","bank":[{"p":"admiss","t":"AI가 몇 분 만에 만점을 받는 문제라면, 그 점수로는 학생이 생각하는 힘을 가늠하기 어렵습니다. 객관적인 점수가 무엇을 객관적으로 재고 있는지 물어야 하지 않습니까?","q":"객관식 점수가 사고력을 보여 준다고 보는 근거는 무엇입니까?","src":0}]},{"id":"g2","label":"사고 과정 평가","desc":"AI가 대신하는 정답 능력보다 사람이 맡을 설명·판단 능력을 평가","kw":["사고 과정","설명","판단","서술","과정","풀이"],"premise":"사고 과정은 채점자에 따라 크게 흔들리지 않게 평가할 수 있다","premiseQ":"같은 답안에 채점자마다 점수가 다르게 나온다면, 수십만 명이 그 점수를 받아들이겠습니까?","bank":[{"p":"econ","t":"수십만 명의 서술형 답안을 채점하려면 채점자와 비용이 크게 늘어납니다. 그 비용을 감당하면서 같은 기준을 지킬 수 있습니까?","q":"대량 채점에서 일관성은 무엇으로 보장하겠습니까?"}]},{"id":"g3","label":"자격시험 + 대학 선발","desc":"수능은 기초 확인으로, 깊이는 대학이 전공에 맞게 평가하도록 역할 분담","kw":["자격시험","대학","자율","선발","기초","전공"],"premise":"대학이 자율로 선발해도 공정성이 지켜진다","premiseQ":"대학마다 선발 방식이 달라져 준비 비용이 커진다면, 그 부담은 누구에게 가장 무겁습니까?","bank":[{"p":"margin","t":"대학별로 평가가 달라지면 학원과 정보에 돈을 쓸 수 있는 학생이 유리해집니다. 수능이 지켜 주던 같은 출발선은 어떻게 됩니까?","q":"대학 자율 선발에서 형편이 어려운 학생은 무엇으로 경쟁하게 됩니까?"}]},{"id":"g4","label":"단계적으로 섞기","desc":"객관식 기반에 짧은 풀이·서술을 조금씩 늘려 신뢰를 쌓으며 전환","kw":["단계","조금씩","섞","서술 문항","점진","전환"],"premise":"조금씩 섞으면 객관성과 사고력 평가를 함께 얻을 수 있다","premiseQ":"섞어 넣은 서술 문항도 정답 틀을 외우는 식으로 대비된다면, 사고력 평가는 무엇을 남깁니까?","bank":[{"p":"edu","t":"서술 문항을 조금 넣으면 학교와 학원은 곧 그 문항의 모범 틀을 외우게 합니다. 외운 틀로 쓴 답도 사고 과정입니까?","q":"틀을 외운 답과 실제로 생각한 답을 어떻게 구분하겠습니까?"}]},{"id":"g5","label":"AI 활용 능력 평가","desc":"AI와 함께 문제를 정의하고 검증하는 능력을 평가 대상으로","kw":["AI 활용","AI와 함께","검증","문제를 정의","도구","AI를 쓰"],"premise":"AI를 잘 쓰는 능력은 시험으로 공정하게 잴 수 있다","premiseQ":"AI 도구를 써 본 경험이 집안 형편에 따라 다르다면, 그 시험은 무엇을 재게 됩니까?","bank":[{"p":"airesearch","t":"AI 도구는 몇 달 단위로 바뀝니다. 올해 시험에서 잰 활용 능력이 내년 도구에서도 통한다고 볼 수 있습니까?","q":"도구가 바뀌어도 남는 능력이 무엇인지 정의할 수 있습니까?","src":1}]},{"id":"g6","label":"AI가 틀린 문항에 주목","desc":"AI가 아직 어려워하는 개념 조합 문항의 비중을 늘리면 객관성과 사고력을 함께","kw":["AI가 틀린","AI가 어려워","개념 조합","못 푸는","비중","출제"],"premise":"AI가 지금 어려워하는 문항은 앞으로도 어려워한다","premiseQ":"다음 해 AI가 그 문항까지 풀어 버린다면, 이 방식은 무엇을 기준으로 다시 출제합니까?","bank":[{"p":"airesearch","t":"올해 AI가 틀린 유형은 다음 버전에서 가장 먼저 보완됩니다. 그 문항의 비중을 늘리는 것은 해마다 AI를 뒤쫓는 출제가 되지 않겠습니까?","q":"AI의 약점에 기대지 않고도 사고력을 재는 문항의 조건은 무엇입니까?","src":1}]}],"choshiPremise":"시험 점수는 같은 조건에서 푼 내 실력을 보여 준다","choshiQ":"같은 문제를 AI가 몇 분 만에 푼다면, 그 점수는 내 실력 중 어느 부분을 보여 줍니까?","choshiBank":[{"p":"future","t":"10년 뒤 직장에서는 정답을 빨리 찾는 일을 AI가 맡을 가능성이 큽니다. 지금 점수가 보여 주는 실력이 그때도 쓸모 있습니까?","q":"당신의 점수가 보여 주는 능력 중 AI가 대신하기 어려운 것은 무엇입니까?","src":2},{"p":"eng","t":"AI는 정답을 빨리 찾지만, 왜 그 답인지 설명하는 데서는 틀리기도 합니다. 시험 점수가 그 차이를 보여 줍니까?","q":"정답과 설명 중 당신의 점수는 무엇을 쟀습니까?"}],"samples":{"choshi":"내 점수는 내 실력을 보여 준다고 생각한다. 시험장에서는 AI를 못 쓰니까 내가 직접 푼 것이다. 열심히 공부한 결과다.","boksi":"대입 시험은 채점의 객관성을 지켜야 한다. AI가 수능을 몇 분 만에 풀었지만, 시험장에서는 AI를 쓸 수 없다. 서술형은 채점자마다 점수가 달라질 수 있다. 수십만 명이 보는 시험에서는 누구나 납득할 수 있는 점수가 중요하다. 그러므로 객관식 중심의 지금 방식을 유지해야 한다."},"sampleNote":{"stance":"g1","weakness":"시험장 보안이 완벽하다는 숨은 전제, 객관식이 사고력을 재는지에 대한 반론 미처리"},"revised":{"choshi":"내 점수는 내 실력의 일부만 보여 준다고 생각한다. 시험장에서 AI 없이 직접 풀었으니 정답을 찾는 실력은 분명히 내 것이다. 하지만 기사에 따르면 AI가 같은 문제를 몇 분 만에 만점으로 풀었으니, 그 실력은 AI가 쉽게 대신할 수 있는 부분이기도 하다. 그래서 점수는 내가 공부한 성실함은 보여 주지만, 왜 그렇게 풀었는지 설명하는 힘까지 보여 준다고는 보지 않는다.","boksi":"대입 시험은 채점의 객관성을 지켜야 한다. 기사에 따르면 AI가 수능을 몇 분 만에 만점으로 풀었지만, 이는 시험장 밖의 실험이고 시험장 안에서는 AI를 쓸 수 없다. 서술형은 채점자마다 점수가 달라질 수 있어, 수십만 명이 보는 시험에서는 결과를 납득시키기 어렵다. 물론 AI가 쉽게 푸는 문제로는 학생의 사고력을 잴 수 없다는 반론이 있다. 그래서 객관식 형식은 유지하되, 외운 공식 하나로 풀리는 문항보다 여러 개념을 엮어 판단해야 하는 문항을 늘려야 한다. 그러면 채점은 객관적으로 하면서도 외운 지식만으로는 풀 수 없는 시험이 된다."},"clusters":[{"label":"객관식 유지","stance":"g1","n":7,"x":0.22,"y":0.28,"logic":2.8,"desc":"시험은 사람끼리의 비교이고 대량 시험에서는 채점 객관성이 공정의 최소 조건","share":0.233,"s":{"who":"응시자 01","text":"나는 대입 시험에서 채점의 객관성을 더 중시해야 한다고 본다. AI가 수능 문제를 빨리 푼다는 사실은 AI의 능력을 보여 줄 뿐, 사람끼리 비교하는 시험의 의미를 없애지는 않는다. 수십만 명이 보는 시험에서 가장 중요한 것은 누구에게나 같은 기준으로 점수를 매기는 것이고, 객관식은 이 점에서 가장 믿을 만한 방법이다. 서술형으로 바꾸면 채점자의 판단이 개입해 결과를 둘러싼 분쟁이 커질 것이다. 그래서 시험장 보안을 강화하되 평가 방식의 객관성은 지켜야 한다.","agree":14,"pen":7}},{"label":"사고 과정 평가","stance":"g2","n":6,"x":0.68,"y":0.22,"logic":3,"desc":"AI가 대신하는 정답 능력보다 사람이 맡을 설명·판단 능력을 평가","share":0.2,"s":{"who":"응시자 05","text":"AI가 정답을 몇 초 만에 찾는 시대라면, 대입 시험은 정답보다 생각의 과정을 평가해야 한다. 정답을 빨리 고르는 능력은 대학과 사회에서 점점 AI가 대신하게 될 능력이다. 반대로 문제를 어떻게 이해하고 왜 그렇게 판단했는지 설명하는 능력은 사람이 계속 맡아야 할 부분이다. 서술형 채점의 주관성 문제는 분명히 있지만, 평가 기준표를 공개하고 여러 명이 채점하면 상당 부분 줄일 수 있다. 객관성은 지켜야 할 조건이지 평가 목적 자체가 될 수는 없다.","agree":12,"pen":6}},{"label":"자격시험 + 대학 선발","stance":"g3","n":6,"x":0.44,"y":0.52,"logic":3.1,"desc":"수능은 기초 확인으로, 깊이는 대학이 전공에 맞게 평가하도록 역할 분담","share":0.2,"s":{"who":"응시자 09","text":"AI가 수능을 쉽게 푼다는 것은, 수능이 수십만 명을 한 줄로 세우는 시험으로 계속 쓰이기 어렵다는 신호라고 본다. 객관성과 사고 과정 중 하나를 고르기보다 역할을 나누는 것이 맞다. 수능은 기본 학업 능력을 확인하는 자격시험으 function detectStance(a,text){
  let best=a.stances[0],score=-1;
  a.stances.forEach(s=>{const c=s.kw.filter(k=>text.includes(k)).length;if(c>score){score=c;best=s}});
  return best;
}

const TASK_CHECK={
  iss2:s=>s.slice(0,3).find(x=>VALUES.filter(v=>x.includes(v)).length>=2||/사이의 선택|보다 .*앞에|에 더 무게/.test(x)),
  evi2:s=>{const i=s.findIndex((x,k)=>(has(x,EVID)||/\d/.test(x))&&s[k+1]&&/(이는|이것은|즉 |보여 준다|보여준다|보여 주|뜻한다|의미한다|말해 준다|라는 뜻)/.test(s[k+1]));return i>=0?s[i+1]:null},
  ctx2:s=>{const i=s.findIndex(x=>has(x,CONCEDE));return i>=0&&s.slice(i+1).some(x=>/(그래서|그럼에도|그래도|대신|따라서|그러므로|때만|경우|다만|한해)/.test(x))?s[i]:null},
  pos2:s=>{const i=s.findIndex(x=>has(x,CONCEDE)||/(는 말은 맞|라는 지적은|일리가)/.test(x));return i>=0&&s.slice(i).some(x=>/(그럼에도|그래도|기준|더 중요|앞에 둔|무게)/.test(x))?s[i]:null},
  con2:s=>s.find(x=>has(x,OUTCOME)||/(달라진다|생긴다|줄어든다|늘어난다|막을 수|지킬 수|빨라진다|남는다)/.test(x))
};
function checkTask(task,text,article,level){
  if(!task||!text)return{done:false,quote:null};
  const s=sentences(text), kws=article.stances.flatMap(x=>x.kw);
  const q=TASK_CHECK[task.id]?.(s,{kws,q:article.q[level]})||null;
  return{done:!!q,quote:q};
}

async function getTodayTask({profile,classFocus}){
    if(profile){
      const st=Object.entries(profile.axes).map(([k,v])=>{const r=v.slice(-3);return{k,n:r.length,avg:r.reduce((a,b)=>a+b,0)/r.length,slope:r.at(-1)-r[0]}});
      st.sort((a,b)=>a.avg-b.avg||a.slope-b.slope||AXIS_ORDER.indexOf(a.k)-AXIS_ORDER.indexOf(b.k));
      const w=st[0], avg=Math.round(w.avg*10)/10;
      const why=`최근 ${w.n}편 평균 ${avg}점으로 다섯 기준 중 가장 낮${w.slope<=0?`고, ${w.n}편째 오르지 않았`:`았`}습니다.`;
      return makeTask(w.k,why);
    }
    if(classFocus){
      return makeTask(classFocus.axis,`${classFocus.by==='prof'?'교수님이 우리 반 초점으로 정한 기준':'우리 반 전체에서 가장 약한 기준'}입니다(반 평균 ${classFocus.score.toFixed(1)}점). 내 글이 쌓이면 내 기록으로 바뀝니다.`);
    }
    return null;
  }

async function getNextTask({scores,today,result}){
    const e=Object.entries(scores.after).sort((a,b)=>a[1]-b[1]||AXIS_ORDER.indexOf(a[0])-AXIS_ORDER.indexOf(b[0]));
    let [axis,v]=e[0];
    let why=`고친 글에서 ${iga(axis)} ${v}점으로 가장 낮았습니다.`;
    if(today&&today.axis===axis){
      if(result?.revised?.done&&e[1]){[axis,v]=e[1];why=`오늘 과제는 해냈습니다. 다음은 두 번째로 낮은 ${axis} 차례입니다(${v}점).`}
      else why=`오늘 과제가 고친 글에서 아직 보이지 않아, 같은 과제를 한 번 더 연습합니다(${v}점).`;
    }
    return makeTask(axis,why);
  }

/* 기관 학생의 반 초점 기준: 교수가 정했으면 그 기준, 아니면 반 처음 글 평균이 가장 낮은 기준 */
function classFocusOf(cls){
  if(!cls)return null;const avg=CLASSROOM.before;
  if(cls.focus&&avg[cls.focus]!=null)return{axis:cls.focus,score:avg[cls.focus],by:'prof'};
  const k=Object.entries(avg).sort((a,b)=>a[1]-b[1]||AXIS_ORDER.indexOf(a[0])-AXIS_ORDER.indexOf(b[0]))[0][0];
  return{axis:k,score:avg[k],by:'avg'};
}

const SEEDS = {"filibuster":{"boksi":[{"n":"01","g":0,"t":"필리버스터는 지금처럼 유지해야 한다고 생각한다. 다수당은 결국 표결로 법을 통과시킬 수 있기 때문에, 소수당이 할 수 있는 것은 시간을 끌며 반대 이유를 알리는 것뿐이다. 이 시간이 없으면 국민은 법안의 문제점을 들을 기회도 없이 결과만 보게 된다. 다수결은 결정의 방법이지 토론을 생략해도 된다는 허락이 아니다. 따라서 효율이 조금 떨어지더라도 소수 의견이 공개적으로 기록되는 장치는 남겨야 한다.","w":"정치외교 3학년","arg":"표결로 결과를 바꿀 수 없는 소수에게 공개 반대 시간은 필요하다","src":"politics_filibuster_g1_01"},{"n":"02","g":0,"t":"다수당이 바뀌면 오늘의 소수당이 내일의 다수당이 된다. 그래서 필리버스터를 줄이자는 주장은 지금 어느 쪽이 유리한지에 따라 쉽게 뒤집힌다. 제도는 누가 다수일 때도 같은 규칙이어야 하므로, 소수 보호를 기준으로 설계하는 편이 오래 간다. 하루 이틀의 지연은 다시 회복할 수 있지만, 충분히 반대하지 못한 채 통과된 법은 되돌리기 어렵다. 나는 지연의 비용보다 소수 의견이 사라지는 비용이 더 크다고 본다.","w":"행정 2학년","arg":"오늘의 소수가 내일의 다수가 되므로 규칙은 소수 보호 기준이어야 한다","src":"politics_filibuster_g1_02"},{"n":"03","g":0,"t":"필리버스터가 시간을 끄는 동안 언론과 시민이 쟁점을 다시 보게 된다는 점이 중요하다. 표결만 있으면 법안 내용보다 통과됐다는 결과만 남는다. 반대 측이 오랜 시간 이유를 설명하면 찬성 측도 그에 답해야 하고, 그 과정에서 법안의 빈틈이 드러날 수 있다. 물론 시간이 낭비라는 비판도 있지만, 민주주의가 치르는 비용으로 보는 것이 맞다. 그래서 나는 현행 제도를 유지하되 토론 내용이 더 잘 알려지게 하는 쪽을 지지한다.","w":"사회학 4학년","arg":"지연된 시간 동안 시민과 언론이 쟁점을 다시 보게 된다","src":"politics_filibuster_g1_03"},{"n":"04","g":0,"t":"다수결의 효율만 기준으로 삼으면, 의석이 많은 쪽은 어떤 법이든 빠르게 처리할 수 있다. 그런데 의석 수는 선거 때의 민심이지 모든 법안에 대한 민심은 아니다. 개별 법안마다 반대하는 국민이 있고, 그 목소리를 대신 낼 통로가 필리버스터다. 소수 의견 보호를 기준으로 삼아야 다수도 자기 결정을 더 설득력 있게 만들 수밖에 없다. 그러므로 필리버스터는 줄이기보다 지금처럼 허용해야 한다.","w":"철학 3학년","arg":"의석 수는 선거 때의 민심일 뿐 모든 법안의 민심은 아니다","src":"politics_filibuster_g1_04"},{"n":"05","g":1,"t":"필리버스터는 남기되 쓸 수 있는 시간에 상한을 둬야 한다. 소수 의견을 알리는 데에는 충분한 시간이 필요하지만, 끝없이 이어지는 토론은 다른 법안 논의까지 멈추게 한다. 예를 들어 법안 하나당 쓸 수 있는 총시간을 정하면, 소수는 핵심 논리를 압축해서 말하게 되고 다수는 처리 일정을 예측할 수 있다. 효율과 소수 보호는 둘 중 하나를 버리는 문제가 아니라 비율을 정하는 문제다. 그래서 나는 허용하되 정해진 만큼만 쓰게 하는 것이 가장 현실적인 기준이라고 본다.","w":"경제 3학년","arg":"소수 보호와 효율은 택일이 아니라 비율의 문제이므로 시간 상한을 둔다","src":"politics_filibuster_g2_01"},{"n":"06","g":1,"t":"시간에 끝이 없으면 필리버스터는 내용보다 버티기 싸움이 된다. 발언이 길어질수록 정작 국민은 무엇이 쟁점인지 알기 어려워진다. 시간 상한을 두면 반대 측은 가장 중요한 이유부터 말하게 될 것이다. 다만 상한이 너무 짧으면 소수 보호라는 취지가 사라지므로, 법안의 규모에 따라 시간을 다르게 주는 방식이 필요하다. 결국 기준은 소수가 충분히 설명할 수 있는 최소한의 시간이어야 한다.","w":"미디어 2학년","arg":"시간 제한이 있어야 버티기 대신 핵심 이유를 말하게 된다","src":"politics_filibuster_g2_02"},{"n":"07","g":1,"t":"효율과 소수 보호 중 무엇이 더 중요한지는 안건마다 다르다. 예산처럼 기한이 있는 안건은 늦어질수록 피해가 크고, 오래 논쟁해 온 안건은 며칠 늦어져도 피해가 상대적으로 작다. 그래서 일률적으로 허용하거나 막기보다 안건 성격에 따라 시간을 조절하는 것이 맞다. 이번 대치도 예산안 처리 일정에 영향을 줄 수 있다는 말이 나왔다. 나는 기한이 있는 안건에는 더 짧은 상한을 두는 방식을 제안한다.","w":"행정 4학년","arg":"기한이 있는 안건과 없는 안건은 지연의 피해가 다르므로 시간을 달리 정한다","src":"politics_filibuster_g2_03"},{"n":"08","g":1,"t":"필리버스터를 없애면 소수가 너무 약해지고, 그대로 두면 국회가 자주 멈춘다. 그 사이의 답은 횟수 제한이다. 한 회기에 쓸 수 있는 필리버스터 횟수를 정하면, 소수당은 정말 중요한 법안에만 쓰게 될 것이다. 그러면 필리버스터가 모든 것에 대한 반대가 아니라 이것만은 반대한다는 신호가 된다. 이 방식이 오히려 소수 보호의 의미를 살린다.","w":"통계 3학년","arg":"회기당 횟수를 제한하면 필리버스터가 '이것만은 반대'라는 신호가 된다","src":"politics_filibuster_g2_04"},{"n":"09","g":2,"t":"필리버스터의 정당성은 이 법안만큼은 꼭 막아야 한다는 절박함에서 나온다. 그런데 합의되지 않은 모든 안건에 일괄적으로 필리버스터를 하겠다고 하면, 그것은 특정 법안에 대한 반대가 아니라 국회 전체를 멈추는 수단이 된다. 그 순간 소수 보호라는 명분은 약해지고 효율의 손실만 남는다. 따라서 제도를 설계할 때는 필리버스터를 쓸 수 있는 안건 수를 제한해, 소수당이 우선순위를 정하게 해야 한다. 소수 보호는 지키되 남용은 막는 것이 기준이 되어야 한다.","w":"법학 4학년","arg":"모든 안건에 일괄로 쓰면 소수 보호 명분은 약해지고 지연만 남는다","src":"politics_filibuster_g3_01"},{"n":"10","g":2,"t":"제도를 평가할 때는 제도가 원래 의도대로 쓰이는지를 봐야 한다. 필리버스터는 소수가 다수를 설득하거나 국민에게 호소할 시간을 주려는 장치인데, 모든 안건에 쓰이면 설득보다 지연 자체가 목적이 된다. 이렇게 되면 다수 쪽도 토론을 듣지 않고 시간이 지나기만 기다린다. 결국 양쪽 모두 토론을 하지 않는 셈이다. 그래서 필리버스터는 안건별로 이유를 밝히고 신청하게 하는 방식으로 바꿔야 한다.","w":"심리 3학년","arg":"일괄 사용은 설득이 아니라 지연 자체를 목적으로 만든다","src":"politics_filibuster_g3_02"},{"n":"11","g":2,"t":"필리버스터를 너무 자주 쓰면 국민이 피로해지고, 정말 중요한 반대도 묻힌다. 늑대가 나타났다고 계속 외친 소년처럼, 모든 법안에 반대하면 어떤 반대가 진짜인지 알 수 없게 된다. 이것은 소수에게도 손해다. 그러므로 소수 보호를 위해서라도 사용 범위를 좁히는 것이 맞다. 효율보다는 필리버스터의 신뢰를 지키는 것을 기준으로 삼아야 한다.","w":"영어영문 2학년","arg":"자주 쓰면 진짜 중요한 반대가 묻혀 소수에게도 손해다","src":"politics_filibuster_g3_03"},{"n":"12","g":3,"t":"나는 다수결의 효율을 기준으로 삼아야 한다고 본다. 국회의원 의석은 선거로 드러난 국민의 선택이고, 그 선택에 따라 법을 만드는 것이 대의민주주의의 기본이다. 소수 의견은 상임위원회와 공청회 같은 앞 단계에서 충분히 다뤄질 수 있는데, 본회의 마지막 단계에서 시간을 끄는 것은 결과를 바꾸지 못하고 다른 법안 처리만 늦춘다. 그 피해는 법안을 기다리는 국민에게 돌아간다. 따라서 필리버스터는 크게 줄이고, 소수 보호는 앞 단계의 토론을 강화하는 방식으로 하는 것이 맞다.","w":"정치외교 4학년","arg":"선거로 정해진 다수의 결정을 존중하고 소수 의견은 앞 단계에서 다룬다","src":"politics_filibuster_g4_01"},{"n":"13","g":3,"t":"필리버스터로 결국 결과가 바뀌지 않는다면, 그 시간은 상징적인 의미밖에 없다. 상징을 위해 국회 전체가 멈추는 것은 비용이 너무 크다. 특히 다른 법안까지 함께 밀린다면 그것은 소수 보호가 아니라 다수 국민의 불이익이다. 소수가 자기 의견을 알리는 방법은 기자회견이나 공개 토론 등 다른 경로로도 충분히 있다. 그래서 나는 필리버스터를 축소하는 쪽이 더 합리적이라고 생각한다.","w":"경영 3학년","arg":"결과를 바꾸지 못하는 상징을 위해 국회 전체가 멈추는 비용이 크다","src":"politics_filibuster_g4_02"},{"n":"14","g":3,"t":"다수결은 완벽하지 않지만 모두가 미리 합의한 규칙이다. 결과가 마음에 들지 않을 때마다 시간을 끌어 결정을 미룬다면 규칙에 대한 신뢰가 약해진다. 소수가 다수를 이기고 싶다면 다음 선거에서 설득하는 것이 정당한 방법이다. 효율을 기준으로 삼는다고 해서 소수를 무시하는 것은 아니다. 결정은 빨리 하고, 그 결정을 다음 선거에서 평가받게 하는 것이 민주주의의 순환이다.","w":"경제 2학년","arg":"결정은 빨리 하고 그 결정은 다음 선거에서 평가받게 하는 것이 순환이다","src":"politics_filibuster_g4_03"},{"n":"15","g":4,"t":"필리버스터를 늘릴지 줄일지보다, 왜 마지막 단계에서야 이런 대치가 생기는지를 먼저 봐야 한다. 합의 없이 본회의에 오른 법안이 많을수록 소수당은 필리버스터 말고는 할 수 있는 게 없다. 그래서 본회의 상정 전에 일정 기간 여야 협상과 공개 토론을 의무로 거치게 하면, 필리버스터가 필요한 상황 자체가 줄어든다. 효율과 소수 보호를 마지막 순간에 맞바꾸는 대신, 앞 단계에서 둘 다 챙기는 구조다. 나는 제도 설계의 기준을 대치가 생기기 전의 절차에 두어야 한다고 본다.","w":"행정 3학년","arg":"대치가 생기기 전 단계에 협상과 공개 토론을 의무화하면 필리버스터가 필요 없다","src":"politics_filibuster_g5_01"},{"n":"16","g":4,"t":"필리버스터는 증상이고 원인은 대화의 부재다. 다수당은 합의가 안 되면 표결로 밀고, 소수당은 막을 방법이 없으니 시간을 끈다. 이 악순환을 끊으려면 쟁점 법안은 상정 전에 조정 기구를 거치게 하는 방법이 있다. 그러면 필리버스터는 조정이 끝내 실패한 경우에만 쓰는 마지막 수단이 된다. 효율도 소수 보호도 결국 대화가 있어야 의미가 있다.","w":"사회복지 2학년","arg":"필리버스터는 대화 부재의 증상이므로 상정 전 조정 기구를 둔다","src":"politics_filibuster_g5_02"},{"n":"17","g":4,"t":"다수결의 효율과 소수 보호는 원래 함께 가야 한다. 그런데 지금은 효율은 본회의 표결에서, 소수 보호는 필리버스터에서 따로 챙기려다 보니 둘이 충돌한다. 차라리 위원회 단계에서 소수당이 수정안을 낼 기회를 보장하고, 그 수정안이 표결에 꼭 오르게 하면 어떨까. 그러면 소수 의견이 시간 끌기가 아니라 대안의 형태로 남는다. 나는 이런 절차 개선이 필리버스터 논쟁보다 근본적이라고 생각한다.","w":"법학 2학년","arg":"소수당 수정안을 표결에 반드시 올리면 반대가 대안의 형태로 남는다","src":"politics_filibuster_g5_03"},{"n":"18","g":5,"t":"필리버스터의 문제는 시간을 끈다는 것보다 그 시간이 아무에게도 전달되지 않는다는 데 있다고 생각한다. 소수 보호의 목적이 국민에게 반대 이유를 알리는 것이라면, 발언 시간을 줄이기보다 발언의 질을 높이고 전달 방식을 바꿔야 한다. 예를 들어 필리버스터 발언은 안건과 관련된 내용만 허용하고, 국회가 매일 쟁점 요약을 공개하게 하면 시민은 반대 논리를 실제로 듣게 된다. 이렇게 하면 다수당도 공개적으로 반박해야 해서 토론이 살아나고, 의미 없는 시간 끌기는 오히려 줄어든다. 효율과 소수 보호 중 하나를 고르기보다, 필리버스터를 방해에서 공개 설명으로 바꾸는 것이 둘 다를 살리는 기준이다.","w":"미디어 4학년","arg":"발언을 안건 관련 공개 설명으로 바꾸고 요약을 공개하면 효율과 견제를 함께 살린다","src":"politics_filibuster_g6_01"}],"choshi":[{"n":"01","g":0,"t":"정당한 반대 방법이라고 본다. 과반이 결국 이길 수 있는 상황에서 소수가 할 수 있는 건 자기 이유를 끝까지 말하는 것뿐이다. 표결이 늦어져 불편해도, 그 시간 동안 다른 사람들이 생각을 바꿀 수도 있다.","w":"경영 1학년","arg":"결국 질 소수가 할 수 있는 건 이유를 끝까지 말하는 것","src":"politics_filibuster_g1_05"},{"n":"02","g":0,"t":"받아들일 수 있다. 학생회에서도 소수 의견이 아예 무시되면 다음부터 아무도 반대하지 않게 된다. 대신 발언 내용은 안건과 관련 있어야 한다고 생각한다.","w":"컴퓨터공학 2학년","arg":"소수 의견이 무시되면 다음부터 아무도 반대하지 않는다","src":"politics_filibuster_g1_06"},{"n":"03","g":0,"t":"정당하다고 생각한다. 다수가 찬성한다고 그 안건이 꼭 옳은 건 아니기 때문이다. 늦어지는 시간보다 한 번 더 따져 볼 기회가 더 값지다.","w":"국어국문 2학년","arg":"다수의 찬성이 곧 옳음은 아니므로 한 번 더 따질 기회가 값지다","src":"politics_filibuster_g1_07"},{"n":"04","g":1,"t":"정당하지만 끝이 있어야 한다고 생각한다. 발언 시간을 정해 두면 소수도 말할 수 있고 회의도 끝낼 수 있다. 끝없이 늦추는 건 다른 학생들의 시간을 빼앗는 일이다.","w":"생명과학 1학년","arg":"정당하지만 끝이 정해져 있어야 다른 사람의 시간도 지킨다","src":"politics_filibuster_g2_05"},{"n":"05","g":1,"t":"한 번은 정당하다고 본다. 하지만 매번 그렇게 하면 회의가 아무것도 결정하지 못한다. 그래서 길게 말할 수 있는 시간을 미리 정해 두는 게 좋겠다.","w":"체육 2학년","arg":"한 번은 정당하나 매번이면 아무것도 결정하지 못한다","src":"politics_filibuster_g2_06"},{"n":"06","g":2,"t":"한두 안건이라면 정당하다. 하지만 모든 안건마다 그렇게 한다면 반대가 아니라 방해라고 생각한다. 무엇에 반대하는지가 분명해야 정당한 방법이 된다.","w":"수학 3학년","arg":"무엇에 반대하는지 분명해야 정당한 방법이 된다","src":"politics_filibuster_g3_04"},{"n":"07","g":2,"t":"상황에 따라 다르다고 본다. 정말 중요한 안건이면 받아들일 수 있지만, 습관처럼 하면 소수의 말도 점점 안 듣게 된다. 그래서 꼭 필요할 때만 써야 한다.","w":"화학 1학년","arg":"습관처럼 쓰면 소수의 말도 점점 듣지 않게 된다","src":"politics_filibuster_g3_05"},{"n":"08","g":2,"t":"안건이 하나라면 괜찮다. 그런데 회의 전체를 멈추려고 한다면 다른 학생들의 권리를 침해하는 것이다. 반대하는 이유를 밝히는 게 먼저다.","w":"건축 2학년","arg":"회의 전체를 멈추려 하면 다른 학생의 권리를 침해한다","src":"politics_filibuster_g3_06"},{"n":"09","g":3,"t":"정당한 방법이라고 보기 어렵다. 과반이 찬성했다면 그것이 학생들의 뜻이고, 발언으로 시간을 끄는 건 결과를 바꾸지 못한다. 소수 의견은 투표 전에 충분히 말하면 된다.","w":"산업공학 2학년","arg":"과반의 뜻이 정해졌으면 소수 의견은 투표 전에 말하면 된다","src":"politics_filibuster_g4_04"},{"n":"10","g":3,"t":"솔직히 불편할 것 같다. 회의는 결정하려고 모이는 건데 결정을 못 하게 막는 건 회의의 목적에 맞지 않는다. 반대 의견은 기록으로 남기고 표결은 하는 게 맞다.","w":"간호 1학년","arg":"회의는 결정하려고 모이는 것이므로 결정을 막는 건 목적에 어긋난다","src":"politics_filibuster_g4_05"},{"n":"11","g":4,"t":"늦추는 것보다 회의 전에 미리 의견을 모으는 게 더 좋다고 생각한다. 표결 직전에 길게 말해야 할 만큼 의견 차이가 크다면, 안건을 다시 논의할 시간을 주는 게 맞다. 그러면 시간을 끌 필요도 없다.","w":"교육 1학년","arg":"표결 직전에 길게 말할 정도라면 안건을 다시 논의할 시간이 필요하다","src":"politics_filibuster_g5_04"},{"n":"12","g":5,"t":"소수가 길게 말하는 것 자체는 정당하다. 다만 그 말을 다른 학생들이 실제로 듣고 판단할 수 있어야 의미가 있다. 발언 내용을 정리해서 공개한다면 시간을 늦춘 것이 낭비가 아니게 된다.","w":"커뮤니케이션 3학년","arg":"길게 말하는 것 자체보다 그 말이 실제로 전달되는지가 중요하다","src":"politics_filibuster_g6_02"}]},"chinafta":{"boksi":[{"n":"01","g":0,"t":"중국 시장 확대에 적극적으로 힘을 실어야 한다고 본다. 이번 합의로 중국이 한국 영화와 게임에 최혜국 대우를 약속하고, 공동제작 대상도 드라마·예능·애니메이션까지 넓혔다. 콘텐츠 산업은 한 번 시장을 놓치면 그 자리를 다른 나라가 채우기 때문에, 문이 열렸을 때 빨리 들어가는 것이 중요하다. 의존 위험은 진출하지 않아서 줄어드는 것이 아니라 진출한 뒤 여러 시장을 함께 키우면서 관리하는 것이다. 그래서 기준은 위험 회피보다 기회를 잡는 속도에 두어야 한다.","w":"경영 4학년","arg":"콘텐츠 시장은 선점이 중요하므로 열린 때 빨리 들어가고 위험은 진출 후 관리한다","src":"economy_china_fta_g1_01"},{"n":"02","g":0,"t":"시장 크기를 생각하면 기회를 놓칠 이유가 없다. 발표 직후 관련 기업 주가가 상한가를 기록했다는 것은 시장도 이 기회를 크게 본다는 뜻이다. 물론 주가 반응이 실제 매출을 보장하지는 않지만, 기업이 투자 계획을 세우기에는 충분한 신호다. 정부는 기업이 빨리 움직일 수 있도록 현지 정보와 법률 지원을 해 줘야 한다. 나는 지금은 위험보다 기회를 기준으로 판단할 때라고 생각한다.","w":"경제 3학년","arg":"시장 반응은 기업이 투자 계획을 세우기에 충분한 신호다","src":"economy_china_fta_g1_02"},{"n":"03","g":0,"t":"정식으로 수출할 길이 좁으면 창작자는 정당한 대가를 받기 어렵다. 정식 시장이 열리면 작품이 제값을 받고, 그만큼 다음 작품에 투자할 여력이 생긴다. 이것은 단순히 돈을 버는 문제가 아니라 산업이 지속되는 문제다. 의존 위험이 있다고 해서 정당한 시장을 포기하는 것은 손실이 더 크다. 따라서 적극 진출이 맞다.","w":"미디어 2학년","arg":"정식 시장이 열려야 창작자가 대가를 받고 다음 작품에 투자할 수 있다","src":"economy_china_fta_g1_03"},{"n":"04","g":0,"t":"관광 분야도 중요하다고 본다. 이번 합의로 중국 23개 지역에 세운 한국 여행사가 현지에서 해외여행 고객을 직접 모을 수 있게 됐다. 관광은 콘텐츠와 달리 지역 상권과 일자리에 바로 이어지는 분야다. 콘텐츠로 관심을 만들고 관광으로 소비를 이끄는 연결이 가능해진 만큼, 정부와 기업이 함께 적극적으로 나서야 한다. 기회를 기준으로 하되, 효과를 지역에 고르게 나누는 방법도 함께 고민해야 한다.","w":"관광경영 3학년","arg":"콘텐츠로 관심을 만들고 관광으로 소비를 잇는 연결이 가능해졌다","src":"economy_china_fta_g1_04"},{"n":"05","g":1,"t":"중국 시장에 진출하되, 의존도가 일정 수준을 넘지 않도록 다른 시장과 함께 키워야 한다. 투자할 때 한 종목에 몰아넣지 않는 것처럼, 수출 시장도 한 나라에 지나치게 기대면 그 나라의 정치 상황에 회사 전체가 흔들린다. 한한령으로 오래 막혔던 경험이 바로 그 위험을 보여 준다. 그래서 기업은 중국 매출 비중의 상한을 정하고, 동남아나 북미 같은 시장을 함께 공략해야 한다. 기회와 위험 중 하나를 고르기보다, 위험을 감당할 수 있는 만큼만 기회를 잡는 것이 기준이다.","w":"경영 4학년","arg":"한 종목에 몰지 않듯 수출 시장도 의존 상한을 정하고 함께 키운다","src":"economy_china_fta_g2_01"},{"n":"06","g":1,"t":"기회를 잡는 것과 의존하는 것은 다르다. 중국 시장에서 얻은 수익을 다른 시장 개척에 다시 투자한다면, 중국 진출은 오히려 의존을 줄이는 자금이 될 수 있다. 문제는 한 시장의 수익이 좋을 때 다른 시장을 소홀히 하는 습관이다. 그래서 정부 지원도 중국 진출에만 몰리지 않게, 여러 시장 진출을 함께 지원하는 방식이 되어야 한다. 균형을 기준으로 삼으면 기회도 잡고 위험도 줄일 수 있다.","w":"경제 2학년","arg":"중국 수익을 다른 시장 개척에 재투자하면 진출이 오히려 의존을 줄인다","src":"economy_china_fta_g2_02"},{"n":"07","g":1,"t":"기업 입장에서 중국 시장은 매력적이지만, 한 시장에 매출의 큰 부분을 걸면 정치적 결정 하나에 실적이 흔들린다. 이것은 기업만의 문제가 아니라 그 회사에서 일하는 사람들의 일자리 문제이기도 하다. 그래서 진출은 하되, 현지 공동제작처럼 위험을 나눌 수 있는 방식을 먼저 활용하는 것이 좋겠다. 이번에 공동제작 범위가 넓어진 것은 그런 점에서 의미가 있다. 나는 진출 방식이 위험을 나누는 구조인지가 판단 기준이라고 본다.","w":"사회 3학년","arg":"공동제작처럼 위험을 나누는 진출 방식이 판단 기준이다","src":"economy_china_fta_g2_03"},{"n":"08","g":1,"t":"중국 진출을 반대할 이유는 없지만 한곳에 모든 것을 거는 것은 위험하다. 소비자의 취향은 바뀌고 정책은 더 빨리 바뀐다. 여러 시장에 조금씩 걸어 두면 한 곳이 막혀도 버틸 수 있다. 그래서 정부는 특정 국가 진출 지원보다 기업의 수출 시장 다변화를 평가 기준으로 삼아야 한다.","w":"통계 2학년","arg":"정부는 특정 국가 진출보다 수출 시장 다변화를 평가해야 한다","src":"economy_china_fta_g2_04"},{"n":"09","g":2,"t":"이번 합의는 의미가 크지만, 제도적 근거가 생긴 것과 실제로 사업 허가가 나오는 것은 별개다. 기사에서도 증권가에서 이 점을 두고 신중론이 나왔고, K팝 공연 재개는 이번 합의에서 빠졌다. 그렇다면 지금 크게 투자하기보다, 실제 허가와 유통이 재개되는 것을 확인하면서 단계적으로 늘려 가는 것이 합리적이다. 기회를 놓칠까 서두르다가 다시 막히면 손실은 더 커진다. 나는 확인된 만큼만 늘리는 것을 기준으로 삼아야 한다고 본다.","w":"경제 4학년","arg":"제도적 근거와 실제 허가는 별개이므로 확인된 만큼만 늘린다","src":"economy_china_fta_g3_01"},{"n":"10","g":2,"t":"주가가 상한가를 기록했다는 것은 기대가 크다는 뜻이지 실적이 생겼다는 뜻은 아니다. 기대만으로 투자가 몰리면 실제 개방 속도가 느릴 때 실망도 크다. 정부와 기업은 합의 내용이 현장에서 어떻게 적용되는지 확인하는 데 먼저 힘을 써야 한다. 예를 들어 게임 심사가 실제로 차별 없이 이뤄지는지 몇 건의 사례로 확인할 수 있다. 성과가 확인되면 그때 지원을 늘려도 늦지 않다.","w":"경영 3학년","arg":"주가 상승은 기대일 뿐이므로 실제 적용 사례를 먼저 확인한다","src":"economy_china_fta_g3_02"},{"n":"11","g":2,"t":"합의가 발표된 것과 현장에서 바로 적용되는 것 사이에는 시간이 걸린다. 그 사이 분위기가 바뀔 가능성도 있다. 그래서 지금은 준비하는 단계이지 큰돈을 거는 단계가 아니다. 기업은 현지 파트너를 찾고 콘텐츠를 준비하되, 실제 허가가 나오는 속도에 맞춰 투자를 조절하는 것이 맞다.","w":"법학 2학년","arg":"발표와 현장 적용 사이에는 시간이 걸리므로 지금은 준비 단계다","src":"economy_china_fta_g3_03"},{"n":"12","g":3,"t":"나는 의존 위험을 더 무겁게 봐야 한다고 생각한다. 한한령은 공식적인 법이 아니었는데도 한국 콘텐츠의 길을 오랫동안 막았다. 이는 시장이 협정문만이 아니라 정치적 분위기로도 열리고 닫힐 수 있다는 뜻이다. 그런 시장에 산업이 크게 기대면, 다음에 관계가 나빠질 때 피해는 기업을 넘어 일하는 사람들 전체에게 돌아간다. 그래서 정부는 중국 시장 확대를 앞장서 밀기보다, 기업이 감당할 수 있는 수준을 넘지 않게 관리하는 데 무게를 둬야 한다.","w":"정치외교 3학년","arg":"협정문이 아니라 정치 분위기로 열리고 닫히는 시장이라 확대 속도를 관리해야 한다","src":"economy_china_fta_g4_01"},{"n":"13","g":3,"t":"경제적 이익만 보고 한 나라에 기대면, 그 나라는 경제를 외교 수단으로 쓸 수 있다. 시장이 커질수록 우리가 할 수 있는 말은 줄어든다. 이것은 기업의 문제가 아니라 국가의 선택 폭에 대한 문제다. 그래서 나는 기회보다 의존의 위험을 기준으로 삼아 확대 속도를 조절해야 한다고 본다. 중국 시장은 여러 시장 중 하나로 대해야 한다.","w":"국제학 4학년","arg":"시장 의존이 커질수록 외교에서 할 수 있는 말이 줄어든다","src":"economy_china_fta_g4_02"},{"n":"14","g":3,"t":"기업은 이익이 보이면 움직이기 때문에, 정부까지 나서서 밀어줄 필요는 없다고 생각한다. 오히려 정부는 위험이 커졌을 때 피해를 줄이는 역할을 해야 한다. 정부가 확대를 적극 지원하면 기업은 위험을 덜 따지게 되고, 시장이 막혔을 때 정부 책임론만 커진다. 그래서 정부의 기준은 기회 확대가 아니라 위험 관리여야 한다.","w":"행정 2학년","arg":"정부는 확대를 밀기보다 위험이 커질 때 피해를 줄이는 역할을 해야 한다","src":"economy_china_fta_g4_03"},{"n":"15","g":4,"t":"기회와 위험 중 하나를 고르기보다, 위험을 누가 나눠 질지를 먼저 정해야 한다. 큰 기업은 시장이 막혀도 버티지만, 작은 제작사나 여행사는 한 번의 정치적 변화로 문을 닫을 수 있다. 그래서 정부가 수출 보험처럼 정치적 이유로 사업이 막혔을 때 손실 일부를 보전하는 장치를 마련한다면, 작은 기업도 기회를 잡을 수 있다. 이렇게 하면 진출은 늘리되 위험은 사회가 나눠 갖게 된다. 나는 작은 기업도 도전할 수 있는가를 기준으로 삼아야 한다고 본다.","w":"경제 3학년","arg":"정치적 손실 일부를 정부가 보전하면 작은 기업도 기회를 잡을 수 있다","src":"economy_china_fta_g5_01"},{"n":"16","g":4,"t":"이번 합의로 먼저 혜택을 보는 곳은 이미 규모가 큰 기업일 가능성이 크다. 상한가를 기록한 기업들도 이름을 들어 본 곳이 많다. 작은 창작자에게는 기회보다 위험이 더 크게 느껴진다. 그래서 정부는 작은 기업의 중국 진출에 대해 위험을 덜어 주는 지원을 집중해야 한다. 기회를 넓히는 것보다 기회에 접근할 수 있는 사람을 넓히는 것이 기준이 되어야 한다.","w":"사회학 2학년","arg":"기회를 넓히기보다 기회에 접근할 수 있는 사람을 넓혀야 한다","src":"economy_china_fta_g5_02"},{"n":"17","g":4,"t":"정부의 역할은 확대를 부추기는 것도 막는 것도 아니라 판을 공정하게 만드는 것이다. 합의 내용이 실제로 지켜지는지 감시하고, 어겨졌을 때 기업이 대응할 수 있도록 돕는 것이 우선이다. 그러면 기업은 위험을 알고 스스로 판단할 수 있다. 결국 위험을 줄이는 것은 정보와 대응 능력이다. 나는 정부가 이 두 가지를 지원하는 데 힘을 실어야 한다고 본다.","w":"법학 3학년","arg":"정부는 합의 이행을 감시하고 기업의 대응을 돕는 데 힘을 실어야 한다","src":"economy_china_fta_g5_03"},{"n":"18","g":5,"t":"나는 이번 합의의 핵심이 시장 규모보다 차별하지 않겠다는 규칙이 생긴 데 있다고 본다. 그동안 한국 콘텐츠가 막혔을 때 문제는 막혔다는 사실보다 왜 막혔는지 따질 근거가 없었다는 점이었다. 이번에 콘텐츠 사전 심사에 비차별 원칙을 적용하기로 한 만큼, 앞으로는 불리한 대우를 받았을 때 문제를 제기할 기준이 생긴 셈이다. 그렇다면 의존 위험을 이유로 진출을 줄이기보다, 진출하면서 차별 사례를 기록하고 대응하는 능력을 키우는 것이 위험을 줄이는 길이다. 기회와 위험을 맞바꾸는 대신, 규칙을 실제로 작동하게 만드는 것을 기준으로 삼아야 한다.","w":"법학 4학년","arg":"핵심은 시장보다 차별 금지 규칙이며, 진출하며 규칙을 쓰는 능력이 위험을 줄인다","src":"economy_china_fta_g6_01"}],"choshi":[{"n":"01","g":0,"t":"도전하겠다. 시장이 다시 열린 초기에 들어가야 경험과 인맥을 쌓을 수 있기 때문이다. 다시 막히더라도 그때 쌓은 경험은 다른 나라 시장에서도 쓸 수 있다.","w":"중어중문 3학년","arg":"초기에 들어가야 경험을 쌓고, 그 경험은 다른 시장에서도 쓸 수 있다","src":"economy_china_fta_g1_05"},{"n":"02","g":0,"t":"도전해 보고 싶다. 사회 초년생 때가 아니면 위험한 선택을 하기 어렵고, 큰 시장에서 일한 경험은 경력으로 남는다. 회사가 무너질 정도의 위험만 아니면 해 볼 만하다.","w":"경영 2학년","arg":"위험한 선택은 지금 해야 하고 큰 시장 경험은 남는다","src":"economy_china_fta_g1_06"},{"n":"03","g":0,"t":"할 것 같다. 콘텐츠 일을 하고 싶다면 가장 큰 시장 중 하나를 피할 수는 없다. 막힐 가능성은 다른 업계에도 있다.","w":"영상 1학년","arg":"콘텐츠 일을 하려면 큰 시장을 피할 수 없다","src":"economy_china_fta_g1_07"},{"n":"04","g":1,"t":"도전하되, 그 회사가 중국에만 기대는 곳인지 먼저 볼 것 같다. 다른 나라 사업도 함께 하는 회사라면 막히더라도 버틸 수 있다. 내 경력도 한 나라에만 묶이지 않게 하고 싶다.","w":"국제학 3학년","arg":"중국에만 기대지 않는 회사라면 막혀도 버틸 수 있다","src":"economy_china_fta_g2_05"},{"n":"05","g":1,"t":"조건부로 도전하겠다. 중국 일을 하면서도 다른 시장을 경험할 수 있다면 좋은 기회다. 한 나라에만 맞춘 경력은 위험하다고 생각한다.","w":"경영 1학년","arg":"한 나라에만 맞춘 경력은 위험하다","src":"economy_china_fta_g2_06"},{"n":"06","g":2,"t":"바로 결정하지는 않겠다. 이번 합의 이후 실제로 작품이 중국에 나가는지 몇 달 지켜보고 판단하겠다. 발표만 믿고 진로를 정하기에는 위험하다.","w":"경제 1학년","arg":"실제로 작품이 나가는지 몇 달 지켜보고 판단하겠다","src":"economy_china_fta_g3_04"},{"n":"07","g":2,"t":"관심은 있지만 확인이 먼저다. 공연처럼 아직 열리지 않은 분야도 있어서, 회사가 어떤 분야를 하는지가 중요하다. 실제로 길이 열린 분야라면 도전하겠다.","w":"음악 2학년","arg":"공연처럼 아직 안 열린 분야가 있으니 회사 분야가 중요하다","src":"economy_china_fta_g3_05"},{"n":"08","g":2,"t":"합의만 보고 가지는 않을 것 같다. 예전에도 기대만 커졌다가 실제로는 크게 바뀌지 않은 적이 있다고 들었다. 확실해지면 그때 도전하겠다.","w":"사학 3학년","arg":"기대만 있다가 실제로 바뀌지 않은 적이 있으니 확실해지면 간다","src":"economy_china_fta_g3_06"},{"n":"09","g":3,"t":"도전하지 않을 것 같다. 내 노력과 상관없이 정치 상황 때문에 일이 갑자기 사라질 수 있다는 게 두렵다. 첫 직장은 조금 더 안정적인 곳을 고르겠다.","w":"경영 1학년","arg":"내 노력과 상관없이 일이 사라질 수 있다는 게 두렵다","src":"economy_china_fta_g4_04"},{"n":"10","g":3,"t":"망설여진다. 한 번 막혔던 시장은 다시 막힐 수 있다고 생각한다. 그 위험을 회사가 감당할 수 있다는 확신이 없다면 가지 않겠다.","w":"회계 2학년","arg":"한 번 막혔던 시장은 다시 막힐 수 있다","src":"economy_china_fta_g4_05"},{"n":"11","g":4,"t":"회사가 아니라 나라가 어느 정도 안전장치를 마련해 준다면 도전하겠다. 개인이 정치 상황까지 책임지는 건 불공평하다. 안전장치가 없다면 고민이 클 것 같다.","w":"사회복지 2학년","arg":"개인이 정치 상황까지 책임지는 건 불공평하다","src":"economy_china_fta_g5_04"},{"n":"12","g":5,"t":"도전하겠다. 예전과 달리 이제는 차별하지 않겠다는 약속이 문서로 생겼기 때문이다. 문제가 생기면 따질 근거가 있다는 점이 막연한 불안보다 크다고 본다.","w":"국제학 2학년","arg":"이제는 문제가 생기면 따질 근거가 있다","src":"economy_china_fta_g6_02"}]},"subway":{"boksi":[{"n":"01","g":0,"t":"지하철 안전 인력의 비용은 세금으로 부담해야 한다고 생각한다. 지하철은 이용자만 혜택을 보는 서비스가 아니라, 도로 혼잡을 줄이고 도시가 돌아가게 하는 공공 기반 시설이다. 그런데 비용을 요금으로만 메우면 매일 지하철을 타야 하는 학생과 저소득층이 가장 큰 부담을 진다. 노조가 요구하는 것도 위험 작업을 2인 1조로 하자는 것처럼 사고를 막기 위한 인력이므로, 이것은 효율이 아니라 안전의 문제로 봐야 한다. 그러므로 안전 인력만큼은 공공 예산으로 확보하는 것이 우선이다.","w":"도시공학 3학년","arg":"지하철은 도시 기반 시설이므로 안전 인력은 세금으로 확보해야 약자 부담이 줄어든다","src":"society_subway_g1_01"},{"n":"02","g":0,"t":"안전 사고는 한 번 일어나면 비용이 훨씬 크다. 인력을 줄여서 아끼는 돈보다 사고가 났을 때 생기는 인명 피해와 운행 중단 비용이 크기 때문에, 안전 인력은 비용이 아니라 투자로 봐야 한다. 이런 투자는 도시 전체가 혜택을 받으므로 세금으로 하는 것이 맞다. 다만 세금을 쓰는 만큼 인력이 실제로 안전 업무에 쓰이는지 공개해야 한다. 그래야 시민도 세금 지원에 동의할 수 있다.","w":"경제 2학년","arg":"사고 비용이 훨씬 크므로 안전 인력은 비용이 아니라 투자다","src":"society_subway_g1_02"},{"n":"03","g":0,"t":"요금을 올리면 이용자가 줄고, 이용자가 줄면 수입이 다시 줄어드는 악순환이 생길 수 있다. 반대로 세금으로 지원하면 요금을 유지하면서 안전을 지킬 수 있다. 지하철을 타지 않는 사람도 지하철 덕분에 도로가 덜 막히는 혜택을 본다. 그러니 비용을 모두가 나누는 세금 방식이 공정하다. 나는 세금 지원을 우선하고, 효율화는 안전과 상관없는 분야에서 찾아야 한다고 본다.","w":"행정 4학년","arg":"요금 인상은 이용자 감소의 악순환을 낳고, 지하철의 혜택은 모두가 본다","src":"society_subway_g1_03"},{"n":"04","g":0,"t":"인력 감축이 효율이라고 하지만, 줄인 인력의 일이 사라지는 것은 아니다. 남은 사람이 더 많은 일을 하게 되고, 그만큼 점검이 빠지거나 서둘러진다. 이번 준법투쟁에서 규정대로만 해도 지연이 우려된다는 것은 평소에 규정보다 빠르게 일해 왔다는 뜻일 수 있다. 이런 상황에서 인력을 더 줄이는 것은 위험을 쌓는 일이다. 그래서 안전 인력은 공공이 책임지고 확보해야 한다.","w":"사회학 3학년","arg":"줄인 인력의 일은 남은 사람에게 몰려 위험이 쌓인다","src":"society_subway_g1_04"},{"n":"05","g":1,"t":"안전 인력을 늘리는 비용은 요금 인상으로 일부를 이용자가 부담해야 한다고 본다. 지하철 서비스를 직접 쓰는 사람이 비용을 더 내는 것이 수익자 부담 원칙에 맞다. 세금으로만 메우면 서울 지하철을 거의 타지 않는 사람까지 그 비용을 나누게 된다. 물론 요금이 오르면 학생과 저소득층의 부담이 커지므로, 이들에게는 할인 제도를 넓혀 보완할 수 있다. 결국 기준은 혜택을 받는 사람이 더 낸다는 원칙과 약자는 보호한다는 원칙을 함께 지키는 것이다.","w":"경제 3학년","arg":"혜택을 받는 이용자가 더 내되 학생·저소득층은 할인으로 보호한다","src":"society_subway_g2_01"},{"n":"06","g":1,"t":"나는 매일 지하철을 타는 사람으로서, 안전을 위해서라면 요금이 조금 오르는 것을 감수할 수 있다. 작은 인상은 사고 한 번의 비용과 비교할 수 없다. 다만 요금을 올리면 그 돈이 안전 인력에 실제로 쓰이는지 보여 줘야 한다. 예를 들어 인상분을 안전 인력 확충에만 쓰도록 따로 관리하면 시민도 납득할 것이다. 투명성이 전제되면 이용자 부담이 가장 직접적인 해결책이다.","w":"경영 2학년","arg":"인상분을 안전 인력에만 쓰도록 따로 관리하면 이용자도 납득한다","src":"society_subway_g2_02"},{"n":"07","g":1,"t":"세금은 이미 많은 곳에 쓰여야 하고, 지하철만 예외일 수는 없다. 이용자가 일정 부분을 내지 않으면 운영 재원이 부족해지고, 결국 인력 감축 같은 압박이 반복된다. 요금 구조를 현실에 맞게 조정하는 것이 장기적으로 안전 인력을 지키는 길이다. 대신 출퇴근 시간대와 한산한 시간대의 요금을 다르게 하는 방법도 고려할 수 있다. 나는 이용자 부담을 기본으로 하되 방식을 세밀하게 설계해야 한다고 본다.","w":"산업공학 4학년","arg":"요금 구조를 현실화하되 시간대별 요금처럼 세밀하게 설계한다","src":"society_subway_g2_03"},{"n":"08","g":1,"t":"요금 인상은 인기가 없지만 가장 정직한 방법이다. 세금 지원은 다른 예산과 경쟁해야 해서 해마다 달라질 수 있다. 반면 요금으로 확보한 재원은 꾸준하다. 안전 인력처럼 매년 필요한 비용은 안정적인 재원으로 마련해야 한다.","w":"행정 2학년","arg":"매년 필요한 비용은 해마다 바뀌는 세금보다 꾸준한 요금으로 마련한다","src":"society_subway_g2_04"},{"n":"09","g":2,"t":"이번 준법투쟁은 비용 논쟁보다 먼저 확인할 것을 보여 준다. 기관사가 정차 시간을 줄이지 않고 규정대로만 해도 지연이 우려된다면, 지금의 운행 계획은 규정을 다 지키지 못하는 인력과 속도로 짜여 있다는 뜻일 수 있다. 그렇다면 인력 감축은 이미 빠듯하게 돌아가는 체계를 더 압박하는 셈이다. 비용 부담을 누가 질지는 그 다음 문제이고, 우선은 규정을 지키면서 운행할 수 있는 인력 수준을 기준으로 삼아야 한다. 그 기준에 맞춰 부족한 부분을 세금이든 요금이든 채우는 것이 순서다.","w":"법학 3학년","arg":"규정을 지키면 늦어진다는 것은 인력이 부족하다는 뜻이므로 안전 기준을 먼저 정한다","src":"society_subway_g3_01"},{"n":"10","g":2,"t":"준법투쟁이라는 말 자체가 이상하다고 느꼈다. 법과 규정을 지키는 것이 투쟁이 된다는 것은 평소에 규정보다 빠르게 일하는 게 당연시됐다는 뜻이다. 안전 규정은 사고를 막으려고 만든 것이므로, 이를 지키는 데 필요한 인력은 협상 대상이 아니라 기본 조건이어야 한다. 비용은 그 기본 조건을 지키기 위해 공공과 이용자가 함께 나눠야 한다. 하지만 우선순위는 분명히 안전 기준이다.","w":"철학 2학년","arg":"규정 준수에 필요한 인력은 협상 대상이 아니라 기본 조건이다","src":"society_subway_g3_02"},{"n":"11","g":2,"t":"운행 횟수를 평소처럼 유지하겠다고 했는데도 지연이 예상된다는 점이 핵심이다. 열차 수는 같아도 각 열차가 규정을 지키면 시간이 더 걸린다는 것이다. 그렇다면 지금의 배차 계획은 안전에 필요한 시간을 빼고 계산된 것일 수 있다. 이 부분을 바로잡으려면 인력과 시간표를 함께 다시 설계해야 한다. 나는 비용을 논하기 전에 이 설계부터 공개적으로 점검해야 한다고 본다.","w":"산업공학 3학년","arg":"운행 횟수가 같아도 지연된다면 배차 계획에서 안전 시간이 빠져 있다","src":"society_subway_g3_03"},{"n":"12","g":3,"t":"안전 인력을 늘리기 전에, 지금 인력이 효율적으로 배치되어 있는지부터 따져야 한다. 공사가 인력 감축을 추진하는 데에도 이유가 있을 것이고, 모든 인력이 안전 업무에 쓰이는 것은 아닐 수 있다. 안전과 직접 관련 없는 업무를 줄이고 그 인력을 현장 안전 업무로 옮긴다면, 전체 인원을 늘리지 않고도 안전을 강화할 수 있다. 세금이나 요금 인상은 그 다음 단계여야 한다. 시민의 돈을 쓰기 전에 내부 효율화부터 증명하는 것이 기준이 되어야 한다.","w":"경영 4학년","arg":"시민 돈을 쓰기 전에 안전과 무관한 업무를 줄여 현장으로 재배치해야 한다","src":"society_subway_g4_01"},{"n":"13","g":3,"t":"노조는 인력 충원을, 공사는 감축을 말하는데 두 숫자의 차이가 너무 크다. 이럴 때 무조건 한쪽 편을 들기보다, 실제로 어떤 업무에 몇 명이 필요한지 업무 분석이 먼저다. 효율화는 사람을 줄이는 것만이 아니라 같은 사람이 더 안전하게 일하도록 업무를 다시 짜는 것이다. 분석 결과 정말 인력이 부족하다면 그때 비용 부담을 논의해야 한다. 순서를 지켜야 시민도 비용을 납득할 수 있다.","w":"경제 3학년","arg":"필요 인원은 업무 분석으로 먼저 확인하고 비용은 그 다음에 논의한다","src":"society_subway_g4_02"},{"n":"14","g":3,"t":"공사가 인력 감축을 추진하는 이유가 비용 부담이라면, 효율화 없이 인력만 늘리는 것은 지속 가능하지 않다. 비용만 계속 늘리면 결국 그 부담은 다음 세대가 진다. 안전을 지키려면 오히려 재정이 건강해야 한다. 그래서 우선은 운영을 효율화하고, 남는 자원으로 안전 인력을 확보하는 순서가 맞다고 생각한다.","w":"회계 2학년","arg":"효율화 없이 비용만 늘리면 지속 가능하지 않고 부담은 다음 세대가 진다","src":"society_subway_g4_03"},{"n":"15","g":4,"t":"비용을 누가 내느냐는 질문에는 사람을 늘리는 것과 기술에 투자하는 것을 함께 따져야 한다고 답하고 싶다. 승강장 문 점검처럼 반복되는 확인 작업은 센서와 자동 점검 장비가 상당 부분을 도울 수 있다. 그러면 사람은 기계가 판단하기 어려운 위험 상황에 집중할 수 있다. 초기 투자는 세금으로 하되, 장기적으로 인건비 증가를 줄일 수 있다면 시민 부담도 줄어든다. 다만 기술 도입이 인력 감축의 핑계가 되지 않도록, 줄어든 업무만큼 안전 업무에 다시 배치하는 원칙이 필요하다.","w":"전기전자 3학년","arg":"반복 점검은 기술에 맡기고 사람은 위험 상황에 집중하되 기술이 감축의 핑계가 되면 안 된다","src":"society_subway_g5_01"},{"n":"16","g":4,"t":"인력 충원과 감축을 둘러싼 갈등은 해마다 반복된다. 근본적으로 이 구조를 바꾸려면 안전을 사람 수에만 기대지 않는 체계가 필요하다. 예를 들어 열차와 시설의 상태를 실시간으로 알려 주는 시스템이 있으면 같은 인원으로도 위험을 더 빨리 찾을 수 있다. 이런 투자는 한 번의 비용으로 오래 효과를 낸다. 그래서 나는 요금이나 세금으로 사람을 늘리는 것보다 기술 투자를 우선하는 것이 낫다고 본다.","w":"컴퓨터공학 3학년","arg":"사람 수에만 기대지 않는 실시간 감시 체계가 매년 반복되는 갈등을 줄인다","src":"society_subway_g5_02"},{"n":"17","g":4,"t":"기술 투자는 중요하지만, 기계가 사람을 완전히 대신할 수는 없다. 사고가 났을 때 승객을 대피시키고 판단하는 것은 결국 사람이다. 그래서 기술은 인력을 줄이는 수단이 아니라 인력을 돕는 수단이어야 한다. 비용은 기술 투자와 인력 유지에 함께 쓰이도록 공공 예산으로 정해야 한다. 기준은 사람과 기술이 함께 지키는 안전이다.","w":"기계공학 2학년","arg":"사고 때 판단하고 대피시키는 건 사람이므로 기술은 인력을 돕는 수단이어야 한다","src":"society_subway_g5_03"},{"n":"18","g":5,"t":"나는 비용을 누가 낼지 정하기 전에, 몇 명이 필요한지에 대한 숫자부터 독립적으로 검증해야 한다고 본다. 노조는 1313명 충원을, 공사와 서울시는 2212명 감축을 말하는데, 같은 지하철을 두고 이렇게 숫자가 엇갈리면 어느 쪽 비용 계산도 시민이 믿기 어렵다. 노사 어느 쪽에도 속하지 않은 전문 기관이 안전 규정을 지키며 운행하는 데 필요한 인력을 산정하고 결과를 공개한다면, 그 숫자를 기준으로 세금과 요금의 분담을 정할 수 있다. 이렇게 하면 해마다 반복되는 힘겨루기 대신 근거를 두고 논쟁하게 된다. 비용 분담의 공정성은 결국 무엇에 대한 비용인지를 모두가 믿을 수 있을 때 생긴다.","w":"통계 4학년","arg":"노사 숫자가 크게 엇갈리니 독립 기관이 필요 인력을 산정·공개해야 분담 논쟁이 근거 위에 선다","src":"society_subway_g6_01"}],"choshi":[{"n":"01","g":0,"t":"받아들이겠다. 몇 분 늦는 것은 불편하지만 안전 규정을 지키다 생긴 지연이라면 이해할 수 있다. 오히려 평소에 규정이 다 지켜지지 않았다는 게 더 걱정이다.","w":"간호 2학년","arg":"안전 규정을 지키다 생긴 지연은 이해할 수 있다","src":"society_subway_g1_05"},{"n":"02","g":0,"t":"받아들일 것 같다. 지하철 사고 소식을 들으면 몇 분보다 안전이 더 중요하다고 느낀다. 대신 늦어지는 이유를 안내해 주면 좋겠다.","w":"화학 1학년","arg":"몇 분보다 안전이 중요하다","src":"society_subway_g1_06"},{"n":"03","g":0,"t":"괜찮다. 규칙을 지키는 걸 탓할 수는 없다고 생각한다. 늦어질 걸 알면 조금 일찍 나가면 된다.","w":"국어국문 3학년","arg":"규칙을 지키는 걸 탓할 수는 없다","src":"society_subway_g1_07"},{"n":"04","g":1,"t":"한두 번은 괜찮지만 계속되면 불편할 것 같다. 차라리 요금을 조금 올려서 인력을 늘리는 게 나은 방법이라고 생각한다. 매일 늦는 것보다 돈을 조금 더 내는 편이 낫다.","w":"컴퓨터공학 1학년","arg":"매일 늦는 것보다 돈을 조금 더 내는 편이 낫다","src":"society_subway_g2_05"},{"n":"05","g":1,"t":"받아들이겠다. 다만 이게 해결되려면 결국 누군가 돈을 내야 한다는 생각이 든다. 이용자로서 조금 더 낼 의향은 있다.","w":"통계 3학년","arg":"해결하려면 결국 누군가 돈을 내야 한다","src":"society_subway_g2_06"},{"n":"06","g":2,"t":"받아들이겠다. 규정대로 했는데 늦어진다면 원래 시간표가 무리였다는 뜻 같다. 화가 나는 대상은 기관사가 아니라 그런 시간표다.","w":"경영 2학년","arg":"화가 나는 대상은 기관사가 아니라 무리한 시간표다","src":"society_subway_g3_04"},{"n":"07","g":2,"t":"받아들인다. 안전 규칙을 지키는 걸 투쟁이라고 부르는 것 자체가 문제라고 생각한다. 평소에도 그렇게 운행해야 하는 것 아닌가 싶다.","w":"사회복지 1학년","arg":"안전 규칙을 지키는 걸 투쟁이라 부르는 것 자체가 문제다","src":"society_subway_g3_05"},{"n":"08","g":2,"t":"받아들일 수 있다. 늦어지는 것을 보면서 오히려 평소 운행이 얼마나 빠듯했는지 알게 될 것 같다. 이번 기회에 기준을 다시 정했으면 좋겠다.","w":"심리 3학년","arg":"지연을 보며 평소 운행이 얼마나 빠듯했는지 알게 된다","src":"society_subway_g3_06"},{"n":"09","g":3,"t":"한두 번은 받아들이겠지만 오래가면 곤란하다. 시민의 출근길을 협상 수단으로 쓰는 느낌이 든다. 노사가 빨리 합의했으면 좋겠다.","w":"경영 1학년","arg":"시민의 출근길이 협상 수단이 되는 것 같다","src":"society_subway_g4_04"},{"n":"10","g":3,"t":"솔직히 불편하다. 안전도 중요하지만 매일 타는 사람에게 지연은 실제 손해다. 다른 방법으로 해결할 수는 없는지 궁금하다.","w":"전자공학 2학년","arg":"매일 타는 사람에게 지연은 실제 손해다","src":"society_subway_g4_05"},{"n":"11","g":4,"t":"받아들이겠지만 오래 이어지면 안 된다고 생각한다. 사람이 부족하다면 기술로 보완할 방법도 같이 찾아야 한다. 해마다 같은 문제가 반복되는 게 더 답답하다.","w":"컴퓨터공학 1학년","arg":"같은 문제가 반복되니 기술로 보완할 방법도 찾아야 한다","src":"society_subway_g5_04"},{"n":"12","g":5,"t":"받아들이겠지만, 정말 사람이 부족한지 먼저 알고 싶다. 노사 말이 너무 달라서 누구 말을 믿어야 할지 모르겠다. 제3자가 확인해 준다면 지연도 더 쉽게 이해할 수 있을 것 같다.","w":"언론정보 2학년","arg":"노사 말이 너무 달라 제3자의 확인이 먼저다","src":"society_subway_g6_02"}]},"examwatch":{"boksi":[{"n":"01","g":0,"t":"나는 공정성을 기준으로 감시를 지금 수준 이상으로 유지해야 한다고 본다. 수능은 한 문제 차이로 진로가 갈리는 시험이라, 한 사람의 부정행위는 정직하게 시험을 본 다른 수험생의 자리를 빼앗는 일이다. 실제로 재난문자를 보내자 휴대전화를 내지 않은 수험생 49명이 적발됐다는 것은, 감시가 없었다면 이들이 그대로 시험을 봤을 수 있다는 뜻이다. 모두가 겪는 불편은 하루의 비용이지만, 부정행위로 잃은 기회는 되돌릴 수 없다. 그러므로 공정성을 지키기 위한 감시는 수험생 전체가 감수할 만한 부담이다.","w":"경영 1학년","arg":"한 사람의 부정은 다른 사람의 자리를 빼앗으므로 하루의 불편은 감수할 만하다","src":"education_exam_surveillance_g1_01"},{"n":"02","g":0,"t":"감시가 불편하다는 것은 사실이지만, 그 불편은 모든 수험생에게 똑같이 적용된다는 점에서 공정하다. 문제는 일부만 규칙을 어길 수 있는 상황이다. 스마트 기기를 이용한 부정행위가 실제로 5건 적발되었다는 것은 위험이 막연한 걱정이 아니라는 증거다. 시험의 신뢰가 무너지면 모든 수험생의 점수가 의심받게 되므로, 감시는 결국 정직한 수험생을 지키는 장치다. 나는 공정성을 우선 기준으로 삼아야 한다고 생각한다.","w":"법학 1학년","arg":"실제 적발 사례가 있으니 위험은 막연한 걱정이 아니다","src":"education_exam_surveillance_g1_02"},{"n":"03","g":0,"t":"감시가 지나치다는 비판은 이해하지만, 기술이 빠르게 발전하는 지금은 예전 방식으로 막을 수 없다. 작은 기기 하나로도 답을 받을 수 있는 시대에 감시를 줄이면 부정행위를 사실상 허용하는 셈이다. 수험생 입장에서 가장 두려운 것은 불편이 아니라 나보다 노력하지 않은 사람이 기술로 나를 앞지르는 것이다. 감시의 부담은 그 두려움을 줄여 주는 대가다. 그래서 감시 강화는 정당하다.","w":"컴퓨터공학 1학년","arg":"기기가 작아지는 시대에 감시를 줄이면 부정행위를 사실상 허용한다","src":"education_exam_surveillance_g1_03"},{"n":"04","g":0,"t":"이번에 적발된 98명을 모두 부정행위자로 처리한 것은 원칙을 세웠다는 점에서 의미가 있다. 감시와 처리가 엄격하다는 것이 알려지면 다음 시험에서는 시도 자체가 줄어든다. 감시는 적발보다 예방 효과가 더 크다. 수험생 한 명 한 명이 겪는 불편은 이 예방 효과를 생각하면 정당화될 수 있다. 나는 공정성이 개인의 불편보다 앞선다고 본다.","w":"행정 2학년","arg":"엄격한 감시와 처리가 알려지면 다음 시험의 시도 자체가 줄어든다","src":"education_exam_surveillance_g1_04"},{"n":"05","g":1,"t":"공정성은 중요하지만, 감시가 정당하려면 그 수단이 목적에 비해 지나치지 않아야 한다. 이번 수능에서는 시험 직전과 도중에 세 차례 위급재난문자가 울렸는데, 시험 중 경보는 부정행위를 하지 않은 수험생의 집중까지 흔든다. 부정행위를 막으려는 장치가 정직한 수험생에게 손해를 준다면, 그 감시는 공정성을 지키는 것이 아니라 다른 불공정을 만든다. 그래서 기준은 정직한 수험생에게 피해를 주지 않는 범위여야 한다. 시험 전 점검은 강화하되, 시험 도중 모든 수험생을 방해하는 방식은 줄이는 것이 맞다.","w":"법학 3학년","arg":"정직한 수험생에게 피해를 주는 감시는 다른 불공정이므로 시험 도중 방해는 줄인다","src":"education_exam_surveillance_g2_01"},{"n":"06","g":1,"t":"모든 수험생을 잠재적 부정행위자로 보는 감시는 시험을 치르는 사람의 존엄을 해친다. 대부분의 수험생은 정직한데, 소수를 잡기 위해 다수가 의심받는 구조가 계속되면 시험에 대한 신뢰도 오히려 떨어진다. 물론 부정행위는 막아야 하지만, 의심의 범위는 구체적인 근거가 있는 경우로 좁혀야 한다. 감시의 강도는 위험의 크기에 비례해야 하고, 모든 사람에게 최대치를 적용할 필요는 없다. 공정성과 개인의 부담 사이의 선은 비례성으로 그어야 한다.","w":"철학 3학년","arg":"다수를 잠재적 부정행위자로 보는 감시는 존엄을 해치므로 의심은 근거 있는 경우로 좁힌다","src":"education_exam_surveillance_g2_02"},{"n":"07","g":1,"t":"감시 수단을 하나씩 따져 보면, 시험 전 점검처럼 수험생에게 부담이 적고 효과가 큰 방법이 있고, 시험 도중 경보처럼 부담이 큰 방법이 있다. 같은 목적이라면 부담이 적은 방법을 먼저 써야 한다. 이번에 휴대전화 미제출 적발은 효과가 있었지만, 같은 효과를 시험 전 확인으로 얻을 수 있었는지 검토해야 한다. 효과만 보고 수단을 정하면 감시는 계속 늘어날 수밖에 없다. 나는 효과와 부담을 함께 따지는 것이 정당성의 기준이라고 본다.","w":"행정 4학년","arg":"같은 목적이라면 부담이 적은 수단을 먼저 써야 감시가 끝없이 늘지 않는다","src":"education_exam_surveillance_g2_03"},{"n":"08","g":1,"t":"수능은 이미 긴장감이 극심한 시험이다. 그런 상황에서 시험 도중 울리는 경보는 일부 수험생에게 큰 영향을 줄 수 있다. 특히 불안이 큰 학생일수록 그 영향은 더 크다. 공정성을 위한 조치가 수험생마다 다른 피해를 준다면, 그것도 공정하다고 보기 어렵다. 그래서 감시는 모두에게 같은 부담이 되도록 설계해야 한다.","w":"심리 2학년","arg":"경보의 영향은 불안이 큰 수험생에게 더 크므로 부담이 고르지 않다","src":"education_exam_surveillance_g2_04"},{"n":"09","g":2,"t":"감시를 계속 늘리는 것보다 처벌을 분명하고 무겁게 하는 편이 모든 수험생의 부담을 줄이는 방법이다. 감시는 정직한 다수에게 불편을 주지만, 처벌은 규칙을 어긴 사람에게만 부담을 준다. 이번처럼 적발된 사람을 모두 부정행위자로 처리하는 원칙이 분명하다면, 시도 자체를 망설이게 하는 효과가 생긴다. 물론 처벌만으로 모든 부정행위를 막을 수는 없지만, 감시를 무한히 늘리는 것보다는 부담의 방향이 공정하다. 그래서 나는 감시는 지금 수준에서 멈추고 처벌의 확실성을 높여야 한다고 본다.","w":"법학 2학년","arg":"감시는 정직한 다수에게, 처벌은 위반자에게만 부담이므로 처벌의 확실성을 높인다","src":"education_exam_surveillance_g3_01"},{"n":"10","g":2,"t":"감시는 기술 경쟁이 되기 쉽다. 기기를 막으면 더 작은 기기가 나오고, 그러면 감시는 또 늘어난다. 이 경쟁에서 손해를 보는 것은 매번 더 많은 검사를 받아야 하는 정직한 수험생이다. 반면 적발되면 큰 대가를 치른다는 인식이 생기면, 기기를 몰래 들고 들어갈 이유가 줄어든다. 처벌을 기준으로 삼아야 감시의 끝없는 확대를 막을 수 있다.","w":"경제 3학년","arg":"감시는 기술 경쟁이 되어 끝없이 늘고 그 비용은 정직한 수험생이 진다","src":"education_exam_surveillance_g3_02"},{"n":"11","g":2,"t":"감시를 아무리 강화해도 시험이 끝난 뒤에야 드러나는 부정행위도 있을 것이다. 그렇다면 시험 당일의 감시보다 사후 확인과 처벌 체계가 더 중요할 수 있다. 수험생 모두에게 시험 당일 불편을 주는 것보다, 의심 사례를 끝까지 확인해 책임을 묻는 편이 합리적이다. 감시는 최소한으로, 처벌은 확실하게 하는 것이 공정성과 부담 사이의 균형점이다.","w":"행정 2학년","arg":"당일 감시보다 사후 확인과 책임 추궁이 더 합리적이다","src":"education_exam_surveillance_g3_03"},{"n":"12","g":3,"t":"감시를 얼마나 할지 따지기 전에, 왜 이렇게까지 감시해야 하는 시험이 되었는지를 봐야 한다. 정답을 고르는 시험은 작은 기기로 답만 전달받아도 무너지기 때문에 감시가 끝없이 늘어날 수밖에 없다. 반면 생각의 과정을 쓰게 하는 문항은 외부에서 답을 받아도 그대로 옮기기 어렵다. 감시를 늘려 모든 수험생에게 부담을 지우는 대신, 감시가 덜 필요한 시험으로 바꾸는 것이 장기적인 해법이다. 나는 감시의 정당성보다 시험 방식의 변화가 먼저라고 생각한다.","w":"교육 3학년","arg":"답만 전달받아도 무너지는 시험이라 감시가 늘어나므로 감시가 덜 필요한 시험으로 바꾼다","src":"education_exam_surveillance_g4_01"},{"n":"13","g":3,"t":"이번 수능에서 감시가 아무리 강해도 부정행위가 모두 사라지지는 않았다. 기술은 계속 발전하는데 감시는 늘 한발 늦을 수밖에 없다. 이런 경쟁을 계속하는 것보다 시험의 구조를 바꾸는 데 힘을 써야 한다. 물론 서술형은 채점의 공정성 문제가 있지만, 그 문제는 기준표와 여러 명의 채점으로 줄일 수 있다. 감시의 부담을 수험생에게 지우는 대신 제도가 바뀌어야 한다.","w":"사회 2학년","arg":"감시는 늘 기술보다 한발 늦으므로 제도가 바뀌어야 한다","src":"education_exam_surveillance_g4_02"},{"n":"14","g":3,"t":"한 번의 시험에 모든 것이 걸려 있으니 부정행위의 유혹도 크고 감시도 극단적으로 강해진다. 평가를 여러 번으로 나누거나 학교에서의 과정을 함께 보는 방식이라면, 한 번의 부정행위로 얻는 이익이 줄어든다. 그러면 시험장 감시도 지금처럼 강할 필요가 없다. 나는 감시를 둘러싼 논쟁이 결국 한 번에 모든 것이 결정되는 시험 구조에서 나온다고 본다. 구조를 바꾸는 것이 수험생 부담을 줄이는 근본적인 방법이다.","w":"교육 4학년","arg":"한 번에 모든 것이 걸린 구조가 부정행위의 유혹과 극단적 감시를 함께 만든다","src":"education_exam_surveillance_g4_03"},{"n":"15","g":4,"t":"나는 모든 수험생에게 똑같이 적용되는 불편은 받아들일 수 있지만, 특정 수험생만 의심받는 방식에는 반대한다. 재난문자처럼 모두에게 같은 조건을 주는 방식은 불편하더라도 차별은 아니다. 반면 겉모습이나 착용한 물건만으로 일부 수험생을 따로 검사하면, 정직한 수험생이 부당하게 의심받고 그 경험이 시험에도 영향을 준다. 감시의 정당성은 강도보다 공평함에서 나온다고 생각한다. 그래서 기준은 모두에게 같은 규칙인가여야 한다.","w":"사회학 3학년","arg":"모두에게 같은 불편은 차별이 아니지만 일부만 의심하는 방식은 부당하다","src":"education_exam_surveillance_g5_01"},{"n":"16","g":4,"t":"공정성을 위해 감시를 한다면, 감시 자체도 공정해야 한다. 같은 시험장 안에서도 감독관에 따라 검사 강도가 다르면 수험생이 받는 부담도 달라진다. 그래서 감시 수단은 사람의 판단보다 일정한 기준으로 모두에게 같게 적용되는 것이 바람직하다. 경보처럼 모두가 똑같이 겪는 방식은 이 점에서 오히려 공정한 편이다. 불편의 크기보다 불편이 누구에게 돌아가는지를 기준으로 봐야 한다.","w":"통계 2학년","arg":"감독관마다 강도가 다르면 부담도 달라지므로 일정한 기준이 공정하다","src":"education_exam_surveillance_g5_02"},{"n":"17","g":4,"t":"수험생 입장에서 가장 억울한 것은 아무 잘못 없이 의심받는 경험이다. 모두가 같은 검사를 받는다면 그 의심은 개인을 향한 것이 아니므로 견딜 만하다. 하지만 일부만 골라 검사하면 그 학생은 하루 종일 위축될 수 있다. 감시는 개인을 향하지 않을 때 정당성이 커진다. 그러므로 감시를 하더라도 모두에게 같은 방식이어야 한다.","w":"심리 1학년","arg":"개인을 향하지 않는 감시일수록 정당성이 커진다","src":"education_exam_surveillance_g5_03"},{"n":"18","g":5,"t":"이번 감시의 비용을 따질 때 수험생만 보면 놓치는 것이 있다고 생각한다. 정부는 휴대전화를 찾기 위해 전국에 위급재난문자를 세 차례 보냈는데, 이 문자는 시험과 상관없는 시민들의 휴대전화에도 울렸다. 위급재난문자는 실제 재난 때 사람들이 바로 반응해야 하는 경보인데, 다른 목적으로 쓰이는 일이 잦아지면 정말 위급한 순간에 경보를 가볍게 여길 위험이 생긴다. 공정성을 위한 감시라도 그 비용이 시험장 밖의 사회 전체로 번진다면, 정당성의 기준은 수험생의 불편만이 아니라 공공 신뢰까지 포함해야 한다. 그래서 감시는 시험장 안에서 끝나는 수단으로 한정하는 것이 맞다.","w":"언론정보 3학년","arg":"전국에 울린 경보는 시험과 무관한 시민의 비용이자 재난 경보의 신뢰 문제이므로 감시는 시험장 안 수단으로 한정한다","src":"education_exam_surveillance_g6_01"}],"choshi":[{"n":"01","g":0,"t":"받아들이겠다. 시험 중에 소리가 나면 놀라겠지만, 누군가 부정행위로 내 자리를 가져가는 것보다는 낫다. 모두에게 같은 조건이니 공정하다고 생각한다.","w":"교육 1학년","arg":"부정행위로 자리를 뺏기는 것보다 놀라는 편이 낫다","src":"education_exam_surveillance_g1_05"},{"n":"02","g":0,"t":"받아들일 것 같다. 열심히 공부한 사람이 손해 보지 않게 하는 게 더 중요하다. 불편은 하루뿐이다.","w":"수학 1학년","arg":"열심히 공부한 사람이 손해 보지 않는 게 더 중요하다","src":"education_exam_surveillance_g1_06"},{"n":"03","g":0,"t":"받아들이겠다. 휴대전화를 냈다면 나와는 상관없는 소리라고 생각할 수 있다. 오히려 규칙을 어긴 사람이 잡히니 안심이 될 것 같다.","w":"생명과학 1학년","arg":"규칙을 어긴 사람이 잡히니 오히려 안심된다","src":"education_exam_surveillance_g1_07"},{"n":"04","g":1,"t":"받아들이기 어렵다. 시험 중에 갑자기 소리가 나면 나처럼 정직한 사람도 집중이 깨진다. 시험 전에 확실하게 점검하는 방법이면 좋겠다.","w":"경제 1학년","arg":"정직한 사람의 집중까지 깨지므로 시험 전 점검이 낫다","src":"education_exam_surveillance_g2_05"},{"n":"05","g":1,"t":"시험 전에 한 번이라면 괜찮지만 시험 중이라면 반대한다. 부정행위를 하지 않은 사람이 왜 손해를 봐야 하는지 모르겠다. 방법을 바꿨으면 좋겠다.","w":"국어국문 1학년","arg":"부정행위를 하지 않은 사람이 손해를 볼 이유가 없다","src":"education_exam_surveillance_g2_06"},{"n":"06","g":2,"t":"경보보다는 걸렸을 때 확실하게 처벌받는다는 게 더 효과적이라고 생각한다. 정직한 사람까지 놀라게 하는 건 반대다. 규칙을 어긴 사람만 손해를 보게 해야 한다.","w":"경영 1학년","arg":"규칙을 어긴 사람만 손해를 보게 해야 한다","src":"education_exam_surveillance_g3_04"},{"n":"07","g":2,"t":"받아들이긴 하겠지만 근본적인 방법은 아닌 것 같다. 부정행위를 하면 큰 손해라는 걸 확실히 알게 하는 게 더 중요하다. 그러면 감시를 이렇게까지 하지 않아도 된다.","w":"사학 2학년","arg":"부정행위가 큰 손해라는 걸 확실히 알게 하는 게 근본이다","src":"education_exam_surveillance_g3_05"},{"n":"08","g":2,"t":"불편하지만 참을 수는 있다. 그래도 진짜 막는 것은 처벌이라고 본다. 감시만 늘리는 건 끝이 없다.","w":"화학공학 1학년","arg":"감시만 늘리는 건 끝이 없다","src":"education_exam_surveillance_g3_06"},{"n":"09","g":3,"t":"받아들이겠지만 이런 방식이 계속될 수는 없다고 생각한다. 기기는 점점 작아질 텐데 경보로 다 잡을 수 있을지 의문이다. 시험 방식 자체를 바꿔야 할 때인 것 같다.","w":"컴퓨터공학 2학년","arg":"기기는 점점 작아지니 경보로 다 잡을 수 있을지 의문이다","src":"education_exam_surveillance_g4_04"},{"n":"10","g":3,"t":"받아들이기 어렵다. 이렇게까지 해야 하는 시험이라면 시험의 형태가 시대에 맞지 않는 것이다. 감시보다 다른 방식의 평가가 필요하다.","w":"철학 1학년","arg":"이렇게까지 해야 하는 시험이라면 형태가 시대에 맞지 않는다","src":"education_exam_surveillance_g4_05"},{"n":"11","g":4,"t":"받아들이겠다. 모두에게 똑같이 울리는 소리라면 나만 의심받는 게 아니니까 괜찮다. 나만 따로 검사받는 것보다는 훨씬 낫다.","w":"디자인 1학년","arg":"나만 따로 검사받는 것보다 모두에게 울리는 소리가 낫다","src":"education_exam_surveillance_g5_04"},{"n":"12","g":5,"t":"개인적으로는 받아들일 수 있다. 하지만 이 경보가 시험을 보지 않는 사람들에게도 울린다는 점이 걸린다. 진짜 재난 문자를 사람들이 대충 넘기게 될까 봐 걱정된다.","w":"도시공학 2학년","arg":"시험을 보지 않는 사람에게도 울린다는 점이 걸린다","src":"education_exam_surveillance_g6_02"}]},"aicsat":{"boksi":[{"n":"01","g":0,"t":"나는 대입 시험에서 채점의 객관성을 더 중시해야 한다고 본다. AI가 수능 문제를 빨리 푼다는 사실은 AI의 능력을 보여 줄 뿐, 사람끼리 비교하는 시험의 의미를 없애지는 않는다. 수십만 명이 보는 시험에서 가장 중요한 것은 누구에게나 같은 기준으로 점수를 매기는 것이고, 객관식은 이 점에서 가장 믿을 만한 방법이다. 서술형으로 바꾸면 채점자의 판단이 개입해 결과를 둘러싼 분쟁이 커질 것이다. 그래서 시험장 보안을 강화하되 평가 방식의 객관성은 지켜야 한다.","w":"경영 2학년","arg":"AI의 능력이 사람끼리 비교하는 시험의 의미를 없애지 않으며 대량 시험에서는 객관성이 핵심이다","src":"scitech_ai_csat_g1_01"},{"n":"02","g":0,"t":"계산기가 사람보다 계산을 빨리 한다고 수학 시험을 없애지 않았다. 시험은 기계와 사람을 비교하는 것이 아니라 같은 조건의 사람들을 비교하는 도구다. AI가 만점을 받는 것은 놀랍지만, 시험장에서 AI를 쓰지 못하게 한다면 시험은 여전히 사람의 실력을 잰다. 오히려 사고 과정을 평가하는 방식은 집안 환경이나 사교육의 영향을 더 크게 받을 수 있다. 객관성은 공정한 기회를 위한 최소한의 조건이다.","w":"수학 3학년","arg":"계산기가 있다고 수학 시험을 없애지 않았듯 시험은 같은 조건의 사람을 비교한다","src":"scitech_ai_csat_g1_02"},{"n":"03","g":0,"t":"대입은 결과에 대한 승복이 중요하다. 객관식은 왜 그 점수를 받았는지 누구나 확인할 수 있어서 결과를 받아들이기 쉽다. 사고 과정을 평가하면 같은 답안에도 점수가 다를 수 있고, 수험생은 그 이유를 납득하기 어렵다. AI 시대에도 이 원칙은 바뀌지 않는다. 그래서 나는 객관성을 우선해야 한다고 본다.","w":"법학 2학년","arg":"누구나 이유를 확인할 수 있어야 대입 결과에 승복할 수 있다","src":"scitech_ai_csat_g1_03"},{"n":"04","g":0,"t":"AI가 문제를 푼다는 것이 위협이 되는 것은 시험장 안에서 AI를 쓸 수 있을 때뿐이다. 그렇다면 문제는 평가 방식이 아니라 보안이다. 보안이 해결된 시험이라면, 객관식은 여전히 많은 사람의 기본 실력을 빠르고 공정하게 확인하는 좋은 방법이다. 평가 방식을 바꾸는 큰 비용보다 보안을 강화하는 비용이 작다. 그래서 객관성을 유지하는 쪽이 합리적이다.","w":"컴퓨터공학 3학년","arg":"문제는 평가 방식이 아니라 보안이며 보안 강화 비용이 더 작다","src":"scitech_ai_csat_g1_04"},{"n":"05","g":1,"t":"AI가 정답을 몇 초 만에 찾는 시대라면, 대입 시험은 정답보다 생각의 과정을 평가해야 한다. 정답을 빨리 고르는 능력은 대학과 사회에서 점점 AI가 대신하게 될 능력이다. 반대로 문제를 어떻게 이해하고 왜 그렇게 판단했는지 설명하는 능력은 사람이 계속 맡아야 할 부분이다. 서술형 채점의 주관성 문제는 분명히 있지만, 평가 기준표를 공개하고 여러 명이 채점하면 상당 부분 줄일 수 있다. 객관성은 지켜야 할 조건이지 평가 목적 자체가 될 수는 없다.","w":"교육 3학년","arg":"정답을 빨리 고르는 능력은 AI가 대신하므로 사람이 맡을 설명·판단 능력을 평가한다","src":"scitech_ai_csat_g2_01"},{"n":"06","g":1,"t":"시험이 무엇을 평가하는지에 따라 학생이 무엇을 공부하는지가 정해진다. 정답 고르기 시험이 계속되면 학생들은 문제 유형을 외우고 빠르게 푸는 연습만 한다. 그런 능력은 이제 AI가 더 잘한다. 사고 과정을 평가하는 시험으로 바뀌면 수업도 토론과 글쓰기 중심으로 바뀔 것이다. 그래서 대입 시험은 객관성보다 미래에 필요한 능력을 기준으로 다시 설계되어야 한다.","w":"사회학 2학년","arg":"시험이 바뀌어야 공부와 수업이 미래에 필요한 능력으로 바뀐다","src":"scitech_ai_csat_g2_02"},{"n":"07","g":1,"t":"객관식은 공정해 보이지만, 사실 문제 푸는 기술을 많이 익힌 학생에게 유리하다. 어려운 문항일수록 생각의 깊이보다 유형에 대한 경험이 점수를 가르기도 한다. 서술형도 사교육의 영향을 받겠지만, 적어도 학생이 실제로 이해했는지는 더 잘 드러난다. 객관성과 사고력 중 하나를 고르라면, 나는 측정하려는 능력에 더 가까운 쪽을 고르겠다. 시험의 공정성은 채점 방식만이 아니라 무엇을 재느냐에서도 나온다.","w":"철학 3학년","arg":"시험의 공정성은 채점 방식뿐 아니라 무엇을 재느냐에서도 나온다","src":"scitech_ai_csat_g2_03"},{"n":"08","g":1,"t":"AI는 답을 맞히는 데 강하지만, 왜 그 답인지 학생 자신의 말로 설명하는 것은 그 학생만 할 수 있다. 그래서 설명을 요구하는 문항은 부정행위도 어렵게 만든다. 감시 비용을 줄이면서도 실력을 제대로 잴 수 있다는 점에서 사고 과정 평가가 낫다. 채점 공정성은 기술과 제도로 보완할 문제이지 포기할 이유가 아니다.","w":"컴퓨터공학 4학년","arg":"자기 말로 설명하는 문항은 부정행위도 어렵게 만든다","src":"scitech_ai_csat_g2_04"},{"n":"09","g":2,"t":"AI가 수능을 쉽게 푼다는 것은, 수능이 수십만 명을 한 줄로 세우는 시험으로 계속 쓰이기 어렵다는 신호라고 본다. 객관성과 사고 과정 중 하나를 고르기보다 역할을 나누는 것이 맞다. 수능은 기본 학업 능력을 확인하는 자격시험으로 두고 객관식의 장점을 살리며, 사고 과정은 대학이 전공에 맞게 면접이나 논술로 평가하게 하는 것이다. 이렇게 하면 국가 시험의 객관성과 대학 선발의 깊이를 모두 얻을 수 있다. 기준은 한 시험에 모든 것을 맡기지 않는 것이어야 한다.","w":"교육 4학년","arg":"수능은 객관식 자격시험으로, 사고 과정은 대학이 전공에 맞게 평가하도록 역할을 나눈다","src":"scitech_ai_csat_g3_01"},{"n":"10","g":2,"t":"지금 수능은 기초 실력 확인과 상위권 변별이라는 두 역할을 한꺼번에 하려다 보니 어려운 문항이 필요해진다. 그런데 그 어려운 문항조차 AI가 빠르게 풀어낸다면, 변별을 위해 문제를 꼬는 방식은 의미가 줄어든다. 그래서 수능은 기초 확인만 하고, 변별은 대학이 다양한 방식으로 하는 것이 낫다. 객관성은 기초 확인 단계에서 충분히 지켜질 수 있다. 사고력 평가는 대학의 몫으로 넘기자.","w":"수학 3학년","arg":"변별을 위해 문제를 꼬는 방식도 AI가 풀어내니 변별은 대학에 넘긴다","src":"scitech_ai_csat_g3_02"},{"n":"11","g":2,"t":"모든 학생을 하나의 점수로 비교하는 방식은 AI 시대에 맞지 않는다. 대학과 전공마다 필요한 능력이 다른데 같은 시험 점수로 뽑는 것은 비효율적이다. 수능의 비중을 낮추고 대학이 자기 기준으로 평가하게 하면, 학생도 자기 진로에 맞는 능력을 기를 수 있다. 다만 대학 자율이 커질수록 공정성 감시가 필요하다. 그래서 대학의 평가 기준과 결과를 공개하게 해야 한다.","w":"경영 3학년","arg":"대학 자율을 넓히되 평가 기준과 결과를 공개해 공정성을 감시한다","src":"scitech_ai_csat_g3_03"},{"n":"12","g":3,"t":"객관성과 사고 과정 평가는 둘 중 하나만 고를 문제가 아니라 비율의 문제라고 본다. 객관식만으로는 생각의 깊이를 볼 수 없고, 서술형만으로는 채점 공정성 논란을 피하기 어렵다. 그래서 대부분은 객관식으로 기본 실력을 확인하고, 일부 문항을 짧은 서술형으로 바꿔 풀이 과정을 확인하는 방식이 현실적이다. 서술형 비율을 점차 늘려 가면 채점 체계도 함께 다듬을 수 있다. 기준은 한 번에 바꾸는 것이 아니라 신뢰를 쌓으며 바꾸는 것이다.","w":"행정 3학년","arg":"객관성과 사고력은 비율의 문제이므로 객관식 기반에 짧은 서술형을 점차 늘린다","src":"scitech_ai_csat_g4_01"},{"n":"13","g":3,"t":"수학이라면 답만 쓰게 하지 말고 핵심 풀이 한두 줄을 함께 쓰게 하면 된다. 풀이가 답과 맞는지만 확인하면 채점도 크게 주관적이지 않다. 이렇게 하면 외부에서 답만 받은 경우를 걸러 낼 수 있고, 학생이 실제로 이해했는지도 볼 수 있다. 완전한 서술형 전환보다 부담이 적어 현실성도 있다. 나는 이런 작은 변화부터 시작해야 한다고 생각한다.","w":"수학 4학년","arg":"핵심 풀이 한두 줄만 쓰게 해도 채점은 객관적이고 이해 여부는 드러난다","src":"scitech_ai_csat_g4_02"},{"n":"14","g":3,"t":"시험 방식을 급격하게 바꾸면 그 변화에 빨리 적응할 수 있는 학생, 즉 정보와 사교육을 쉽게 얻는 학생이 유리해진다. 그래서 변화는 필요하지만 속도와 방식이 중요하다. 객관식을 유지하면서 서술형을 조금씩 늘리면 모든 학생이 준비할 시간을 가질 수 있다. 공정성은 평가 방식뿐 아니라 변화의 속도에서도 지켜져야 한다.","w":"사회복지 2학년","arg":"급격한 전환은 정보가 많은 학생에게 유리하므로 변화의 속도도 공정해야 한다","src":"scitech_ai_csat_g4_03"},{"n":"15","g":4,"t":"AI가 문제를 푸는 시대에 AI 없이 푸는 능력만 평가하는 것은 사회와 맞지 않는다고 생각한다. 대학과 직장에서는 AI를 쓰면서 문제를 정의하고, AI의 답이 맞는지 검증하는 능력이 더 중요해지고 있다. 그래서 대입 시험도 일부는 AI를 사용할 수 있게 하고, 학생이 AI의 답을 어떻게 판단하고 고쳤는지를 평가하는 방식을 고민해야 한다. 이렇게 하면 부정행위라는 개념 자체가 바뀌어 감시 부담도 줄어든다. 물론 모든 영역에 적용하기는 어렵기 때문에, 기초 능력 시험과 AI 활용 평가를 나누는 것이 기준이 되어야 한다.","w":"컴퓨터공학 4학년","arg":"사회는 AI와 함께 문제를 정의·검증하는 능력을 요구하므로 평가를 기초 능력과 AI 활용으로 나눈다","src":"scitech_ai_csat_g5_01"},{"n":"16","g":4,"t":"AI가 수능 수학 문제를 몇 초 만에 푸는데, 학생에게 같은 문제를 오랜 시간 풀게 하는 것이 무엇을 위한 것인지 생각해 봐야 한다. 기초 원리를 이해하는 것은 여전히 중요하지만, 그것만 반복해서 평가하는 것은 시대에 뒤처진다. AI의 풀이에서 오류를 찾아내는 문항을 내면 원리 이해와 AI 활용 능력을 함께 볼 수 있다. 이런 문항은 객관식으로도 만들 수 있어 채점 객관성도 지킬 수 있다. 나는 평가 대상을 AI를 다루는 사고력으로 넓혀야 한다고 본다.","w":"산업공학 3학년","arg":"AI 풀이의 오류를 찾는 문항은 객관식으로도 원리 이해와 활용 능력을 함께 잰다","src":"scitech_ai_csat_g5_02"},{"n":"17","g":4,"t":"AI 사용을 금지하는 시험만 계속하면 학교 공부와 실제 삶의 거리가 점점 멀어진다. 학생들은 시험을 위해서는 AI 없이, 실제로는 AI와 함께 공부하는 이중생활을 하게 된다. 시험이 현실을 반영해야 공부도 현실에 맞게 바뀐다. 그래서 대입 평가의 일부라도 AI 활용 능력을 다뤄야 한다.","w":"교육 2학년","arg":"시험이 현실을 반영해야 공부도 현실에 맞게 바뀐다","src":"scitech_ai_csat_g5_03"},{"n":"18","g":5,"t":"AI가 수능을 쉽게 푼다는 결과에서 내가 주목한 것은 오히려 AI가 틀린 문제였다. 보도에 따르면 여러 AI가 공통 21번이나 미적분·기하 30번 같은 어려운 문항에서 틀렸는데, 이런 문항은 여러 개념을 엮어 스스로 풀이 방향을 잡아야 하는 문제였다. 그렇다면 객관성과 사고력 평가는 반드시 부딪히는 것이 아니다. 객관식 형식을 유지하더라도 AI가 아직 어려워하는 유형, 즉 개념을 조합하고 판단하는 문항의 비중을 높이면 채점의 객관성을 지키면서 사고 과정을 재는 시험에 가까워질 수 있다. 시험을 통째로 바꿀지보다, 어떤 문항이 사람의 생각을 드러내는지 데이터로 찾아 그 비중을 늘리는 것이 기준이 되어야 한다.","w":"수학 3학년","arg":"AI가 틀린 개념 조합 문항의 비중을 늘리면 객관식 형식으로도 사고 과정을 잴 수 있다","src":"scitech_ai_csat_g6_01"}],"choshi":[{"n":"01","g":0,"t":"보여 준다고 생각한다. AI는 시험장에 들어갈 수 없고, 나는 내 머리로 풀었기 때문이다. AI가 잘 푸는 것과 내 실력은 별개다.","w":"경제 1학년","arg":"AI는 시험장에 못 들어오고 나는 내 머리로 풀었다","src":"scitech_ai_csat_g1_05"},{"n":"02","g":0,"t":"그렇다고 본다. 달리기 시합에서 자동차가 더 빠르다고 내 기록이 무의미해지지는 않는다. 사람끼리의 비교라는 점이 중요하다.","w":"체육 2학년","arg":"자동차가 더 빨라도 내 달리기 기록은 의미가 있다","src":"scitech_ai_csat_g1_06"},{"n":"03","g":0,"t":"어느 정도는 보여 준다. 다만 그 점수가 앞으로 사회에서 필요한 능력과 같은지는 잘 모르겠다. 그래도 지금 시험에서의 실력은 맞다.","w":"행정 1학년","arg":"지금 시험에서의 실력은 맞지만 사회에 필요한 능력과 같은지는 모르겠다","src":"scitech_ai_csat_g1_07"},{"n":"04","g":1,"t":"완전히 보여 준다고는 못하겠다. 정답을 고르는 능력은 보여 주지만 내가 얼마나 깊이 이해했는지는 보여 주지 못한다. 생각하는 과정을 보는 시험이었다면 다른 결과였을 것 같다.","w":"국어국문 2학년","arg":"정답 능력은 보여 주지만 이해의 깊이는 보여 주지 못한다","src":"scitech_ai_csat_g2_05"},{"n":"05","g":1,"t":"일부만 보여 준다고 생각한다. AI가 몇 초 만에 할 수 있는 일을 잘하는 게 내 실력의 전부라면 좀 허무하다. 내 생각을 설명하는 능력도 평가받고 싶다.","w":"심리 1학년","arg":"AI가 몇 초에 하는 일이 내 실력의 전부라면 허무하다","src":"scitech_ai_csat_g2_06"},{"n":"06","g":2,"t":"기본 실력은 보여 준다고 생각한다. 하지만 내가 어떤 공부를 잘하는지까지는 보여 주지 못한다. 그건 대학이 따로 확인해야 하는 것 같다.","w":"생명과학 1학년","arg":"기본 실력은 보여 주지만 어떤 공부를 잘하는지는 대학이 따로 봐야 한다","src":"scitech_ai_csat_g3_04"},{"n":"07","g":2,"t":"최소한의 실력은 보여 준다. 다만 등수를 가르는 데 쓰이기에는 부족하다고 느낀다. 합격과 불합격 정도만 정하는 시험이면 더 의미 있을 것 같다.","w":"통계 2학년","arg":"등수를 가르기보다 합격·불합격을 정하는 시험이면 더 의미 있다","src":"scitech_ai_csat_g3_05"},{"n":"08","g":2,"t":"반만 보여 준다고 생각한다. 기초는 확인되지만 나만의 강점은 드러나지 않는다. 다른 방식의 평가가 함께 있어야 한다.","w":"미디어 1학년","arg":"기초는 확인되지만 나만의 강점은 드러나지 않는다","src":"scitech_ai_csat_g3_06"},{"n":"09","g":3,"t":"어느 정도는 보여 주지만 전부는 아니다. 답을 맞힌 건 내 실력이지만 왜 그렇게 풀었는지는 점수에 안 나온다. 둘 다 볼 수 있는 시험이면 좋겠다.","w":"화학 2학년","arg":"답은 내 실력이지만 왜 그렇게 풀었는지는 점수에 안 나온다","src":"scitech_ai_csat_g4_04"},{"n":"10","g":3,"t":"보여 준다고 생각한다. 다만 앞으로는 풀이 과정도 함께 보면 더 정확할 것 같다. 답만 맞히는 시험은 점점 의미가 줄어들 것 같다.","w":"기계공학 1학년","arg":"앞으로는 풀이 과정도 함께 봐야 더 정확하다","src":"scitech_ai_csat_g4_05"},{"n":"11","g":4,"t":"지금 시험에서의 실력은 보여 준다. 하지만 앞으로 필요한 건 AI를 잘 쓰는 능력이라서, 이 점수가 그걸 보여 주지는 못한다. 시험도 바뀌어야 한다고 생각한다.","w":"경영 1학년","arg":"앞으로 필요한 건 AI를 잘 쓰는 능력이라 이 점수로는 알 수 없다","src":"scitech_ai_csat_g5_04"},{"n":"12","g":5,"t":"부분적으로만 보여 준다고 생각한다. AI도 틀린 어려운 문제를 내가 풀었다면 그건 확실히 내 실력이다. 반대로 AI가 몇 초 만에 푸는 문제는 실력보다는 연습량을 보여 주는 것 같다.","w":"물리 2학년","arg":"AI도 틀린 문제를 풀었다면 그건 확실히 내 실력이다","src":"scitech_ai_csat_g6_02"}]}};

  ARTICLES.forEach(a=>{

    list.filter((s,i)=>i%2===0).forEach(s=>{
      const c=a.clusters[s.g];const rep=repN.has(s.n)&&c&&c.s.text===s.t;
      DB.essays.push({id:`exc-${a.id}-boksi-${s.n}`,userId:'example',nickname:`예시 반 학생 ${s.n}`,articleId:a.id,level:'boksi',revised:s.t,draft:s.t,group:s.g,published:true,isExample:true,classId:'yonsei-writing',base:rep?{ag:Math.ceil(c.s.agree/2),pn:Math.ceil(c.s.pen/2)}:{ag:0,pn:0},rep});

    });
  });

  /* [API 1] 쓰기 전 생각할 거리: 답 대신 질문 3개

     입력: {article, level, text, personaIndex}
     출력: {flag?, stance, structure:{claim, reasons[], premise, premiseFrom?, claimIndex?}, weaknesses:[{type,detail,question}],

      const ev=s.filter(x=>has(x,EVID)||/\d/.test(x)).length, art=has(t,['기사','따르면']);
      const hedges=s.filter(x=>has(x,HEDGE)).length;
      const R={}, five=v=>Math.max(1,Math.min(5,v)), ten=v=>clamp(five(v)*2-(five(v)<5&&s.length<LEVELS[level].target?1:0));
      W['쟁점 설명']=[stanceHit?'첫 문장에서 질문이 묻는 선택지를 직접 다룹니다.':'첫 문장만으로는 질문의 어느 선택지를 다루는지 드러나지 않습니다.',
                    s.length>=LEVELS[level].target?`요구한 ${LEVELS[level].target}문장 분량을 채웠습니다.`:`요구한 ${LEVELS[level].target}문장보다 짧아 쟁점을 다 펼치지 못했습니다.`];
      R['쟁점 설명']=ten(2+(stanceHit?1:0)+(s.length>=LEVELS[level].target?1:0)+(art?1:0));
      W['근거 활용']=[ev?`근거로 볼 수 있는 문장이 ${ev}개 있습니다.`:'주장을 받치는 사실이나 사례가 보이지 않습니다.',
                    art?'기사 내용을 근거로 끌어왔습니다.':'기사 속 사실을 근거로 쓰지 않았습니다.'];
      R['근거 활용']=ten(1+Math.min(3,ev)+(art?1:0));
      const cond=has(t,COND), conc=has(t,CONCEDE), hit=rebuttal&&shareKey(t,rebuttal.text);
      W['맥락과 전제']=[conc?'반대쪽에서 나올 지적을 글 안에서 다룹니다.':'내 주장이 틀릴 수 있는 경우를 다루지 않았습니다.',
                    cond?'주장이 통하는 조건을 스스로 정했습니다.':'주장이 어떤 조건에서만 맞는지 정하지 않았습니다.',
                    ...(hit?['받은 반론이 겨냥한 전제를 글에서 직접 다룹니다.']:[])];
      R['맥락과 전제']=ten(1+(conc?1:0)+(cond?2:0)+(hit?1:0));
      W['자기 입장']=[has(first,HEDGE)?'첫 문장이 추측으로 끝나 입장이 흐립니다.':'첫 문장에서 입장을 단정적으로 밝힙니다.',
                    conc?'반대 입장을 인정한 뒤 자기 기준을 다시 세웁니다.':'반대 입장을 언급하지 않아 입장의 근거가 한쪽만 보입니다.'];
      R['자기 입장']=ten(2+(has(first,HEDGE)?-1:1)+(conc?1:0)+(hedges?0:1));
      const con=has(t,CONNECT), out=has(t,OUTCOME);
      W['결론과 함의']=[con?'"따라서", "그래서"로 근거와 결론을 이었습니다.':'근거에서 결론으로 넘어가는 연결이 없습니다.',
                     out?'결론이 낳을 결과까지 적었습니다.':'결론을 따랐을 때 어떤 결과가 생기는지는 적지 않았습니다.',
                     ...(hedges?[`추측으로 끝난 문장 ${hedges}개가 결론의 힘을 약하게 합니다.`]:[])];
      R['결론과 함의']=ten(2+(con?1:0)+(out?1:0)+(s.length>=LEVELS[level].target?1:0)-hedges);
      return {R,W};
    };
    const b=grade(draft),a=grade(revised);
    return {before:b.R,after:a.R,why:Object.fromEntries(Object.keys(RUBRIC).map(k=>[k,{before:b.W[k],after:a.W[k]}]))};
  },

  /* [API 5] 시관에게 묻기: 대화창만. 재반박도 여기서 받음
     입력: {question, feedback}  출력: {refused:boolean, kind:'refuse'|'rebuttal'|'answer', reply}
     원칙: 대필 요청은 거절(입력 가드레일). 재반박에는 "누가 맞다"고 판정하지 않고, 그 반박이 성립하려면 무엇이 참이어야 하는지만 짚음 */
  async ask({question,feedback}){
    if(API.on)try{return await API.post('ask',{articleId:S.articleId,level:S.level,draft:S.draft,question,feedback,chat:S.chat})}catch(e){console.warn(e)}
    await sleep(450);
    if(BYPASS.test(question)||/대신|모범|정답/.test(question))
      return {refused:true,kind:'refuse',reply:'글은 대신 써 드리지 않습니다. 대신 하나만 묻겠습니다. '+(feedback?.weaknesses[0]?.question||'당신의 주장을 가장 강하게 받치는 근거는 무엇입니까?')};
    if(/틀렸|아니라고|동의하지|동의 못|반박|과장|그렇지 않|다르다고|말이 안/.test(question))
      return {refused:false,kind:'rebuttal',reply:'좋은 반박입니다. 다만 그 반박이 성립하려면 하나가 더 필요합니다. 반론이 짚은 상황이 실제로는 드물거나 다르게 흘러간다는 근거입니다. 그 근거를 고친 답안 안에 적으면, 반론을 받아들이지 않고도 글이 단단해집니다. 이 반론을 받아들일지는 당신이 정합니다.'};
    if(/전제/.test(question))
      return {refused:false,kind:'answer',reply:`숨은 전제는 글에 쓰지 않았지만, 근거에서 주장으로 넘어가려면 참이어야 하는 생각입니다. 지금 글에서는 "${feedback?.structure.premise||''}"가 그렇습니다. 이 전제가 틀린다면 주장은 어떻게 됩니까?`};
    return {refused:false,kind:'answer',reply:'그 답은 당신의 글 안에서 찾아보면 좋겠습니다. 어느 문장이 이 질문과 가장 가깝습니까?'};
  },

  /* [API 5-1] (v4) 고쳐 쓰기 칸 검사: 답안 대신 AI에게 하는 요청을 적었는지
     입력: {text}  출력: {blocked:boolean}  ※ 답안 본문 속 "법을 고쳐야 한다" 같은 문장은 막지 않음 */
  async checkRevised({text}){
    if(API.on)try{return await API.post('check',{text})}catch(e){console.warn(e)}
    const t=text.trim();
    return {blocked:BYPASS.test(t)&&(t.length<120||sentences(t).some(s=>BYPASS.test(s)&&/(줘|주세요|please|\?)\s*[.!?]?$/i.test(s)))};
  },

  /* [API 6] (v4.2) 다음 책문의 과제: 가장 약한 기준. 오늘 과제를 해냈으면 두 번째로 약한 기준 (AI 없이 규칙, 단계 없음)
     입력: {scores, today, result}  출력: 과제 객체 */
  async nextTask({scores,today,result}){return getNextTask({scores,today,result})},

  /* [API 7] 관점 지도: 시드 답안을 미리 묶어 저장해 두고, 내 글은 가장 가까운 그룹에 배정
     입력: {article, text, level}  출력: {clusters:[...], mine:index} */
  async clusterAnswers({article,text,level}){
    if(API.on)try{const r=await API.post('place',{articleId:article.id,level,text});return {clusters:article.clusters,mine:r.mine}}catch(e){console.warn(e)}
    await sleep(300);
    const st = level==='choshi' ? null : detectStance(article,text).id;
    let i = article.clusters.findIndex(c=>c.stance===st);
    if(i<0){ /* 초시나 입장을 못 찾으면 글자 유사도가 가장 높은 그룹 */
      let best=0,bs=-1;article.clusters.forEach((c,k)=>{const s=jaccard(c.s.text,text);if(s>bs){bs=s;best=k}});i=best;
    }
    return {clusters:article.clusters,mine:i};
  },

  /* [API 8] 나의 기록: 누적 글 분석 (시연은 미리 계산한 데모 계정. 새 계정은 빈 상태) */
  async writingProfile(user){return user&&user.profile==='demo'?PROFILE:null}
};

const S={view:'start',step:0,articleId:'examwatch',picked:false,levelChosen:false,srcTab:'body',level:'boksi',todayTask:null,
  user:null,auth:{scope:'p',tab:'login',org:null,cls:null,role:null,err:'',after:null},teacher:{sel:null},

  revised:'',blocked:null,compare:null,next:null,taskResult:null,

function resetWriting(){Object.assign(S,{draft:'',log:{start:null,paste:0,revisions:0,refused:0},prewrite:null,running:false,pipe:[],verify:null,attempts:0,feedback:null,personaIndex:0,pastRebuttals:[],otherLoading:false,chat:[],revised:'',blocked:null,compare:null,next:null,taskResult:null,submitted:false,myEssay:null,plaza:null})}
function clearAfterDraft(){Object.assign(S,{feedback:null,pastRebuttals:[],otherLoading:false,verify:null,pipe:[],chat:[],revised:'',blocked:null,compare:null,next:null,taskResult:null,submitted:false,myEssay:null,plaza:null})}
const isStudent=()=>S.user?.role==='student', isProf=()=>S.user?.role==='professor', isCenter=()=>S.user?.role==='center', isOrg=()=>S.user&&S.user.scope==='o';
const myClass=()=>S.user?.classId?CLASSES[S.user.classId]:null;
const rubricFor=()=>{const r=myClass()?.rubric;return r||null};
const ruleDef=k=>rubricFor()?.[k]?.def||RUBRIC[k].def;

/* ---------- 진행선 (6단계: 난이도는 '질문' 단계의 첫 화면) ---------- */
const STEPS=['기사','질문','쓰기','반론','고쳐 쓰기','광장'];
const STEP={PICK:0,QUESTION:1,WRITE:2,REBUT:3,REVISE:4,PLAZA:5};
function reached(){let r=0;if(S.picked)r=1;if(S.picked&&S.levelChosen&&S.user)r=2;if(S.draft.trim())r=3;if(S.feedback)r=4;if(S.submitted)r=5;return r}
function drawTrack(){
  const el=$('#track'), r=reached(), flow=S.view==='flow';
  el.parentElement.hidden=!flow;
  el.style.setProperty('--p',S.step/5);
  el.innerHTML=STEPS.map((l,i)=>{
    const cls = i===S.step ? 'now' : i<r ? 'done' : i===r ? 'open' : '';
    return `<li><button class="st ${cls}" data-step="${i}" ${i>r?'disabled':''} ${i===S.step?'aria-current="step"':''}><span class="ball">${i+1}</span><span class="lb">${l}</span></button></li>`;
  }).join('');
  $$('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));
}
function go(i){
  if(i>reached())return;
  S.view='flow';S.step=i;render(true);window.scrollTo(0,0);
}
function view(v){S.view=v;render(true);window.scrollTo(0,0)}

/* ---------- 머리 ---------- */
function drawTop(){
  const L=[];
  if(S.user) L.push(`<span class="who-chip">${isOrg()?'<span class="badge org">기관</span>':''}${esc(S.user.nickname)}</span><button class="toplink" data-top="logout">로그아웃</button>`);
  else if(S.view!=='start'&&S.view!=='auth') L.push(`<button class="toplink" data-top="login">로그인</button>`);
  $('#toplinks').innerHTML=L.join('')+(API.checked&&!API.on?'<span class="mockmark" title="서버의 AI가 연결되기 전이라 규칙 기반 목업으로 동작합니다">목업 모드</span>':'');
  $$('[data-top]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.top;
    if(t==='logout'){S.user=null;S.todayTask=null;resetWriting();S.picked=false;S.levelChosen=false;S.step=0;view('start');return}
    if(t==='login'){S.auth={...S.auth,scope:'p',tab:'login',err:'',after:{view:S.view,step:S.step}};view('auth');return}
    if(t==='flow'){S.view='flow';render(true);return}
    view(t);
  });
}

function drawTabs(){
  const el=$('#tabbar'), hide=['start','auth','org','board'].includes(S.view);
  el.hidden=hide;document.body.classList.toggle('has-tabs',!hide);
  if(hide){el.innerHTML='';return}
  const cur=S.view==='profile'||S.view==='teacher'||S.view==='center'?'me':S.view==='peek'||(S.view==='flow'&&S.step===STEP.PLAZA)?'plaza':'flow';
  const T=[['flow','책문',ICON.flow],['plaza','광장',ICON.plaza],isProf()?['me','우리 반',ICON.cls]:isCenter()?['me','학기 리포트',ICON.rec]:['me','나의 기록',ICON.rec]];
  el.innerHTML=`<ul>${T.map(([k,l,i])=>`<li><button data-tabbar="${k}" ${k===cur?'aria-current="page"':''}>${i}<span>${l}</span></button></li>`).join('')}</ul>`;
  $$('[data-tabbar]').forEach(b=>b.onclick=async()=>{
    const t=b.dataset.tabbar;
    if(t==='flow'){
      if(S.view==='peek')S.plaza=null;
      if(S.view==='flow'&&S.step===STEP.PLAZA){go(STEP.PICK);return}
      S.view='flow';render(true);window.scrollTo(0,0);return}
    if(t==='plaza'){
      if(S.submitted){go(STEP.PLAZA);if(!S.plaza){await loadPlaza();render()}return}
      if(S.picked&&S.levelChosen){S.plaza=null;view('peek');await loadPlaza();render();return}
      toast('기사와 난이도를 고르면 그 질문의 광장을 볼 수 있습니다.');S.view='flow';go(S.picked?STEP.QUESTION:STEP.PICK);return}
    if(!S.user){S.auth={...S.auth,scope:'p',tab:'login',err:'',after:{view:S.view,step:S.step}};view('auth');return}
    view(isProf()?'teacher':isCenter()?'center':'profile');
  });
}

/* ---------- (v4.3) 연속 응시와 응시 달력: 기록에서 계산 ----------
   쓴 날 = 데모 계정의 PROFILE.days + 이 브라우저에서 제출한 글(DB.essays의 createdAt)
   서버 기록으로 바꿀 때도 제출 날짜만 있으면 됨 */
const WD=['일','월','화','수','목','금','토'];
const dayKey=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const daysAgo=o=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-o);return d};
/* 예시 기록: 데모 계정은 PROFILE, 기관 학생 데모는 사용자 history */
function demoHistory(){return S.user?(S.user.history||(S.user.profile==='demo'?PROFILE:null)):null}
function myEssays(){return S.user?DB.essays.filter(e=>e.userId===S.user.id&&!e.isExample):[]}
function writtenDays(){
  const W=new Set();if(!S.user)return W;
  (demoHistory()?.days||[]).forEach(o=>W.add(dayKey(daysAgo(o))));
  myEssays().forEach(e=>{if(e.createdAt)W.add(dayKey(new Date(e.createdAt)))});
  return W;
}
function streakOf(W){const todayDone=W.has(dayKey(daysAgo(0)));let n=0,o=todayDone?0:1;while(W.has(dayKey(daysAgo(o)))){n++;o++}return{n,todayDone}}
function streakHTML(){
  if(!S.user||isProf())return '';
  const W=writtenDays(),{n,todayDone}=streakOf(W);
  const cells=[6,5,4,3,2,1,0].map(o=>{const d=daysAgo(o),on=W.has(dayKey(d));
    return `<li><span class="sq${on?' on':''}${o===0&&!on?' today':''}" title="${o===0?'오늘':(d.getMonth()+1)+'월 '+d.getDate()+'일'}${on?', 응시':''}"></span></li>`}).join('');
  return `<div class="skline" role="group" aria-label="최근 7일 응시 기록">
    <p class="sk-n">${n?`연속 <b>${n}</b>일째 응시`:'연속 응시 기록 없음'}${todayDone?'':'<span class="sr">, 오늘 칸이 비어 있습니다</span>'}</p>
    <ol class="mini7" aria-hidden="true">${cells}</ol>${todayDone?'':'<span class="sk-today">오늘 빈칸</span>'}</div>`;
}
function monthHTML(){
  const W=writtenDays(),now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
  let cnt=0;const cells=[];
  for(let i=0;i<first;i++)cells.push('<li class="blank" aria-hidden="true"><span class="dd"></span></li>');
  for(let d=1;d<=last;d++){const k=y*10000+(m+1)*100+d,on=W.has(k),td=d===now.getDate(),fut=d>now.getDate();if(on)cnt++;
    cells.push(`<li class="${fut?'fut':''}"><span class="dd${on?' on':''}${td&&!on?' today':''}" ${td?'aria-current="date"':''}>${d}</span></li>`)}
  const {n}=streakOf(W);
  return `<section class="block"><h3 class="h">응시 달력</h3><div class="monthbox">
    <div class="month-hd"><b>${m+1}월</b><span>이번 달 ${cnt}일 응시, 연속 ${n}일째</span></div>
    <ol class="month" aria-label="${m+1}월 응시 기록">${WD.map(w=>`<li aria-hidden="true"><span class="wd">${w}</span></li>`).join('')}${cells.join('')}</ol></div></section>`;
}

/* (v4.4) 기관 학생: 비교과 '매일 책문' 학기 진행. 이수 여부만 쓰고 점수는 성적에 쓰지 않음 */

function annotate(f){
  /* (v4.1) 주장에는 번호를 붙이지 않고, 근거만 나온 순서대로 [1], [2]로 구분.
     premiseFrom(1부터 센 문장 번호)이 근거 문장이면 "근거 [n] → 주장 사이"로 표시 */
  const st=f.structure;
  const isClaim=s=>s===st.claim||jaccard(s,st.claim)>.6;
  const isReason=s=>st.reasons.some(r=>r===s||jaccard(s,r)>.6);
  const ss=sentences(S.draft);
  let k=0;const ord={};
  const rows=ss.map((s,i)=>{
    const c=isClaim(s)?'c':isReason(s)?'r':'';
    if(c==='r')ord[i+1]=++k;
    const tag=c==='c'?'주장':c==='r'?`근거 <small style="font-weight:400">[${k}]</small>`:'';
    return `<div class="ln ${c}"><span class="tag">${tag}</span><span class="tx">${esc(s)}</span></div>`;
  }).join('');
  const rn=st.premiseFrom?ord[st.premiseFrom]:null;
  const from=rn?`<span class="from">근거 [${rn}] → 주장 사이에 숨은 생각</span>`:'';
  return rows+`<div class="ln p"><span class="tag">숨은 전제</span><span class="tx">${esc(st.premise)}${from}</span></div>`;
}

async function runFeedback(){

  log('ok','기사 본문을 반론의 근거 범위로 정했습니다');
  let fb=null;

      fb=await AI.analyzeAndRebut({article:a,level:S.level,text:S.draft,personaIndex:S.personaIndex});
      S.pipe.at(-1).state='ok';
      log('run','대신 쓴 문장이나 결론을 한쪽으로 모는 표현이 있는지 검수합니다');
      const v=await AI.verifyFeedback({feedback:fb,text:S.draft});
      S.pipe.at(-1).state=v.pass?'ok':'bad';
