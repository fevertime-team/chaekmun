const SEEDS = {"work45": {"boksi": [{"n": "01", "g": 0, "t": "솔직히 기업이 내는 게 맞다고 봄. 쉬면 일할 때 더 집중하니까 생산성도 오를 것 같다. 그러면 기업도 손해 안 볼 것 같다. 그러니까 기업이 부담해야 한다."}, {"n": "02", "g": 0, "t": "비용은 기업이 부담해야 한다. 일하는 시간이 줄면 그만큼 집중도가 올라간다. 회의나 쓸데없는 업무가 줄어드는 효과도 있다. 늘어난 생산성으로 비용을 감당할 수 있다. 그래서 기업 몫이다."}, {"n": "03", "g": 0, "t": "조심스럽지만, 비용은 기본적으로 기업이 지는 게 맞다고 생각한다. 근무일이 줄면 회사는 불필요한 회의와 보고를 줄이게 되고, 그만큼 같은 시간에 더 많은 일을 처리하게 된다. 물론 기사에서 지적하듯 생산성과 비용 문제가 아직 정리되지 않았고, 모든 회사가 생산성을 올릴 수 있는 건 아니다. 그래서 사무직처럼 업무를 재설계할 수 있는 회사부터 기업 부담으로 시작하자는 것이다. 생산성이 오르는 구조가 확인된 곳에서 먼저 하면, 기업에도 손해가 아니라는 근거가 쌓인다."}, {"n": "04", "g": 0, "t": "일하는 시간이 줄면 정말 생산성이 떨어질까? 나는 오히려 반대라고 본다. 짧게 일하면 집중해서 일하고, 쓸데없는 회의가 줄어든다. 물론 경영계는 경쟁력이 떨어질 수 있다고 우려하지만, 그건 업무 방식을 바꾸지 않은 채 시간만 줄였을 때 이야기다. 그래서 비용은 기업이 부담하되, 업무 방식을 바꾸는 조건으로 해야 한다."}, {"n": "05", "g": 0, "t": "비용은 기업 이윤에서 나와야 한다. 근로시간이 줄면 노동자는 덜 지치고, 덜 지친 노동자는 실수를 덜 한다. 이 효과가 쌓이면 생산성이 오르고, 그 이익이 비용을 메운다. 경쟁력이 떨어진다는 경영계의 우려도 이해하지만, 생산성 향상 없이 시간만 줄이는 회사라면 그건 단축이 아니라 경영의 문제다. 따라서 기업이 부담하는 것이 맞고, 생산성을 올릴 책임도 기업에 있다."}, {"n": "06", "g": 0, "t": "기업이 내야 한다고 생각한다. 직원이 행복하면 일도 잘할 것 같다. 그럼 회사에도 이득일 것 같다. 기업이 부담하는 게 맞다."}, {"n": "07", "g": 0, "t": "비용은 기업이 부담해야 한다. 요즘 취업 준비생은 연봉만큼 근무 조건을 본다. 근무일이 짧은 회사에 좋은 사람이 몰린다. 그러니 단축은 기업이 인재를 붙잡기 위한 투자다. 투자 비용은 투자하는 쪽이 낸다."}, {"n": "08", "g": 0, "t": "솔직히 나도 회사 고를 때 쉬는 날 많은 데 갈 것 같다. 그러면 좋은 사람 데려가려면 회사가 근무 조건을 맞춰야 한다. 그건 회사 사정이니까 회사가 내는 게 맞다. 대신 사람을 덜 뽑아도 되니까 손해만은 아니다."}, {"n": "09", "g": 0, "t": "기업이 부담해야 한다. 근무 조건이 좋아야 사람이 안 나간다. 사람이 자주 나가면 새로 뽑고 가르치는 비용이 더 든다. 그러니 단축은 기업에도 이익이다."}, {"n": "10", "g": 0, "t": "조심스럽게 말하면, 기업이 부담하는 게 장기적으로 기업에도 이득이라고 본다. 근무 조건이 좋은 회사는 직원이 덜 떠나고, 새로 뽑는 비용이 줄어든다. 물론 당장은 비용이 늘어나는 게 맞다. 그래도 그건 인재를 붙잡는 비용으로 볼 수 있다."}, {"n": "11", "g": 1, "t": "여력 있는 대기업이 먼저 부담해야 한다. 대기업은 이윤이 크고 인력도 넉넉하다. 그런 곳이 먼저 하지 않으면 작은 회사는 시작할 엄두도 못 낸다. 비용을 나누는 기준은 여력이다."}, {"n": "12", "g": 1, "t": "솔직히 돈 많은 회사가 먼저 해야지. 작은 회사한테 똑같이 하라는 건 말이 안 된다. 대기업이 먼저 하고 그게 퍼지면 된다. 그래서 대기업이 부담하는 게 공정하다."}, {"n": "13", "g": 1, "t": "대기업이 내야 한다. 돈이 많으니까. 작은 회사는 힘들 것 같다. 대기업부터 해야 한다."}, {"n": "27", "g": 1, "t": "세금을 쓴다면 작은 회사에만 써야 한다고 생각한다. 대기업은 스스로 할 여력이 있다. 그런데 세금으로 대기업까지 지원하면 혜택을 못 받는 납세자에게 불공평하다. 직원 수가 적은 회사부터 지원해야 격차가 줄어든다."}, {"n": "28", "g": 1, "t": "세금으로 대기업까지 도와줘야 하나요? 대기업은 돈이 많으니까 알아서 할 것 같다. 작은 회사만 도와주면 된다. 그게 공정하다."}, {"n": "29", "g": 1, "t": "작은 회사만 지원해야 한다. 대기업은 지원이 필요 없다. 세금은 필요한 곳에 써야 한다."}, {"n": "30", "g": 1, "t": "솔직히 세금은 작은 회사에만 쓰는 게 맞다고 본다. 대기업은 지원 없어도 할 수 있으니까. 작은 회사는 지원 없으면 시작도 못 한다. 그래서 정부 지원은 하되, 직원 수 기준으로 작은 곳에만 줘야 한다."}, {"n": "14", "g": 2, "t": "비용은 노동자가 일부 감수해야 한다. 쉬는 시간과 돈은 바꾸는 것이다. 월급이 조금 줄어도 시간을 원하는 사람은 그걸 고르면 된다. 강제로 모두에게 같은 걸 줄 필요는 없다. 선택할 수 있게만 해 주면 된다."}, {"n": "15", "g": 2, "t": "나는 월급 좀 덜 받아도 쉬고 싶다. 다들 그럴 것 같다. 그러니까 임금 줄여서 하면 될 것 같다. 회사도 손해 안 보고."}, {"n": "16", "g": 2, "t": "임금 일부를 감수하는 게 현실적이다. 시간도 돈만큼 가치가 있다. 줄어든 월급만큼 쉬는 시간을 얻는다. 원하는 사람만 고르면 된다. 강요가 아니라 선택이다."}, {"n": "17", "g": 2, "t": "조심스럽지만 월급을 조금 덜 받는 것도 방법이라고 생각한다. 쉬는 시간을 원하는 사람이 있고, 돈을 더 원하는 사람이 있다. 그 선택을 각자 하게 하면 된다. 다만 월급이 빠듯한 사람에게는 이 선택이 어려울 수 있다는 점은 걸린다."}, {"n": "18", "g": 2, "t": "시간과 돈 중 무엇이 더 중요할까? 그건 사람마다 다르다. 그러니 임금을 줄이는 대신 쉬는 날을 늘리는 선택지를 주면 된다. 다만 월급이 빠듯한 사람은 그 선택을 못 할 수 있으니, 최저 임금 근처의 노동자는 예외로 해야 한다."}, {"n": "19", "g": 2, "t": "노동자랑 기업이 반씩 내는 게 맞는 것 같다. 한쪽만 내면 억울할 것 같다. 반씩 내면 다들 받아들일 것 같다."}, {"n": "20", "g": 2, "t": "왜 한쪽만 비용을 져야 할까? 시간이 줄면 노동자는 쉬는 이익을, 기업은 생산성이라는 이익을 얻는다. 둘 다 이익을 보니 비용도 나누는 게 맞다. 예를 들어 임금은 조금 줄이고 나머지는 기업이 메우는 식이다. 그래야 오래 유지된다."}, {"n": "21", "g": 2, "t": "반반이 맞다. 한쪽만 부담하면 오래 못 간다. 노동자는 임금 조금, 기업은 이윤 조금. 그게 공평하다."}, {"n": "22", "g": 2, "t": "솔직히 한쪽만 다 떠안는 건 오래 못 간다고 본다. 노동자는 쉬는 시간을 얻고 회사는 덜 지친 직원을 얻으니까, 이익을 보는 만큼 비용도 나눠야 한다. 물론 월급이 빠듯한 사람한테는 임금 감소가 너무 크다는 반론이 있다. 그래서 반반으로 나누되, 임금이 낮은 노동자일수록 기업 몫을 더 크게 하자는 거다. 그래야 단축이 형편 좋은 사람들만의 제도가 되지 않는다."}, {"n": "23", "g": 3, "t": "처음에는 정부가 비용을 나눠 져야 한다. 기업도 노동자도 해 보지 않은 제도에 비용을 다 걸기는 어렵다. 정부가 법으로 강제하는 대신 지원을 택한 이유도 여기에 있다. 물론 세금이 쓰인다는 반론이 있지만, 지원은 처음 몇 년으로 기간을 정하면 된다. 그 기간에 생산성이 어떻게 바뀌는지 확인하고, 그 결과를 보고 기업과 노동자가 나눌 몫을 정하는 것이 순서다."}, {"n": "24", "g": 3, "t": "처음엔 정부가 좀 도와줘야 할 것 같아. 회사도 해 본 적 없는 거니까 무서울 것 같다. 정부가 도와주면 해 볼 것 같다. 그러니 정부 지원이 먼저다."}, {"n": "25", "g": 3, "t": "정부가 도와야 한다. 처음은 다 어렵다. 지원이 있으면 시도한다. 그래서 정부 지원이 맞다."}, {"n": "26", "g": 3, "t": "정부가 처음에는 비용을 나눠야 하지 않을까 싶다. 기업 혼자 하기는 부담스러울 것 같다. 정부가 도와주면 더 많은 회사가 할 것 같다."}, {"n": "33", "g": 4, "t": "근무일을 줄이는 것보다 있는 연차를 먼저 쓰게 해야 할 것 같다. 연차가 있어도 눈치 보여서 못 쓰는 사람이 많은 것 같다. 연차부터 다 쓰게 하면 비용도 덜 들 것 같다."}, {"n": "34", "g": 4, "t": "연차도 다 못 쓰는데 근무일을 줄이는 게 먼저일까요? 있는 휴가부터 쓰게 해야 한다. 그게 비용도 덜 든다. 그다음에 단축을 이야기하면 된다."}, {"n": "35", "g": 4, "t": "근데 병원이나 공장처럼 자리 비우면 안 되는 데는 어떻게 하지? 거긴 금요일 오후에 쉬면 누가 대신 해야 하잖아. 그런 데는 비용 이야기 전에 다른 방법을 찾아야 할 것 같다."}, {"n": "36", "g": 4, "t": "업종마다 답이 다르다. 사무직은 시간을 줄여도 일을 조정할 수 있다. 교대 근무는 누군가 쉬면 다른 사람이 메워야 한다. 그런 일터는 인력을 더 뽑는 비용이 핵심이다. 그래서 비용을 나누는 기준도 업종별로 달라야 한다."}, {"n": "31", "g": 5, "t": "솔직히 이건 회사 돈 문제만이 아니라고 본다. 일하는 시간이 길면 아프고 지친 사람이 늘고, 그 치료비와 돌봄 비용은 결국 사회가 낸다. 노동계가 건강권을 이유로 단축을 요구하는 것도 이 때문이다. 세금 낭비라는 반론이 있지만, 아프고 지친 사람을 나중에 돌보는 비용과 비교하면 지금 쓰는 게 덜 든다. 그래서 정부가 비용의 일부를 지는 게 맞고, 효과를 건강 지표로 확인하는 조건을 붙여야 한다."}, {"n": "32", "g": 5, "t": "정부가 일부를 부담해야 한다. 근로시간이 줄면 건강이 나아지고, 아이를 키울 시간도 생긴다. 이건 회사만의 이익이 아니라 사회 전체의 이익이다. 사회가 이익을 보면 사회가 비용을 나눠야 한다. 다만 세금을 쓰는 만큼 효과를 측정해 공개하는 조건이 필요하다. 효과가 없으면 지원도 멈춰야 한다."}]}, "aiexam": {"boksi": [{"n": "01", "g": 0, "t": "감독부터 바꿔야 한다고 생각한다. 사람 눈으로는 요즘 기기를 잡기 어려운 것 같다. 기계로 찾으면 더 잘 찾을 것 같다. 그래서 시험장마다 탐지 장비를 두면 좋겠다."}, {"n": "02", "g": 0, "t": "감독관이 바로 옆에 있었는데도 못 잡았다면 사람이 문제일까요? 저는 사람보다 장비가 먼저라고 봅니다. 탐지기를 두면 다 잡을 수 있을 것이다. 그러니까 감독을 바꾸는 게 먼저다."}, {"n": "03", "g": 0, "t": "가장 먼저 바꿔야 할 것은 사람의 눈에 기대는 감독 방식이다. 이번 국가자격시험 사건에서 감독관이 가까이 있었는데도 초소형 카메라를 찾지 못했다는 것은 육안 감독의 한계를 보여 준다. 처벌을 무겁게 하자는 의견도 있지만, 잡히지 않는다고 믿는 사람에게 처벌은 억제력이 약하다. 그래서 시험장마다 전파 탐지 장비를 두고, 감독 교사는 장비가 신호를 잡았을 때 확인하는 역할을 맡아야 한다. 장비가 먼저 걸러 주면 감독 교사가 수십 명의 안경을 하나하나 살필 필요도 줄어든다."}, {"n": "04", "g": 0, "t": "솔직히 감독관이 안경 하나하나 볼 수는 없잖아. 그러니까 기계로 해야 한다고 본다. 공항 검색대처럼 하면 될 것 같다. 감독이 제일 먼저다."}, {"n": "05", "g": 0, "t": "감독을 장비 중심으로 바꾸는 것이 먼저다. 기사에 따르면 탐지 기술에도 한계가 있지만, 사람 눈은 그보다 더 한계가 크다. 장비는 피곤해지지 않고 모든 수험생에게 같은 기준을 적용한다. 다만 장비가 잡지 못하는 기기도 있을 수 있으니 처벌 기준도 함께 알려야 한다. 그래도 순서로 따지면 먼저 막고, 그다음에 벌하는 것이 맞다."}, {"n": "06", "g": 0, "t": "감독을 먼저 바꿔야 할 것 같다. 기기가 점점 작아져서 사람이 찾기 힘들 것 같다. 장비가 있으면 그래도 낫지 않을까 싶다. 시험장마다 하나씩 있으면 좋겠다."}, {"n": "12", "g": 0, "t": "기기를 하나하나 찾는 게 가능할까요? 저는 전파를 막는 게 더 확실하다고 생각한다. 문제를 밖으로 못 보내면 AI도 소용없다. 그래서 전파 차단이 먼저다."}, {"n": "13", "g": 0, "t": "가장 먼저 해야 할 일은 시험 시간 동안 시험장의 전파를 막는 것이다. 이번 사건은 카메라로 찍은 문제를 밖으로 보내고 답을 받는 방식이었는데, 이 과정은 통신이 끊기면 성립하지 않는다. 기기를 찾는 방식은 기기가 작아질수록 계속 뒤처지지만, 통신을 막는 방식은 기기의 크기와 상관없다. 주변 주민의 불편이 생긴다는 반론이 있지만, 시험 시간 몇 시간에 한해 시험실 안으로 범위를 좁히면 피해를 줄일 수 있다. 그래서 감독은 기기 찾기에서 통신 차단으로 바뀌어야 한다."}, {"n": "14", "g": 0, "t": "그냥 전파를 막으면 되는 거 아닌가? 문제를 못 보내면 답도 못 받으니까. 정부도 검토한다고 했으니 할 수 있을 것 같다. 감독이 제일 먼저다."}, {"n": "07", "g": 1, "t": "가장 먼저 바꿔야 할 것은 검사 방식이다. 지금처럼 안경 쓴 수험생만 따로 보면, 정직한 학생이 이유 없이 의심받는다. 모든 수험생이 같은 방식으로 소지품과 안경을 확인받는다면 그건 의심이 아니라 절차가 된다. 물론 시간이 더 걸린다는 반론이 있지만, 입실 시간을 조금 앞당기면 해결할 수 있다. 그래서 감독은 강화하되, 모두에게 똑같이 해야 한다."}, {"n": "08", "g": 1, "t": "나도 안경 쓰는데, 나만 따로 불려 가서 검사받으면 진짜 기분 안 좋을 것 같다. 근데 모두가 똑같이 검사받는 거면 얘기가 다르다. 그건 공항에서 다 같이 검색대 지나가는 거랑 비슷하니까. 그래서 감독을 먼저 바꾸되, 기준은 '안경 쓴 사람'이 아니라 '모든 수험생'이어야 한다. 기사에서도 안경 쓴 수험생이 의심받는 부작용을 지적하는데, 이건 검사를 줄여서가 아니라 검사를 공평하게 해서 풀 문제다."}, {"n": "09", "g": 1, "t": "감독을 먼저 바꿔야 한다. 다만 안경 쓴 사람만 보는 건 불공평하다. 모든 수험생을 같은 방식으로 확인해야 한다. 그래야 검사받는 사람이 덜 억울하다. 처벌은 그다음이다."}, {"n": "10", "g": 1, "t": "조심스럽지만, 감독 방식을 먼저 바꾸는 게 맞다고 생각한다. 다만 안경 쓴 학생만 따로 검사하면 그 학생들은 시험 전부터 위축될 수 있다. 그래서 모두에게 같은 검사를 하는 쪽이 낫다고 본다. 물론 그만큼 감독 인력이 더 필요하다는 문제는 남는다."}, {"n": "11", "g": 1, "t": "왜 안경 쓴 사람만 의심해야 하나요? 카메라는 단추나 시계에도 숨길 수 있을 것 같다. 그러니 모두를 검사해야 한다. 감독이 먼저다."}, {"n": "15", "g": 2, "t": "처벌을 제일 먼저 바꿔야 한다고 본다. 걸리면 인생이 끝난다는 걸 알면 아무도 안 할 것 같다. 성적 무효 정도로는 약하다. 응시 자격을 아예 막아야 한다."}, {"n": "16", "g": 2, "t": "처벌이 먼저다. 지금 처벌은 너무 약하다. 무겁게 하면 시도하는 사람이 줄어든다. 그러니 처벌부터 바꿔야 한다."}, {"n": "17", "g": 2, "t": "처벌을 무겁게 하는 것부터 해야 한다고 생각한다. 감독을 아무리 강화해도 기기는 계속 작아져서 다 잡기는 어려울 것이다. 그렇다면 시도 자체를 망설이게 만드는 게 현실적이다. 물론 잡히지 않을 거라고 믿는 사람에게는 효과가 약할 수 있다. 그래도 대가가 크다는 사실 자체가 많은 사람을 멈추게 할 것이다."}, {"n": "18", "g": 2, "t": "걸려도 성적만 무효면 한번 해 볼 만하다고 생각하지 않을까요? 그래서 처벌이 먼저다. 다시는 시험을 못 보게 해야 한다. 그래야 아무도 안 한다."}, {"n": "19", "g": 2, "t": "가장 먼저 바꿔야 할 것은 처벌 수위다. 감독은 늘 기술보다 한발 늦을 수밖에 없다. 반면 처벌은 지금 당장 바꿀 수 있다. 응시 자격 제한 같은 무거운 처벌이 있다는 것을 시험 전에 분명히 알리면 시도 자체가 줄어든다. 감독 강화는 그다음 순서다."}, {"n": "20", "g": 2, "t": "처벌의 핵심은 무게보다 확실성이다. 이번 사건도 본인이 털어놓기 전까지 드러나지 않았다. 그렇다면 시험이 끝난 뒤에도 성적이 이상하게 오른 경우를 조사할 수 있어야 한다. 끝까지 추적한다는 믿음이 있어야 처벌도 의미가 있다. 그래서 사후 조사 체계부터 바꿔야 한다."}, {"n": "21", "g": 2, "t": "처벌을 바꾸되, 무게보다 '언젠가는 드러난다'는 확실성을 먼저 높여야 한다고 본다. 이번 국가자격시험 사건은 감독관도 놓쳤고, 결국 본인이 털어놓으면서 알려졌다. 처벌이 아무리 무거워도 드러나지 않으면 억제력이 없다는 뜻이다. 그래서 합격 뒤에도 의심 사례를 다시 조사할 수 있는 절차와, 조사 대상이 되었을 때의 소명 기회를 함께 만들어야 한다. 정직한 수험생이 억울하게 조사받는 일이 생길 수 있다는 반론이 있기 때문에, 조사의 기준을 미리 공개하는 것이 조건이다."}, {"n": "22", "g": 2, "t": "시험장에서 못 잡으면 끝일까요? 저는 시험이 끝난 뒤에도 끝까지 추적해야 한다고 본다. 실제로 이번 사건은 시험이 끝나고 나서 드러났다. 사후 조사를 제대로 하면 시험장에서 놓친 것도 잡을 수 있다. 그래서 처벌 체계를 먼저 바꿔야 한다."}, {"n": "23", "g": 3, "t": "문제를 밖으로 보내서 답을 받을 수 있다면, 문제가 잘못된 거 아닐까요? 외워서 푸는 문제라서 AI가 바로 답을 줄 수 있는 것 같다. 시험 방식을 바꿔야 한다. 그게 먼저다."}, {"n": "24", "g": 3, "t": "가장 먼저 바꿔야 할 것은 시험 방식이다. 문제를 찍어 AI에 보내면 바로 답이 나오는 시험이라면, 감독을 아무리 강화해도 기술과의 경쟁에서 계속 뒤처진다. 반대로 정답을 고르는 것보다 자기 풀이를 설명하는 비중을 늘리면, 밖에서 답을 받아도 쓸모가 줄어든다. 수십만 명이 보는 시험에서는 바로 바꾸기 어렵다는 반론이 맞다. 그래서 규모가 작은 자격시험부터 단계적으로 바꾸고, 그사이 큰 시험은 감독으로 버티는 순서가 필요하다."}, {"n": "25", "g": 3, "t": "솔직히 기기는 계속 좋아질 거라 감독으로는 못 따라간다. 그러면 애초에 AI가 대신 풀어도 소용없는 문제를 내야 하지 않나. 예를 들어 풀이 과정을 직접 쓰게 하는 식으로. 시간이 걸리겠지만 그게 근본적인 해결이라고 본다."}, {"n": "26", "g": 3, "t": "왜 시험은 늘 정답만 고르게 할까요? 자기 말로 설명하게 하면 AI가 대신하기 어렵다. 그래서 구술 같은 걸 늘려야 한다. 시험 방식이 먼저다."}, {"n": "27", "g": 3, "t": "가장 먼저 바꿔야 할 것은 평가 방식이다. 자기 말로 설명하는 시험이라면 기기로 답을 받아도 설명은 직접 해야 한다. 그래서 일부 시험에는 구술이나 과정 평가를 넣어야 한다. 물론 채점에 시간과 사람이 많이 든다. 그래도 감독을 계속 강화하는 비용보다는 장기적으로 낫다."}, {"n": "28", "g": 4, "t": "감독 교사 한 명이 첨단 기기를 다 잡으라는 건 무리다. 이번에도 감독관이 가까이 있었는데 못 잡았다. 그렇다면 책임을 현장 교사에게 지울 게 아니라 국가가 장비와 인력을 마련해야 한다. 먼저 바꿔야 할 것은 감독의 책임 구조다."}, {"n": "29", "g": 4, "t": "감독 교사 탓을 하면 안 될 것 같다. 선생님 한 명이 그걸 다 볼 수는 없을 것 같다. 나라가 장비를 사 줘야 한다. 그게 먼저인 것 같다."}, {"n": "30", "g": 4, "t": "감독 교사가 못 잡으면 그게 교사 잘못일까요? 기기가 너무 작아져서 누구라도 못 잡을 것 같다. 그러니까 국가가 책임져야 한다. 장비랑 사람을 더 줘야 한다."}, {"n": "31", "g": 4, "t": "먼저 바꿔야 할 것은 감독 교사에게 모든 책임을 지우는 구조다. 교사는 시험을 관리하는 사람이지 첨단 기기를 찾아내는 전문가가 아니다. 장비와 전담 인력을 국가가 마련해야 감독이 실제로 작동한다. 지금처럼 개인의 주의력에 맡기면 다음 사건에서도 같은 일이 반복된다."}, {"n": "32", "g": 4, "t": "솔직히 수능 감독하는 선생님들 너무 힘들 것 같다. 몇 시간 동안 서서 수십 명 안경을 다 보라는 건 말이 안 된다. 이건 선생님 개인이 아니라 나라가 장비랑 인력으로 해결할 일이다. 감독을 바꾸되, 책임은 국가가 져야 한다."}, {"n": "33", "g": 5, "t": "솔직히 시험 보러 갔는데 안경 때문에 의심받으면 너무 위축될 것 같다. 부정행위는 막아야 하지만, 정직한 수험생이 범죄자 취급받으면 안 된다. 그래서 제일 먼저 바꿔야 할 건 '어디까지 검사해도 되는지' 기준이다. 그 기준 안에서만 감독을 강화해야 한다."}, {"n": "34", "g": 5, "t": "먼저 정해야 할 것은 검사의 한계선이다. 부정행위를 막는 것도 중요하지만 수험생의 사생활도 중요하다. 기준 없이 검사를 늘리면 정직한 수험생만 불편해진다. 그래서 무엇을 어디까지 검사하는지 미리 공개해야 한다. 그다음에 감독이든 처벌이든 바꿀 수 있다."}, {"n": "35", "g": 5, "t": "조심스럽지만, 가장 먼저 바꿔야 할 것은 검사가 넘지 말아야 할 선을 정하는 일이라고 생각한다. 기사에서도 안경 쓴 수험생이 의심받는 부작용이 지적되는데, 이런 일은 감독이 강해질수록 더 늘어날 수 있다. 물론 기준을 정하는 동안 부정행위가 생길 수 있다는 반론이 있다. 그래서 수험생 몸을 직접 확인하는 검사는 신호가 잡힌 경우로 한정하고, 그 외에는 소지품 보관과 장비 점검처럼 모두에게 같은 절차만 두자는 것이다. 이렇게 하면 막는 효과는 지키면서 정직한 수험생의 존엄도 지킬 수 있다."}, {"n": "36", "g": 5, "t": "부정행위를 막으려다 정직한 사람이 더 피해를 보면 그게 공정한 시험일까요? 저는 수험생의 사생활을 지키는 선에서만 검사해야 한다고 본다. 몸을 뒤지는 식의 검사는 지나치다. 그래서 먼저 검사 기준부터 정해야 한다."}]}, "robotaxi": {"boksi": [{"n": "01", "g": 0, "t": "제조사가 먼저 책임져야 할 것 같다. 기업이 책임을 져야 안전하게 만들 것 같다. 승객은 아무것도 못 하니까 책임이 없다. 그래서 회사가 책임져야 한다."}, {"n": "02", "g": 0, "t": "기업이 책임을 안 지면 안전에 신경을 쓸까요? 안 쓸 것 같다. 그러니 제조사가 먼저 책임져야 한다. 그래야 더 안전한 차를 만든다."}, {"n": "03", "g": 0, "t": "제조사와 운영사가 먼저 책임져야 한다. 책임이 있어야 안전에 돈을 쓴다. 책임이 흐릿하면 기업은 비용이 덜 드는 쪽을 고른다. 기술 발전이 늦어진다는 우려가 있지만, 안전하지 않은 기술은 발전이라고 부를 수 없다. 그래서 기업 책임이 먼저다."}, {"n": "04", "g": 0, "t": "솔직히 회사가 책임 안 지면 대충 만들 것 같다. 책임을 져야 테스트도 더 하고 센서도 좋은 걸 쓰지. 그러니까 제조사랑 운영사가 먼저 책임지는 게 맞다. 그래야 결국 사고도 줄어든다."}, {"n": "05", "g": 0, "t": "제조사가 책임져야 한다. 그래야 안전하게 만든다. 승객은 잘못이 없다. 기업 책임이 먼저다."}, {"n": "06", "g": 0, "t": "제조사가 책임지는 게 맞을 것 같다. 책임이 있어야 더 조심해서 만들 것 같다. 기술이 늦어질 수도 있지만 안전이 더 중요한 것 같다."}, {"n": "07", "g": 1, "t": "책임은 차를 통제하는 쪽이 먼저 져야 한다. 운전자 없는 차에서 운전을 결정하는 것은 시스템이고, 그 시스템을 만들고 운영하는 것은 제조사와 운영사다. 승객은 목적지를 정할 뿐 주행에 개입할 수 없다. 기업 책임이 무거우면 기술 발전이 늦어진다는 반론이 있지만, 통제권이 없는 사람에게 책임을 나누면 그 원칙이 무너진다. 그래서 원칙은 통제권에 따르고, 기술 발전의 부담은 보험료 산정 같은 다른 방법으로 덜어 줘야 한다."}, {"n": "08", "g": 1, "t": "조심스럽지만, 차를 움직이는 쪽이 책임지는 게 원칙이라고 생각한다. 운전자 없는 차에서 승객은 아무것도 조작할 수 없다. 그렇다면 책임은 시스템을 만든 쪽과 운영하는 쪽에 있어야 한다. 다만 원인이 도로 문제라면 그건 따로 봐야 할 것 같다."}, {"n": "09", "g": 1, "t": "운전대도 없는 차에서 승객이 뭘 할 수 있을까요? 아무것도 못 한다. 통제할 수 있는 사람이 책임지는 게 원칙이다. 그러니 제조사와 운영사가 먼저다. 승객에게 책임을 묻는 건 원칙에 맞지 않는다."}, {"n": "10", "g": 1, "t": "통제하는 쪽이 책임진다. 이건 지금 자동차 사고에서도 같은 원칙이다. 운전자가 없으면 운전하는 건 시스템이다. 시스템을 만든 제조사와 굴리는 운영사가 먼저 책임져야 한다."}, {"n": "11", "g": 1, "t": "솔직히 내가 운전 안 했는데 왜 내 책임이야. 차를 움직인 건 회사 프로그램이잖아. 그러니까 회사가 책임져야지. 운전한 쪽이 책임지는 거랑 똑같은 거다."}, {"n": "12", "g": 1, "t": "제조사가 먼저 책임져야 한다. 결함 있는 제품을 팔면 판 쪽이 책임지는 것이 다른 모든 제품의 원칙이다. 자율주행차도 제품이다. 소프트웨어 결함이면 개발사, 운영 관리 잘못이면 운영사가 책임지면 된다. 정부도 결함 사고의 책임 기준을 법으로 정하려 하고 있다."}, {"n": "13", "g": 1, "t": "솔직히 이건 냉장고 불나면 제조사가 책임지는 거랑 똑같다고 본다. 시스템 결함으로 난 사고면 그 시스템을 만든 쪽이 책임지는 게 제품의 기본 원칙이니까. 물론 원인이 센서인지 소프트웨어인지 도로인지 가리기 어렵다는 반론이 있다. 그래서 원인을 가리는 동안은 운영사가 먼저 피해자에게 보상하고, 나중에 원인을 만든 쪽에 비용을 청구하는 구조가 필요하다. 그래야 원칙도 지키고 피해자도 기다리지 않는다."}, {"n": "14", "g": 1, "t": "결함 제품은 만든 회사가 책임진다. 차도 똑같다. 제조사가 책임져야 한다."}, {"n": "15", "g": 2, "t": "누가 잘못했는지 가리는 데 얼마나 걸릴까요? 그동안 피해자는 기다려야 한다. 그래서 보험으로 먼저 보상해야 한다고 본다. 책임은 그다음에 따지면 된다. 피해자 보상이 먼저다."}, {"n": "16", "g": 2, "t": "보상은 보험이 먼저 하고, 책임은 나중에 가려야 한다. 기사에 따르면 시스템 결함 사고의 책임을 여러 주체가 나누는 기준이 논의되고 있는데, 나누는 주체가 많을수록 원인을 가리는 데 시간이 걸린다. 그 시간 동안 피해자를 기다리게 하면 안 된다. 보험사가 먼저 보상하면 기업이 책임을 피한다는 반론이 있지만, 보험사가 나중에 원인을 만든 쪽에 비용을 청구하면 기업 책임은 그대로 남는다. 그래서 먼저 보험, 나중에 구상이 맞다."}, {"n": "17", "g": 2, "t": "보험으로 먼저 보상해 주는 게 맞는 것 같아. 누가 잘못했는지는 나중에 따져도 되잖아. 다친 사람은 바로 돈이 필요할 것 같다."}, {"n": "18", "g": 2, "t": "보험이 먼저다. 책임을 가리는 데는 시간이 걸린다. 피해자는 그동안 기다릴 수 없다. 보험으로 먼저 보상하고 책임은 나중에 정하면 된다."}, {"n": "19", "g": 2, "t": "보험으로 먼저 보상하는 게 좋을 것 같다. 누가 잘못했는지 따지는 건 오래 걸릴 것 같다. 피해자는 빨리 보상받아야 할 것 같다."}, {"n": "20", "g": 2, "t": "책임자를 다 가릴 때까지 피해자가 기다려야 할까요? 저는 아니라고 본다. 보험이 먼저 보상하고, 나중에 원인이 밝혀지면 그쪽이 보험사에 돈을 내면 된다. 그래야 피해자도 보호받고 기업 책임도 남는다."}, {"n": "25", "g": 2, "t": "조심스럽지만, 제조사와 운영사가 함께 기금을 만드는 방법이 있다고 생각한다. 사고 원인을 한 곳으로 정하기 어려운 경우가 많을 것이다. 그럴 때 기금에서 먼저 보상하면 피해자가 기다리지 않아도 된다. 기업도 함께 내니 안전에 신경 쓸 이유가 남는다."}, {"n": "26", "g": 2, "t": "누가 잘못했는지 꼭 한 명을 찾아야 할까요? 제조사와 운영사가 같이 돈을 모아 두면 된다. 사고가 나면 거기서 먼저 보상하면 된다. 각자 낸 만큼 책임도 나누는 셈이다."}, {"n": "35", "g": 2, "t": "조심스럽지만, 약관에 동의하고 탄 승객도 아주 일부는 책임이 있다고 생각한다. 로보택시를 타겠다는 것은 그 위험을 어느 정도 받아들인다는 뜻이기 때문이다. 물론 승객은 차를 조작할 수 없으니 책임을 크게 지울 수는 없다는 반론이 맞다. 그래서 승객의 몫은 보상을 깎는 게 아니라, 탑승 때 보험료 일부를 함께 내는 정도로 한정해야 한다. 그러면 승객도 위험을 알고 타고, 피해자 보상도 줄지 않는다."}, {"n": "36", "g": 2, "t": "약관에 동의하고 탔으면 승객도 책임이 아예 없다고 할 수 있을까요? 위험을 알고 탄 것이니 일부는 있다고 본다. 다만 운전을 안 했으니 크게는 아니다. 탈 때 보험료를 조금 내는 정도면 된다."}, {"n": "21", "g": 3, "t": "보행자가 먼저다. 로보택시 탄 사람은 자기가 선택한 거다. 보행자는 아무것도 안 했다. 그러니까 보행자부터 보상해야 한다."}, {"n": "22", "g": 3, "t": "솔직히 이 논의에서 제일 빠져 있는 게 보행자라고 본다. 승객은 로보택시를 타겠다고 선택했지만, 길을 건너던 사람은 아무것도 고르지 않았다. 그런데 책임 분담 이야기는 대부분 제조사, 운영사, 승객 사이에서만 오간다. 보행자는 서로 책임을 미루는 사이에 끼면 가장 오래 기다리게 된다. 그래서 보행자 같은 비이용자 피해는 누구 잘못인지와 상관없이 먼저 보상하는 규칙이 있어야 한다."}, {"n": "23", "g": 3, "t": "보행자 보상이 먼저다. 보행자는 선택하지 않았다. 피해만 입었다. 먼저 보호해야 한다."}, {"n": "24", "g": 3, "t": "조심스럽지만, 보행자를 먼저 생각해야 한다고 본다. 로보택시를 이용하지 않은 사람도 사고를 당할 수 있다. 그런 사람은 누구에게 보상을 청구해야 할지도 모를 것 같다. 그래서 보행자 피해는 먼저 보상받게 해야 한다."}, {"n": "27", "g": 4, "t": "솔직히 처음부터 책임을 너무 무겁게 하면 아무 회사도 서비스를 못 내놓을 거라고 본다. 기사에도 기업 책임이 무거우면 기술 발전이 늦어진다는 우려가 나온다. 물론 그래서 안전을 소홀히 해도 된다는 건 아니다. 그래서 초기에는 정부가 보험 일부를 같이 지고, 운행 기록이 쌓일수록 기업 몫을 늘리는 방식이 필요하다. 책임을 없애는 게 아니라 단계적으로 키우자는 거다."}, {"n": "28", "g": 4, "t": "처음부터 책임을 무겁게 하면 기술이 멈춘다. 아무도 서비스를 안 할 것이다. 처음에는 부담을 줄여 줘야 한다."}, {"n": "29", "g": 4, "t": "처음부터 기업 책임을 너무 크게 하면 회사들이 안 할 것 같다. 그러면 기술도 늦어질 것 같다. 처음에는 좀 봐줘야 하지 않을까 싶다."}, {"n": "30", "g": 4, "t": "책임이 너무 무거우면 누가 로보택시를 만들까요? 아무도 안 만들 것 같다. 그러면 기술 발전이 멈춘다. 그래서 처음에는 책임을 가볍게 해야 한다."}, {"n": "31", "g": 4, "t": "초기에는 기업 책임을 가볍게 해야 한다. 기술은 실제로 달려 봐야 좋아진다. 책임이 너무 무거우면 기업은 달리지 않는 쪽을 고른다. 그러면 기술도 안전도 제자리다. 대신 운행이 늘수록 책임을 단계적으로 키우면 된다."}, {"n": "32", "g": 5, "t": "누가 책임질지 정하려면 사고 직전에 무슨 일이 있었는지부터 알아야 할 것 같다. 기록이 없으면 다들 자기 잘못이 아니라고 할 것 같다. 그래서 주행 기록을 먼저 공개해야 할 것 같다."}, {"n": "33", "g": 5, "t": "사고 직전 기록을 아무도 못 본다면 책임을 어떻게 정할까요? 기록부터 공개해야 한다. 그래야 누가 잘못했는지 알 수 있다."}, {"n": "34", "g": 5, "t": "책임을 누구에게 둘지보다 먼저 정해야 할 것은 기록의 공개다. 시스템 결함인지, 도로 문제인지, 다른 차의 잘못인지는 사고 직전의 주행 기록을 보지 않으면 가릴 수 없다. 그런데 그 기록은 지금 기업이 가지고 있다. 기업 기밀이라는 반론이 있지만, 사고 당사자에게 사고 전후 기록만 공개하는 것은 기밀과 충돌하지 않는다. 기록이 공개되면 책임 분담 기준도 실제 원인에 따라 작동할 수 있다."}]}};


/* =========================================================
   (v4) 계정과 저장소
   목업 단계: 모두 브라우저 메모리에만 저장합니다 (새로고침하면 처음으로).
   ★ Supabase로 바꿀 곳은 아래 DB 객체 하나입니다. 함수 이름과 반환 형식만 지키면 화면 코드는 그대로 둡니다.
     - 계정: Supabase Auth, 아이디를 가짜 이메일로 ({id}@p.chaekmun.app 개인, {id}@o.chaekmun.app 기관), 이메일 인증 끔
     - 테이블: profiles, orgs, classes, essays, votes(user_id, essay_id, kind unique)
   ========================================================= */
const ORGS=[{id:'yonsei',name:'연세대학교 (예시)'}];
const CLASSES={
  'yonsei-writing':{id:'yonsei-writing',org:'yonsei',name:'글쓰기와 토론 (예시)',term:'2026-2학기, 11주차',
    studentCode:'YONSEI-STU',professorCode:'YONSEI-PROF',rubric:null,focus:null,
    assigned:{articleId:'aiexam',level:'boksi',due:'11월 23일(일)'}}
};
const DEMO_PW='demo1234';
const DB={
  users:{}, essays:[], votes:new Map(), seq:1,
  key:(scope,u)=>`${scope}:${u.toLowerCase()}`,
  async signUp({scope,username,password,nickname,role='personal',classId=null}){
    if(!/^[A-Za-z0-9]{4,20}$/.test(username||''))throw new Error('아이디는 영문과 숫자 4~20자로 정해 주세요.');
    if((password||'').length<6)throw new Error('비밀번호는 6자 이상으로 정해 주세요.');
    nickname=(nickname||'').trim();
    if(!nickname)throw new Error('닉네임을 적어 주세요. 광장에 이 이름으로 보입니다.');
    if(nickname.length>12)throw new Error('닉네임은 12자 이내로 적어 주세요.');
    const k=this.key(scope,username);
    if(this.users[k])throw new Error('이미 쓰이는 아이디입니다.');
    const u={id:'u'+(this.seq++),scope,username,password,nickname,role,classId,org:classId?CLASSES[classId].org:null,profile:null};
    this.users[k]=u;return this.pub(u);
  },
  async signIn({scope,username,password}){
    const u=this.users[this.key(scope,username||'')];
    if(!u||u.password!==password)throw new Error('아이디나 비밀번호가 맞지 않습니다.');
    return this.pub(u);
  },
  pub:u=>({id:u.id,scope:u.scope,username:u.username,nickname:u.nickname,role:u.role,classId:u.classId,org:u.org,profile:u.profile,...(u.history?{history:u.history}:{})}),
  async classByCode(orgId,code){
    code=(code||'').trim().toUpperCase();
    for(const c of Object.values(CLASSES)){
      if(c.org!==orgId)continue;
      if(c.studentCode===code)return {cls:c,role:'student'};
      if(c.professorCode===code)return {cls:c,role:'professor'};
    }
    throw new Error('코드가 맞지 않습니다. 수업에서 받은 코드를 확인해 주세요.');
  },
  async saveEssay(e){const x={...e,id:'e'+(this.seq++),createdAt:Date.now()};this.essays.push(x);return x},
  /* 광장 글: 같은 기사, 같은 난이도. 기관 학생은 우리 반 글만, 개인은 기관 밖 글만 */
  async listEssays({articleId,level,classId=null}){
    return this.essays.filter(e=>e.published&&e.articleId===articleId&&e.level===level&&(e.classId||null)===(classId||null));
  },
  async classEssays(classId){return this.essays.filter(e=>e.classId===classId&&!e.isExample)},
  /* 투표: 같은 사람, 같은 글, 같은 종류는 한 번. 다시 누르면 취소 */
  async toggleVote(userId,essayId,kind){
    const k=`${userId}|${essayId}|${kind}`;
    if(this.votes.has(k)){this.votes.delete(k);return false}
    this.votes.set(k,1);return true;
  },
  voted(userId,essayId,kind){return this.votes.has(`${userId}|${essayId}|${kind}`)},
  count(essay,kind){let n=essay.base?.[kind]||0;this.votes.forEach((_,k)=>{const[,e,t]=k.split('|');if(e===essay.id&&t===kind)n++});return n},
  async saveRubric(classId,rubric){CLASSES[classId].rubric=rubric},
  async saveFocus(classId,axis){CLASSES[classId].focus=axis||null},
  async assign(classId,articleId,level){CLASSES[classId].assigned={articleId,level,due:'이번 주 일요일'}}
};
/* 시연 계정 3개 + 예시 답안 계정 */
(function seed(){
  const mk=(scope,username,nickname,role,classId,profile)=>{DB.users[DB.key(scope,username)]={id:'u'+(DB.seq++),scope,username,password:DEMO_PW,nickname,role,classId,org:classId?'yonsei':null,profile}};
  mk('p','demo','데모 응시자','personal',null,'demo');
  mk('o','student','김연세','student','yonsei-writing',null);
  /* (v4.3) 기관 학생 데모의 예시 기록: 어제부터 사흘 연속 + 띄엄띄엄 이틀, 급제 길 세 칸 */
  DB.users[DB.key('o','student')].history={days:[1,2,3,6,9],cleared:['iss1','evi1','pos1']};
  mk('o','professor','박교수','professor','yonsei-writing',null);
  /* 광장 예시 답안: "예시 답안" 시스템 계정으로 묶고 예시 배지 */
  ARTICLES.forEach(a=>{
    const repN=new Set(a.clusters.map(c=>(c.s.who.match(/\d+/)||[''])[0]));
    const list=SEEDS[a.id]?.boksi || a.clusters.map((c,g)=>({n:(c.s.who.match(/\d+/)||['00'])[0],g,t:c.s.text}));
    list.forEach(s=>{
      const c=a.clusters[s.g];
      const rep=repN.has(s.n)&&c&&c.s.text===s.t;
      const base=rep?{ag:c.s.agree,pn:c.s.pen}:{ag:0,pn:0};
      DB.essays.push({id:`ex-${a.id}-boksi-${s.n}`,userId:'example',nickname:`예시 응시자 ${s.n}`,articleId:a.id,level:'boksi',revised:s.t,draft:s.t,group:s.g,published:true,isExample:true,classId:null,base,rep});
    });
    /* 기관 시연용: 같은 예시 답안 일부(홀수 번호)를 "예시 반 학생"으로 우리 반 광장에 */
    list.filter((s,i)=>i%2===0).forEach(s=>{
      const c=a.clusters[s.g];const rep=repN.has(s.n)&&c&&c.s.text===s.t;
      DB.essays.push({id:`exc-${a.id}-boksi-${s.n}`,userId:'example',nickname:`예시 반 학생 ${s.n}`,articleId:a.id,level:'boksi',revised:s.t,draft:s.t,group:s.g,published:true,isExample:true,classId:'yonsei-writing',base:rep?{ag:Math.ceil(c.s.agree/2),pn:Math.ceil(c.s.pen/2)}:{ag:0,pn:0},rep});
    });
    (SEEDS[a.id]?.choshi||[]).forEach(s=>DB.essays.push({id:`ex-${a.id}-choshi-${s.n}`,userId:'example',nickname:`예시 응시자 ${s.n}`,articleId:a.id,level:'choshi',revised:s.t,draft:s.t,group:s.g,published:true,isExample:true,classId:null,base:{ag:0,pn:0}}));
  });
})();

/* =========================================================
   AI 모듈
   - 서버(/api/status)가 응답하고 LLM 키가 있으면 서버 함수를 부르고, 아니면 아래 규칙 기반 목업으로 동작합니다.
   - 서버 호출이 실패하면 목업으로 대신하고 화면에 작게 "예비 응답"을 표시합니다 (숨기지 않음).
   - 각 함수 위 주석의 입력과 출력 형식만 지키면 화면 코드는 고칠 필요가 없습니다.
   ========================================================= */
const API={on:false,checked:false,
  async init(){if(location.protocol==='file:'){this.checked=true;return}try{const r=await fetch('/api/status',{cache:'no-store'});if(r.ok){const j=await r.json();this.on=!!j.llm}}catch(e){}this.checked=true},
  async post(path,body){
    const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('서버 오류 '+r.status));return j;
  }
};
const withMeta=(o,fallback)=>({...o,_meta:{...(o._meta||{}),fallback}});
const AI = {
  /* [API 0] (v4.2) 오늘의 과제: AI 없이 규칙. 개인은 최근 3편 평균이 가장 낮은 기준, 기관 학생은 반 초점 기준
     입력: {profile, classFocus}  출력: {axis, tier, why, id, title, how, choshi, ex} 또는 null */
  async todayTask({profile,classFocus}){return getTodayTask({profile,classFocus})},

  /* [API 1] 쓰기 전 생각할 거리: 답 대신 질문 3개
     입력: {article, level}  출력: {questions:[string,string,string]} */
  async prewrite({article,level}){
    if(API.on)try{return await API.post('prewrite',{articleId:article.id,level})}catch(e){console.warn(e)}
    await sleep(500);
    return withMeta({questions:[
      '이 기사에서 가장 큰 영향을 받는 사람은 누구라고 생각합니까?',
      '이 문제를 판단할 때 무엇을 가장 앞에 둡니까? 효율, 공정, 안전 중 하나를 고른다면요.',
      article.choshiQ
    ]},API.on?'rule':false);
  },

  /* [API 2] 논증 분석 + 페르소나 반론 (서버 모드에서는 [API 3] 검수까지 서버가 끝내고 돌려줌)
     입력: {article, level, text, personaIndex}
     출력: {flag?, stance, structure:{claim, reasons[], premise, premiseFrom?, claimIndex?}, weaknesses:[{type,detail,question}],
            rebuttal:{persona,text,question,source:{line,text}|null}, _meta?:{log, fallback}}
     ※ claim, reasons는 사용자 글의 문장을 그대로 돌려줘야 화면에서 밑줄을 칠 수 있습니다
     ※ premiseFrom, claimIndex는 1부터 센 문장 번호 (유민 feedback 지시문 형식). 있으면 "근거 [n] → 주장 [m] 사이"로 표시 */
  async analyzeAndRebut({article,level,text,personaIndex}){
    if(API.on)try{return await API.post('analyze',{articleId:article.id,level,text,personaIndex})}catch(e){console.warn(e);const r=this._mockAnalyze({article,level,text,personaIndex});r._meta={fallback:'rule',log:[{state:'bad',text:'서버 호출이 실패해 예비 응답을 보여 줍니다'}]};return r}
    await sleep(800);
    return this._mockAnalyze({article,level,text,personaIndex});
  },
  _mockAnalyze({article,level,text,personaIndex}){
    const sents=sentences(text), lv=LEVELS[level];
    const stance = level==='choshi' ? null : detectStance(article,text);
    const claim = (stance && sents.find(s=>has(s,stance.kw))) || sents[0] || '';
    const reasons = sents.filter(s=>s!==claim && (has(s,EVID) || /\d/.test(s))).slice(0,2);
    const rest = sents.filter(s=>s!==claim && !reasons.includes(s));
    while(reasons.length<2 && rest.length) reasons.push(rest.shift());
    const premise = stance ? stance.premise : article.choshiPremise;
    const w=[];
    if(!sents.some(s=>has(s,EVID)||/\d/.test(s)))
      w.push({type:'근거 부족',detail:'주장을 받치는 사례나 자료가 보이지 않습니다. 지금은 주장과 느낌이 같은 무게로 놓여 있습니다.',question:'이 주장이 맞다는 걸 보여줄 사례를 하나 든다면 무엇입니까?'});
    w.push({type:'숨은 전제',detail:`이 글은 "${premise}"는 생각 위에 서 있지만, 글에는 드러나 있지 않습니다.`,question: stance?stance.premiseQ:article.choshiQ});
    const hedged=sents.find(s=>has(s,HEDGE));
    if(hedged) w.push({type:'추측으로 끝난 근거',detail:`"${hedged}" 문장이 추측으로 끝나서 근거로 쓰기 어렵습니다.`,question:'이 부분을 확신하려면 어떤 사실이 필요합니까?'});
    if(!has(text,CONCEDE)) w.push({type:'반례를 다루지 않음',detail:'반대쪽에서 나올 만한 반례를 다루지 않았습니다.',question:'당신의 주장이 틀리는 경우가 있다면 언제입니까?'});
    if(has(text,OVERGEN)) w.push({type:'성급한 일반화',detail:'"모든", "항상" 같은 표현이 주장을 필요 이상으로 넓힙니다.',question:'예외가 하나라도 있다면 주장은 어떻게 달라집니까?'});
    const bank = stance ? stance.bank : article.choshiBank;
    const r = bank[personaIndex % bank.length];
    const ci=sents.indexOf(claim)+1, pf=reasons.length?sents.indexOf(reasons[0])+1:null;
    return {
      flag: sents.some(s=>BYPASS.test(s))?'request_inside':null,
      stance:stance?stance.id:null,
      structure:{claim,reasons,premise,claimIndex:ci||null,premiseFrom:pf},
      weaknesses:w.slice(0,lv.weak),
      rebuttal:{persona:r.p,text:r.t,question:r.q,source:r.src!=null?{line:r.src+1,text:article.summary[r.src]}:null}
    };
  },

  /* [API 3] 출력 검수 (목업 모드에서만 화면이 직접 부름. 서버 모드에서는 analyze 안에서 끝남)
     입력: {feedback, text}  출력: {pass, violations:[{type, evidence}]}
     원칙: 사용자 문장을 그대로 인용하는 것은 허용, 비슷하게 고쳐 쓴 문장은 대필로 봄 */
  async verifyFeedback({feedback,text}){
    await sleep(400);
    const v=[], userSents=sentences(text);
    const pieces=[...feedback.weaknesses.map(w=>w.detail+' '+w.question),feedback.rebuttal.text,feedback.rebuttal.question];
    const MID=['양쪽 다 일리','양쪽 모두 일리','중간 지점','절충안을 찾'];
    const WRITE=['모범 문장','이렇게 고쳐','다음과 같이 쓰'];
    pieces.forEach(p=>{
      MID.forEach(k=>{if(p.includes(k))v.push({type:'결론을 중간으로 모는 표현',evidence:k})});
      WRITE.forEach(k=>{if(p.includes(k))v.push({type:'대신 써 주는 표현',evidence:k})});
      (p.match(/"([^"]{12,})"/g)||[]).map(q=>q.slice(1,-1)).forEach(q=>{
        if(text.includes(q)) return;
        if(userSents.some(s=>jaccard(s,q)>=.5)) v.push({type:'사용자 문장을 고쳐 쓴 흔적',evidence:q});
      });
    });
    return {pass:v.length===0,violations:v};
  },

  /* [API 4] (v4) 5기준 채점: AAC&U Critical Thinking VALUE Rubric 5기준, 기준당 1~10점(총 50점)
     처음 글과 고친 글을 서로 모르게 따로 채점. 원 루브릭 4단계 → 1단계 1~2, 2단계 3~5, 3단계 6~8, 4단계 9~10
     입력: {articleId, level, draft, revised, rubric?:{기준:{def,weight}}}
     출력: {before:{기준:점수}, after:{기준:점수}, why:{기준:{before:[string], after:[string]}}, total?:{before,after,max}}
     ※ why는 "사용자 글의 어느 부분 때문에 이 점수인지"를 1~2줄 + 사용자 글 인용. 글을 고쳐 주는 문장은 넣지 않음 */
  async scoreRevision({draft,revised,rebuttal,level,rubric,task}){
    if(API.on)try{return await API.post('score',{articleId:S.articleId,level,draft,revised,rubric,task})}catch(e){console.warn(e);return withMeta(this._mockScore({draft,revised,rebuttal,level}),'rule')}
    await sleep(700);
    return this._mockScore({draft,revised,rebuttal,level});
  },
  /* 목업 채점: 규칙으로 1~5를 매긴 뒤 10점으로 늘림 (실제 서비스는 서버의 LLM 채점) */
  _mockScore({draft,revised,rebuttal,level}){
    const grade=t=>{
      const s=sentences(t), first=s[0]||'', W={};
      const stanceHit=ARTICLES.some(a=>a.stances.some(st=>has(first,st.kw)));
      const ev=s.filter(x=>has(x,EVID)||/\d/.test(x)).length, art=has(t,['기사','따르면']);
      const hedges=s.filter(x=>has(x,HEDGE)).length;
      const R={}, five=v=>Math.max(1,Math.min(5,v)), ten=v=>clamp(five(v)*2-(five(v)<5&&s.length<LEVELS[level].target?1:0));
      W['쟁점 설명']=[stanceHit?'첫 문장에서 질문이 묻는 선택지를 직접 다룹니다.':'첫 문장만으로는 질문의 어느 선택지를 다루는지 드러나지 않습니다.',
                    s.length>=LEVELS[level].target?`요구한 ${LEVELS[level].target}문장 분량을 채웠습니다.`:`요구한 ${LEVELS[level].target}문장보다 짧아 쟁점을 다 펼치지 못했습니다.`];
      R['쟁점 설명']=ten(2+(stanceHit?1:0)+(s.length>=LEVELS[level].target?1:0)+(art?1:0));
      W['근거 활용']=[ev?`근거로 볼 수 있는 문장이 ${ev}개 있습니다.`:'주장을 받치는 사실이나 사례가 보이지 않습니다.',
                    art?'기사 내용을 근거로 끌어왔습니다.':'기사 속 사실을 근거로 쓰지 않았습니다.'];
      R['근거 활용']=ten(1+Math.min(3,ev)+(art?1:0));
      const cond=has(t,COND), conc=has(t,CONCEDE), hit=rebuttal&&shareKey(t,rebuttal.text);
      W['맥락과 전제']=[conc?'반대쪽에서 나올 지적을 글 안에서 다룹니다.':'내 주장이 틀릴 수 있는 경우를 다루지 않았습니다.',
                    cond?'주장이 통하는 조건을 스스로 정했습니다.':'주장이 어떤 조건에서만 맞는지 정하지 않았습니다.',
                    ...(hit?['받은 반론이 겨냥한 전제를 글에서 직접 다룹니다.']:[])];
      R['맥락과 전제']=ten(1+(conc?1:0)+(cond?2:0)+(hit?1:0));
      W['자기 입장']=[has(first,HEDGE)?'첫 문장이 추측으로 끝나 입장이 흐립니다.':'첫 문장에서 입장을 단정적으로 밝힙니다.',
                    conc?'반대 입장을 인정한 뒤 자기 기준을 다시 세웁니다.':'반대 입장을 언급하지 않아 입장의 근거가 한쪽만 보입니다.'];
      R['자기 입장']=ten(2+(has(first,HEDGE)?-1:1)+(conc?1:0)+(hedges?0:1));
      const con=has(t,CONNECT), out=has(t,OUTCOME);
      W['결론과 함의']=[con?'"따라서", "그래서"로 근거와 결론을 이었습니다.':'근거에서 결론으로 넘어가는 연결이 없습니다.',
                     out?'결론이 낳을 결과까지 적었습니다.':'결론을 따랐을 때 어떤 결과가 생기는지는 적지 않았습니다.',
                     ...(hedges?[`추측으로 끝난 문장 ${hedges}개가 결론의 힘을 약하게 합니다.`]:[])];
      R['결론과 함의']=ten(2+(con?1:0)+(out?1:0)+(s.length>=LEVELS[level].target?1:0)-hedges);
      return {R,W};
    };
    const b=grade(draft),a=grade(revised);
    return {before:b.R,after:a.R,why:Object.fromEntries(Object.keys(RUBRIC).map(k=>[k,{before:b.W[k],after:a.W[k]}]))};
  },

  /* [API 5] 시관에게 묻기: 대화창만. 재반박도 여기서 받음
     입력: {question, feedback}  출력: {refused:boolean, kind:'refuse'|'rebuttal'|'answer', reply}
     원칙: 대필 요청은 거절(입력 가드레일). 재반박에는 "누가 맞다"고 판정하지 않고, 그 반박이 성립하려면 무엇이 참이어야 하는지만 짚음 */
  async ask({question,feedback}){
    if(API.on)try{return await API.post('ask',{articleId:S.articleId,level:S.level,draft:S.draft,question,feedback,chat:S.chat})}catch(e){console.warn(e)}
    await sleep(450);
    if(BYPASS.test(question)||/대신|모범|정답/.test(question))
      return {refused:true,kind:'refuse',reply:'글은 대신 써 드리지 않습니다. 대신 하나만 묻겠습니다. '+(feedback?.weaknesses[0]?.question||'당신의 주장을 가장 강하게 받치는 근거는 무엇입니까?')};
    if(/틀렸|아니라고|동의하지|동의 못|반박|과장|그렇지 않|다르다고|말이 안/.test(question))
      return {refused:false,kind:'rebuttal',reply:'좋은 반박입니다. 다만 그 반박이 성립하려면 하나가 더 필요합니다. 반론이 짚은 상황이 실제로는 드물거나 다르게 흘러간다는 근거입니다. 그 근거를 고친 답안 안에 적으면, 반론을 받아들이지 않고도 글이 단단해집니다. 이 반론을 받아들일지는 당신이 정합니다.'};
    if(/전제/.test(question))
      return {refused:false,kind:'answer',reply:`숨은 전제는 글에 쓰지 않았지만, 근거에서 주장으로 넘어가려면 참이어야 하는 생각입니다. 지금 글에서는 "${feedback?.structure.premise||''}"가 그렇습니다. 이 전제가 틀린다면 주장은 어떻게 됩니까?`};
    return {refused:false,kind:'answer',reply:'그 답은 당신의 글 안에서 찾아보면 좋겠습니다. 어느 문장이 이 질문과 가장 가깝습니까?'};
  },

  /* [API 5-1] (v4) 고쳐 쓰기 칸 검사: 답안 대신 AI에게 하는 요청을 적었는지
     입력: {text}  출력: {blocked:boolean}  ※ 답안 본문 속 "법을 고쳐야 한다" 같은 문장은 막지 않음 */
  async checkRevised({text}){
    if(API.on)try{return await API.post('check',{text})}catch(e){console.warn(e)}
    const t=text.trim();
    return {blocked:BYPASS.test(t)&&(t.length<120||sentences(t).some(s=>BYPASS.test(s)&&/(줘|주세요|please|\?)\s*[.!?]?$/i.test(s)))};
  },

  /* [API 6] (v4.2) 다음 책문의 과제: 해냈고 여전히 가장 약하면 한 단계 위 (AI 없이 규칙)
     입력: {scores, today, result}  출력: 과제 객체 */
  async nextTask({scores,today,result}){return getNextTask({scores,today,result})},

  /* [API 7] 관점 지도: 시드 답안을 미리 묶어 저장해 두고, 내 글은 가장 가까운 그룹에 배정
     입력: {article, text, level}  출력: {clusters:[...], mine:index} */
  async clusterAnswers({article,text,level}){
    if(API.on)try{const r=await API.post('place',{articleId:article.id,level,text});return {clusters:article.clusters,mine:r.mine}}catch(e){console.warn(e)}
    await sleep(300);
    const st = level==='choshi' ? null : detectStance(article,text).id;
    let i = article.clusters.findIndex(c=>c.stance===st);
    if(i<0){ /* 초시나 입장을 못 찾으면 글자 유사도가 가장 높은 그룹 */
      let best=0,bs=-1;article.clusters.forEach((c,k)=>{const s=jaccard(c.s.text,text);if(s>bs){bs=s;best=k}});i=best;
    }
    return {clusters:article.clusters,mine:i};
  },

  /* [API 8] 나의 기록: 누적 글 분석 (시연은 미리 계산한 데모 계정. 새 계정은 빈 상태) */
  async writingProfile(user){return user&&user.profile==='demo'?PROFILE:null}
};

const S={view:'start',step:0,articleId:'aiexam',picked:false,levelChosen:false,srcTab:'body',level:'boksi',todayTask:null,
  user:null,auth:{scope:'p',tab:'login',org:null,cls:null,role:null,err:'',after:null},teacher:{sel:null},

function resetWriting(){Object.assign(S,{draft:'',log:{start:null,paste:0,revisions:0,refused:0},prewrite:null,running:false,pipe:[],verify:null,attempts:0,feedback:null,personaIndex:0,chat:[],revised:'',blocked:null,compare:null,next:null,taskResult:null,submitted:false,myEssay:null,plaza:null})}
function clearAfterDraft(){Object.assign(S,{feedback:null,verify:null,pipe:[],chat:[],revised:'',blocked:null,compare:null,next:null,taskResult:null,submitted:false,myEssay:null,plaza:null})}
const isStudent=()=>S.user?.role==='student', isProf=()=>S.user?.role==='professor', isOrg=()=>S.user&&S.user.scope==='o';
const myClass=()=>S.user?.classId?CLASSES[S.user.classId]:null;
const rubricFor=()=>{const r=myClass()?.rubric;return r||null};

/* ---------- 진행선 (6단계: 난이도는 '질문' 단계의 첫 화면) ---------- */
const STEPS=['기사','질문','쓰기','반론','고쳐 쓰기','광장'];
const STEP={PICK:0,QUESTION:1,WRITE:2,REBUT:3,REVISE:4,PLAZA:5};
function reached(){let r=0;if(S.picked)r=1;if(S.picked&&S.levelChosen&&S.user)r=2;if(S.draft.trim())r=3;if(S.feedback)r=4;if(S.submitted)r=5;return r}
function drawTrack(){
  const el=$('#track'), r=reached(), flow=S.view==='flow';
  el.parentElement.hidden=!flow;
  el.style.setProperty('--p',S.step/5);
  el.innerHTML=STEPS.map((l,i)=>{
    const cls = i===S.step ? 'now' : i<r ? 'done' : i===r ? 'open' : '';
    return `<li><button class="st ${cls}" data-step="${i}" ${i>r?'disabled':''} ${i===S.step?'aria-current="step"':''}><span class="ball">${i+1}</span><span class="lb">${l}</span></button></li>`;
  }).join('');
  $$('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));
}
function go(i){
  if(i>reached())return;
  S.view='flow';S.step=i;render(true);window.scrollTo(0,0);
}
function view(v){S.view=v;render(true);window.scrollTo(0,0)}

/* ---------- 머리 ---------- */
function drawTop(){
  const L=[];
  if(S.user) L.push(`<span class="who-chip">${isOrg()?'<span class="badge org">기관</span>':''}${esc(S.user.nickname)}</span><button class="toplink" data-top="logout">로그아웃</button>`);
  else if(S.view!=='start'&&S.view!=='auth') L.push(`<button class="toplink" data-top="login">로그인</button>`);
  $('#toplinks').innerHTML=L.join('')+(API.checked&&!API.on?'<span class="mockmark" title="서버의 AI가 연결되기 전이라 규칙 기반 목업으로 동작합니다">목업 모드</span>':'');
  $$('[data-top]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.top;
    if(t==='logout'){S.user=null;S.todayTask=null;resetWriting();S.picked=false;S.levelChosen=false;S.step=0;view('start');return}
    if(t==='login'){S.auth={...S.auth,scope:'p',tab:'login',err:'',after:{view:S.view,step:S.step}};view('auth');return}

}

  $$('[data-tabbar]').forEach(b=>b.onclick=async()=>{

      if(S.view==='peek')S.plaza=null;

      if(S.picked&&S.levelChosen){S.plaza=null;view('peek');await loadPlaza();render();return}

}

/* ---------- (v4.3) 연속 응시와 급제 길: 기록에서 계산 ----------
   쓴 날 = 데모 계정의 PROFILE.days + 이 브라우저에서 제출한 글(DB.essays의 createdAt)
   해낸 과제 = 데모 계정의 PROFILE.cleared + 제출한 글의 task.done + 지금 채점에서 해낸 오늘의 과제
   서버 기록으로 바꿀 때도 같은 두 가지(제출 날짜, 과제 id와 해냄 여부)만 있으면 됨 */
const WD=['일','월','화','수','목','금','토'];
const dayKey=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const daysAgo=o=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-o);return d};
/* 예시 기록: 데모 계정은 PROFILE, 기관 학생 데모는 사용자 history */
function demoHistory(){return S.user?(S.user.history||(S.user.profile==='demo'?PROFILE:null)):null}
function myEssays(){return S.user?DB.essays.filter(e=>e.userId===S.user.id&&!e.isExample):[]}
function writtenDays(){
  const W=new Set();if(!S.user)return W;
  (demoHistory()?.days||[]).forEach(o=>W.add(dayKey(daysAgo(o))));
  myEssays().forEach(e=>{if(e.createdAt)W.add(dayKey(new Date(e.createdAt)))});
  return W;
}
function streakOf(W){const todayDone=W.has(dayKey(daysAgo(0)));let n=0,o=todayDone?0:1;while(W.has(dayKey(daysAgo(o)))){n++;o++}return{n,todayDone}}
function clearedSet(){
  const C=new Set();if(!S.user)return C;
  (demoHistory()?.cleared||[]).forEach(x=>C.add(x));
  myEssays().forEach(e=>{if(e.task&&e.task.done)C.add(e.task.id)});
  if(S.todayTask&&S.taskResult?.revised?.done)C.add(S.todayTask.id);
  return C;
}
/* 한 기준의 세 칸: 해낸 칸은 인장, 이번 과제 칸은 주홍 점선 */
function path3(axis,goalTier,C){
  return `<ol class="path3">${[1,2,3].map(t=>{const id=TASKS[axis][t].id,on=C.has(id),goal=!on&&t===goalTier;
    return `<li class="${on?'done':''}"><span class="c${on?' on':''}${goal?' goal':''}">${TIER_NAME[t]}</span></li>`}).join('')}</ol>`;
}
function pathMini(t){
  if(!t||!TASKS[t.axis])return '';const C=clearedSet();
  const open=[1,2,3].find(x=>!C.has(TASKS[t.axis][x].id));
  const label=C.has(t.id)?(open?`${t.axis} ${TIER_NAME[open]}`:`${t.axis} 세 칸 모두 채움`):`${t.axis} ${TIER_NAME[t.tier]}`;
  return `<div class="pmini" aria-label="급제 길 ${esc(t.axis)}: ${[1,2,3].filter(x=>C.has(TASKS[t.axis][x].id)).length}칸 채움">${path3(t.axis,C.has(t.id)?open:t.tier,C)}<span class="nx">다음 칸: <b>${esc(label)}</b></span></div>`;
}
function streakHTML(){
  if(!S.user||isProf())return '';
  const W=writtenDays(),{n,todayDone}=streakOf(W);
  const cells=[6,5,4,3,2,1,0].map(o=>{const d=daysAgo(o),on=W.has(dayKey(d));
    return `<li><span class="sq${on?' on':''}${o===0&&!on?' today':''}" title="${o===0?'오늘':(d.getMonth()+1)+'월 '+d.getDate()+'일'}${on?', 응시':''}"></span></li>`}).join('');
  return `<div class="skline" role="group" aria-label="최근 7일 응시 기록">
    <p class="sk-n">${n?`연속 <b>${n}</b>일째 응시`:'연속 응시 기록 없음'}${todayDone?'':'<span class="sr">, 오늘 칸이 비어 있습니다</span>'}</p>
    <ol class="mini7" aria-hidden="true">${cells}</ol>${todayDone?'':'<span class="sk-today">오늘 빈칸</span>'}</div>`;
}
function monthHTML(){
  const W=writtenDays(),now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
  let cnt=0;const cells=[];
  for(let i=0;i<first;i++)cells.push('<li class="blank" aria-hidden="true"><span class="dd"></span></li>');
  for(let d=1;d<=last;d++){const k=y*10000+(m+1)*100+d,on=W.has(k),td=d===now.getDate(),fut=d>now.getDate();if(on)cnt++;
    cells.push(`<li class="${fut?'fut':''}"><span class="dd${on?' on':''}${td&&!on?' today':''}" ${td?'aria-current="date"':''}>${d}</span></li>`)}
  const {n}=streakOf(W);
  return `<section class="block"><h3 class="h">응시 달력</h3><div class="monthbox">
    <div class="month-hd"><b>${m+1}월</b><span>이번 달 ${cnt}일 응시, 연속 ${n}일째</span></div>
    <ol class="month" aria-label="${m+1}월 응시 기록">${WD.map(w=>`<li aria-hidden="true"><span class="wd">${w}</span></li>`).join('')}${cells.join('')}</ol></div></section>`;
}
function roadHTML(){
  const C=clearedSet(),axes=Object.keys(TASKS),total=axes.reduce((s,k)=>s+[1,2,3].filter(t=>C.has(TASKS[k][t].id)).length,0);
  const goal=S.todayTask;

function annotate(f){
  /* (v4.1) 주장에는 번호를 붙이지 않고, 근거만 나온 순서대로 [1], [2]로 구분.
     premiseFrom(1부터 센 문장 번호)이 근거 문장이면 "근거 [n] → 주장 사이"로 표시 */
  const st=f.structure;
  const isClaim=s=>s===st.claim||jaccard(s,st.claim)>.6;
  const isReason=s=>st.reasons.some(r=>r===s||jaccard(s,r)>.6);
  const ss=sentences(S.draft);
  let k=0;const ord={};
  const rows=ss.map((s,i)=>{
    const c=isClaim(s)?'c':isReason(s)?'r':'';
    if(c==='r')ord[i+1]=++k;
    const tag=c==='c'?'주장':c==='r'?`근거 <small style="font-weight:400">[${k}]</small>`:'';
    return `<div class="ln ${c}"><span class="tag">${tag}</span><span class="tx">${esc(s)}</span></div>`;
  }).join('');
  const rn=st.premiseFrom?ord[st.premiseFrom]:null;
  const from=rn?`<span class="from">근거 [${rn}] → 주장 사이에 숨은 생각</span>`:'';
  return rows+`<div class="ln p"><span class="tag">숨은 전제</span><span class="tx">${esc(st.premise)}${from}</span></div>`;
}
const pipeItems=()=>S.pipe.map(p=>`<li><i class="${p.state}"></i><span>${esc(p.text)}</span></li>`).join('');
function drawPipe(){const el=$('#pipe');if(el)el.innerHTML=pipeItems()}
function pickPersona(a){const st=S.level==='choshi'?null:detectStance(a,S.draft);const bank=st?st.bank:a.choshiBank;return bank[S.personaIndex%bank.length]}

async function runFeedback(){
  if(S.running)return;
  S.running=true;S.feedback=null;S.pipe=[];S.chat=[];
  if(S.step===STEP.REBUT)render();
  const a=art();
  const log=(state,text)=>{S.pipe.push({state,text});drawPipe()};
  log('ok','기사 본문을 반론의 근거 범위로 정했습니다');
  let fb=null;
  if(API.on){
    log('run','글의 구조를 나누고, 반론을 쓰고, 검수합니다');
    fb=await AI.analyzeAndRebut({article:a,level:S.level,text:S.draft,personaIndex:S.personaIndex});
    S.pipe=[S.pipe[0],...(fb._meta?.log||[]).map(x=>({state:x.state==='info'?'ok':x.state,text:x.text}))];
  } else {
    const name=PERSONAS[pickPersona(a).p].name;
    for(let i=0;i<3;i++){
      S.attempts=i+1;
      log('run',`${i===0?'':`${i+1}번째 시도: `}글의 구조를 나누고 ${name} 관점의 반론을 씁니다`);
      fb=await AI.analyzeAndRebut({article:a,level:S.level,text:S.draft,personaIndex:S.personaIndex});
      S.pipe.at(-1).state='ok';
      log('run','대신 쓴 문장이나 결론을 한쪽으로 모는 표현이 있는지 검수합니다');
      const v=await AI.verifyFeedback({feedback:fb,text:S.draft});
      S.pipe.at(-1).state=v.pass?'ok':'bad';
      S.verify=v;
      if(v.pass)break;
      v.violations.forEach(x=>log('bad',`걸러냄: ${x.type}`));
    }
  }
  S.feedback=fb;S.running=false;
  if(S.view==='flow'&&S.step===STEP.REBUT)render();else drawTrack();
}

const RUBRIC_LICENSE='https://creativecommons.org/licenses/by-nc-sa/4.0/';
function totalOf(score,side){
  if(score.total&&score.total[side]!=null)return score.total[side];
  const cr=rubricFor(), ks=Object.keys(RUBRIC);
  const w=k=>cr?.[k]?.weight??1, ws=ks.reduce((s,k)=>s+w(k),0)||1;
  return Math.round(ks.reduce((s,k)=>s+score[side][k]*w(k),0)/ws*ks.length*10)/10;
}
function diffWords(a,b){
  const A=a.split(/\s+/).filter(Boolean),B=b.split(/\s+/).filter(Boolean),n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Int16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){out.push(esc(A[i]));i++;j++}else if(L[i+1][j]>=L[i][j+1])out.push(`<del>${esc(A[i++])}</del>`);else out.push(`<ins>${esc(B[j++])}</ins>`)}
  while(i<n)out.push(`<del>${esc(A[i++])}</del>`);while(j<m)out.push(`<ins>${esc(B[j++])}</ins>`);
  return out.join(' ');
}

function spark(vals,min=1,max=10){
  const w=200,h=52,p=5,step=(w-2*p)/(vals.length-1),y=v=>h-p-(v-min)/(max-min)*(h-2*p);
  const pts=vals.map((v,i)=>[p+i*step,y(v)]),line=pts.map(q=>q.join(',')).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon class="ar" points="${p},${h-p} ${line} ${w-p},${h-p}"/><polyline class="ln2" points="${line}"/></svg>`;
}

    </tbody></table>
    ${detail}
    <p class="note">예시 학생 이름은 가명입니다. 학생이 동의한 범위만 교수에게 보입니다.</p></section>
  <section class="block"><h3 class="h">채점 기준 (우리 반)</h3>
    <p class="note" style="margin:0 0 12px">다섯 기준은 고정입니다. 기준 설명 문구와 가중치만 반마다 바꿀 수 있고, 바꾼 내용은 이 반 학생들의 채점에 반영됩니다.</p>
    <form id="rubForm" class="rubed">
      ${ks.map(k=>`<b>${k}</b><textarea name="def:${k}" aria-label="${k} 설명">${esc(cr[k]?.def||RUBRIC[k].def)}</textarea>
        <select name="w:${k}" aria-label="${k} 가중치">${[0.5,1,1.5,2].map(w=>`<option value="${w}" ${(cr[k]?.weight??1)===w?'selected':''}>가중치 ${w}</option>`).join('')}</select>`).join('')}
      <span></span><div class="actions" style="margin-top:4px"><button class="btn ghost">기준 저장</button><button type="button" class="link" id="rubReset">원래 기준으로</button></div><span></span>
    </form></section>
  <section class="block"><h3 class="h">이번 주 시제 배정</h3>
    <p class="note" style="margin:0 0 10px">지금 배정: ${esc(ARTICLES.find(a=>a.id===as.articleId)?.title||'')} (${LEVELS[as.level].name}), 마감 ${esc(as.due)}</p>
    <div class="askf"><select id="asArt" style="flex:1;font:inherit;padding:9px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet)">${ARTICLES.map(a=>`<option value="${a.id}" ${a.id===as.articleId?'selected':''}>${esc(a.field)}: ${esc(a.title)}</option>`).join('')}</select>
      <select id="asLv" style="font:inherit;padding:9px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet)"><option value="choshi" ${as.level==='choshi'?'selected':''}>초시</option><option value="boksi" ${as.level==='boksi'?'selected':''}>복시</option></select>
      <button class="btn" id="assignBtn">배정하기</button></div></section>`;
}
function studentDetail(s){
  if(s.real){const e=s.e,p=e.process||{};
    return `<div class="stud"><p class="h" style="font-size:1.02rem">${esc(e.nickname)}의 글</p>
      <p class="proc">작성 시간 <b>${mmss(p.seconds||0)}</b> 붙여넣기 차단 <b>${p.paste||0}번</b> 고쳐 쓰기 <b>${p.revisions||0}번</b> 대필 요청 거절 <b>${p.refused||0}번</b></p>
      ${e.task?`<p class="proc">오늘의 과제: <b>${esc(e.task.title)}</b> (${e.task.done?'해냄':'아직'})</p>`:''}
      <p style="font-weight:700;font-size:.84rem;color:var(--ink2)">처음 글</p><p class="tx">${esc(e.draft)}</p>
      <p style="font-weight:700;font-size:.84rem;color:var(--ink2);margin-top:10px">고친 글</p><p class="tx">${esc(e.revised)}</p></div>`}
  const ex=DB.essays.find(e=>e.id===`ex-${s.art}-boksi-${s.seed}`);
  return `<div class="stud"><p class="h" style="font-size:1.02rem"><span class="badge ex">예시</span>${esc(s.n)}의 글</p>
    <p class="proc">작성 시간 <b>${mmss(s.sec)}</b> 붙여넣기 차단 <b>${s.paste}번</b> 고쳐 쓰기 <b>${s.rev}번</b> 대필 요청 거절 <b>${s.flag}번</b></p>
    <p class="tx">${esc(ex?.revised||'')}</p></div>`;
}

/* ---------- 이벤트 ---------- */
function guard(el){
  const block=e=>{e.preventDefault();S.log.paste++;drawMeter();toast('붙여넣기는 막혀 있습니다. 직접 쓴 글만 반론을 받을 수 있습니다.')};
  el.addEventListener('paste',block);el.addEventListener('drop',block);
}
async function afterLogin(u){
  S.user=u;S.auth.err='';
  if(u.role==='professor'){S.teacher.sel=null;view('teacher');return}
  const prof=await AI.writingProfile(u);
  S.todayTask=await AI.todayTask({profile:prof,classFocus:u.role==='student'?classFocusOf(CLASSES[u.classId]):null});
  const after=S.auth.after;S.auth.after=null;
  if(after?.write&&S.picked&&S.levelChosen){go(STEP.WRITE);return}
  if(after?.view==='flow'){S.view='flow';S.step=Math.min(after.step,reached());render(true);return}
  S.view='flow';S.step=S.picked?STEP.QUESTION:STEP.PICK;render(true);
}
function bind(){
  $$('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  $$('[data-back]').forEach(b=>b.onclick=()=>{S.auth.err='';view(b.dataset.back)});

  /* 첫 화면, 로그인 */
  $$('[data-start]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.start;S.auth.err='';
    if(t==='guest'){S.view='flow';S.step=0;render(true);return}
    if(t==='p'){S.auth={...S.auth,scope:'p',tab:'login',org:null,cls:null,role:null};view('auth');return}
    view('org');
  });
  const of=$('#orgForm');if(of)of.onsubmit=async e=>{e.preventDefault();
    try{const org=$('#og').value,{cls,role}=await DB.classByCode(org,$('#oc').value);S.auth={...S.auth,scope:'o',org,cls,role,tab:'login',err:''};view('auth')}
    catch(x){S.auth.err=x.message;render()}};
  $$('[data-atab]').forEach(b=>b.onclick=()=>{S.auth.tab=b.dataset.atab;S.auth.err='';render()});
  const af=$('#authForm');if(af)af.onsubmit=async e=>{e.preventDefault();
    const A=S.auth,u=$('#au').value.trim(),p=$('#ap').value;
    try{
      let user;
      if(A.tab==='signup') user=await DB.signUp({scope:A.scope,username:u,password:p,nickname:$('#an').value,role:A.scope==='o'?A.role:'personal',classId:A.scope==='o'?A.cls.id:null});
      else{
        user=await DB.signIn({scope:A.scope,username:u,password:p});
        if(A.scope==='o'&&(user.classId!==A.cls.id||user.role!==A.role))throw new Error('이 코드로 들어갈 수 없는 계정입니다. 받은 코드를 확인해 주세요.');
      }
      afterLogin(user);
    }catch(x){S.auth.err=x.message;render()}};
  $$('[data-demo]').forEach(b=>b.onclick=async()=>{const d=b.dataset.demo;afterLogin(await DB.signIn({scope:d==='demo'?'p':'o',username:d,password:DEMO_PW}))});

  /* (v4.3) 방의 기둥을 누르면 그 그룹 답안으로 (제출 전에는 펼치지 않고 대표 답안까지만) */
  $$('[data-col]').forEach(b=>b.onclick=()=>{const g=document.getElementById('grp'+b.dataset.col);if(!g)return;
    if(!g.classList.contains('locked'))g.open=true;
    g.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});
  /* 기사, 난이도, 질문 */
  $$('[data-art]').forEach(b=>b.onclick=()=>{if(S.articleId!==b.dataset.art){S.articleId=b.dataset.art;resetWriting();S.levelChosen=false}S.picked=true;S.srcTab='body';go(STEP.QUESTION)});
  const da=$('#doAssigned');if(da)da.onclick=()=>{const as=myClass().assigned;if(S.articleId!==as.articleId||S.level!==as.level)resetWriting();S.articleId=as.articleId;S.level=as.level;S.picked=true;S.levelChosen=true;S.srcTab='body';go(STEP.QUESTION)};
  $$('[data-tab]').forEach(b=>b.onclick=()=>{S.srcTab=b.dataset.tab;const inDet=!!b.closest('details');render();if(inDet){const n=$('#main details.check');if(n)n.open=true}});
  $$('[data-lv]').forEach(b=>b.onclick=()=>{
    const lv=b.dataset.lv;
    if(lv==='jeonsi'){toast(isOrg()?'전시 문제는 준비 중입니다. 곧 열립니다.':'전시는 프리미엄(월 구독)에서 열립니다.');return}
    if(S.level!==lv){S.level=lv;resetWriting()}S.levelChosen=true;render(true);
  });
  const cl=$('#chLevel');if(cl)cl.onclick=()=>{S.levelChosen=false;render(true)};
  const ab=$('#answerBtn');if(ab)ab.onclick=()=>{
    if(!S.user){S.auth={...S.auth,scope:'p',tab:'login',org:null,cls:null,role:null,err:'',after:{write:true}};toast('글을 쓰려면 로그인이 필요합니다.');view('auth');return}
    go(STEP.WRITE)};
  const pk=$('#peekBtn');if(pk)pk.onclick=async()=>{S.plaza=null;view('peek');await loadPlaza();render()};
  const bq=$('#backQ');if(bq)bq.onclick=()=>{S.plaza=null;go(STEP.QUESTION)};
  $$('[data-locked]').forEach(s=>s.onclick=e=>{e.preventDefault();toast(S.user?'답안을 제출하면 펼쳐 볼 수 있습니다.':'로그인하고 답안을 제출하면 펼쳐 볼 수 있습니다.')});

  /* 쓰기 */
  const d=$('#draft');
  if(d){
    guard(d);
    d.addEventListener('input',()=>{
      if(!S.log.start)S.log.start=Date.now();
      S.draft=d.value;
      if(S.feedback||S.running){clearAfterDraft()}
      drawTrack();drawMeter();
    });
    $('#loadSample').onclick=()=>{d.value=art().samples[S.level]||'';S.draft=d.value;S.log.start=S.log.start||Date.now()-95000;clearAfterDraft();drawTrack();drawMeter()};
    $('#toRebut').onclick=()=>{if(!S.feedback)runFeedback();go(STEP.REBUT)};
    drawMeter();
  }
  const pw=$('#prewriteBtn');
  if(pw)pw.onclick=async()=>{pw.disabled=true;pw.textContent='생각할 거리를 고르는 중입니다';S.prewrite=await AI.prewrite({article:art(),level:S.level});render()};

  /* 반론 + 시관에게 묻기(재반박 포함) */
  if(S.view==='flow'&&S.step===STEP.REBUT){
    drawPipe();
    if(S.draft&&!S.feedback&&!S.running)runFeedback();
    const op=$('#otherPersona');if(op)op.onclick=()=>{S.personaIndex++;runFeedback()};
    const ask=async q=>{
      S.chat.push({me:1,t:q});render();
      const r=await AI.ask({question:q,feedback:S.feedback});
      if(r.refused)S.log.refused++;
      S.chat.push({t:r.reply,refused:r.refused});render();
      const i=$('#askIn');if(i)i.focus();
    };
    const f=$('#askForm');if(f)f.onsubmit=e=>{e.preventDefault();const v=$('#askIn').value.trim();if(v)ask(v)};
  }

  /* 고쳐 쓰기 (우회 요청 입력 차단) */
  const rv=$('#rev');
  if(rv){
    guard(rv);
    rv.addEventListener('input',()=>{S.revised=rv.value});
    const lr=$('#loadRevised');if(lr)lr.onclick=()=>{rv.value=art().revised[S.level];S.revised=rv.value;S.blocked=null};
    $('#compareBtn').onclick=async e=>{
      const after=S.revised||S.draft;
      const b=e.currentTarget;
      if((await AI.checkRevised({text:after})).blocked){
        S.log.refused++;
        S.blocked='고쳐 쓰기 칸에는 내 답안만 적을 수 있습니다. "고쳐 줘", "써 줘" 같은 요청은 받지 않습니다. 궁금한 점은 앞 단계의 시관에게 묻기에서 물어보세요.';
        S.compare=null;render();return;
      }
      S.blocked=null;
      if(after.trim()===S.draft.trim()){toast('아직 고친 곳이 없습니다.');return}
      b.disabled=true;b.textContent='채점하고 있습니다';
      S.log.revisions++;
      const tk=S.todayTask?{id:S.todayTask.id,title:S.todayTask.title,how:S.level==='choshi'?S.todayTask.choshi:S.todayTask.how}:null;
      const score=await AI.scoreRevision({draft:S.draft,revised:after,rebuttal:S.feedback.rebuttal,level:S.level,rubric:rubricFor(),task:tk});
      /* 서버가 task 판정을 주면 그것, 형식이 틀리거나 없으면 규칙으로 대신 판정 */
      const okT=x=>x&&typeof x.done==='boolean';
      S.taskResult=S.todayTask?(okT(score.task?.draft)&&okT(score.task?.revised)?score.task
        :{draft:checkTask(S.todayTask,S.draft,art(),S.level),revised:checkTask(S.todayTask,after,art(),S.level)}):null;
      S.next=await AI.nextTask({scores:score,today:S.todayTask,result:S.taskResult});
      S.compare={score,diff:diffWords(S.draft,after)};
      render();
    };
    const sb=$('#submitBtn');
    if(sb)sb.onclick=async()=>{
      sb.disabled=true;
      const text=S.revised||S.draft;
      S.submitted=true;S.plaza=null;go(STEP.PLAZA);
      const r=await AI.clusterAnswers({article:art(),text,level:S.level});
      S.myEssay=await DB.saveEssay({userId:S.user.id,nickname:S.user.nickname,articleId:S.articleId,level:S.level,draft:S.draft,revised:text,
        scores:S.compare?.score||null,weak:S.next?.axis||null,task:S.todayTask?{id:S.todayTask.id,axis:S.todayTask.axis,title:S.todayTask.title,done:!!S.taskResult?.revised?.done}:null,group:r.mine,published:true,isExample:false,classId:isStudent()?S.user.classId:null,
        process:{seconds:S.log.start?Math.floor((Date.now()-S.log.start)/1000):0,paste:S.log.paste,revisions:S.log.revisions,refused:S.log.refused},base:{ag:0,pn:0}});
      await loadPlaza();
      render();
    };
  }

  /* 광장 투표: 로그인 필요, 모든 글에 가능, 다시 누르면 취소 */
  $$('[data-vote]').forEach(b=>b.onclick=async()=>{
    if(!S.user){toast('투표하려면 로그인이 필요합니다.');return}
    const[id,t]=b.dataset.vote.split(':');
    await DB.toggleVote(S.user.id,id,t);
    const open=[...$$('details.grp')].map(x=>x.open), y=window.scrollY;
    render();[...$$('details.grp')].forEach((x,i)=>{x.open=open[i]});window.scrollTo(0,y);
  });
  const ag=$('#again');
  if(ag)ag.onclick=()=>{if(S.next)S.todayTask=S.next;resetWriting();S.picked=false;S.levelChosen=false;go(STEP.PICK)};

  /* 교수용 */
  $$('[data-stud]').forEach(r=>r.onclick=()=>{S.teacher.sel=S.teacher.sel===r.dataset.stud?null:r.dataset.stud;render()});
  const rf=$('#rubForm');if(rf)rf.onsubmit=async e=>{e.preventDefault();const fd=new FormData(rf),r={};
    Object.keys(RUBRIC).forEach(k=>{r[k]={def:String(fd.get('def:'+k)||'').trim()||RUBRIC[k].def,weight:+fd.get('w:'+k)||1}});
    await DB.saveRubric(myClass().id,r);toast('우리 반 채점 기준을 저장했습니다. 다음 채점부터 반영됩니다.');render()};
  const rr=$('#rubReset');if(rr)rr.onclick=async()=>{await DB.saveRubric(myClass().id,null);toast('원래 기준으로 되돌렸습니다.');render()};
  const fcb=$('#focusBtn');if(fcb)fcb.onclick=async()=>{await DB.saveFocus(myClass().id,$('#focusSel').value);toast('초점 기준을 저장했습니다. 학생이 다시 들어오면 오늘의 과제가 바뀝니다.');render()};
  const asb=$('#assignBtn');if(asb)asb.onclick=async()=>{await DB.assign(myClass().id,$('#asArt').value,$('#asLv').value);toast('이번 주 시제를 배정했습니다. 학생 첫 화면에 보입니다.');render()};
}

/* ---------- 시작 ---------- */
(async()=>{
  const now=new Date();
  $('#today').textContent=`${now.getMonth()+1}월 ${now.getDate()}일 ${'일월화수목금토'[now.getDay()]}요일`;
  render();
  await API.init();
  drawTop();
})();

</script>
</body>
</html>
