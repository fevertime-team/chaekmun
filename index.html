function totalOf(score,side){
  if(score.total&&score.total[side]!=null)return score.total[side];
  const cr=rubricFor(), ks=Object.keys(RUBRIC);
  const w=k=>cr?.[k]?.weight??1, ws=ks.reduce((s,k)=>s+w(k),0)||1;
  return Math.round(ks.reduce((s,k)=>s+score[side][k]*w(k),0)/ws*ks.length*10)/10;
}
function diffWords(a,b){
  const A=a.split(/\s+/).filter(Boolean),B=b.split(/\s+/).filter(Boolean),n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Int16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){out.push(esc(A[i]));i++;j++}else if(L[i+1][j]>=L[i][j+1])out.push(`<del>${esc(A[i++])}</del>`);else out.push(`<ins>${esc(B[j++])}</ins>`)}
  while(i<n)out.push(`<del>${esc(A[i++])}</del>`);while(j<m)out.push(`<ins>${esc(B[j++])}</ins>`);
  return out.join(' ');
}

function spark(vals,min=1,max=10){
  const w=200,h=52,p=5,step=(w-2*p)/(vals.length-1),y=v=>h-p-(v-min)/(max-min)*(h-2*p);
  const pts=vals.map((v,i)=>[p+i*step,y(v)]),line=pts.map(q=>q.join(',')).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon class="ar" points="${p},${h-p} ${line} ${w-p},${h-p}"/><polyline class="ln2" points="${line}"/></svg>`;
}

/* (v4.4) 수업 화면으로 띄우기: 교수가 강의실 화면에 띄우는 한 장. 이름 없이 우리 반 관점 지도 + 이야기거리 셋 */
function vBoard(){
  if(!isProf()) return `<p class="note">교수 계정으로 들어와야 볼 수 있는 화면입니다.</p>`;
  const cls=myClass(), as=cls.assigned, a=ARTICLES.find(x=>x.id===as.articleId), cl=a.clusters;
  const E=DB.essays.filter(e=>e.classId===cls.id&&e.articleId===a.id&&e.level===as.level&&e.published);
  const G=cl.map((c,i)=>({c,i,list:E.filter(e=>e.group===i)})).filter(x=>x.list.length).sort((x,y)=>y.list.length-x.list.length);
  const total=E.length, max=G.length?G[0].list.length:1;
  const pick=x=>(x.list.find(e=>e.rep)||x.list[0]).revised;
  const cut=s=>s.length>140?s.slice(0,140)+'…':s;
  const big=G[0], tam=G.find(x=>x.c.tam&&x!==big);
  const ks=Object.keys(CLASSROOM.before), weak=ks.reduce((x,y)=>CLASSROOM.before[y]<CLASSROOM.before[x]?y:x);
  return `
  <section class="board">
    <p class="bd-k">${esc(cls.name)}, ${esc(as.classAt||'오늘 수업')}, ${LEVELS[as.level].name}</p>

    ${total?`<div class="bd-map">${G.map(x=>`<div class="bd-row${x.c.tam?' tam':''}"><span class="bl">${x.c.tam?'<span class="so">少</span>':''}${esc(x.c.label)}</span><span class="bb"><span style="--w:${Math.round(x.list.length/max*100)}%"></span></span><span class="bn">${x.list.length}명</span></div>`).join('')}</div>
    <ol class="bd-talk">
      <li><span class="k">이야기거리 1. 우리 반에서 가장 많은 생각</span><b>${esc(big.c.label)}</b> (${big.list.length}명)<p>${esc(cut(pick(big)))}</p></li>
      ${tam?`<li><span class="k">이야기거리 2. 적지만 논리가 단단한 소수의견 (어람작 후보)</span><b>${esc(tam.c.label)}</b> (${tam.list.length}명)<p>${esc(cut(pick(tam)))}</p></li>`:''}
      <li><span class="k">이야기거리 ${tam?3:2}. 오늘 함께 연습할 기준</span>반 처음 글에서 가장 약한 기준은 <b>${esc(weak)}</b>(평균 ${CLASSROOM.before[weak].toFixed(1)}점)입니다. 가장 많은 생각과 소수의견이 각각 어디서 통하지 않는지 함께 찾아봅니다.</li>

  </section>`;
}

    ${R.use.map(([k,v])=>`<div class="hb wide"><span>${k}</span><span class="bar" style="--w:${parseInt(v)/418*100}%;background:var(--seal)"></span><span class="num">${v}</span></div>`).join('')}</section>
  <section class="block"><h3 class="h">학과별 참여 (상위 5개)</h3>
    ${R.dept.map(([k,v])=>`<div class="hb wide"><span>${k}</span><span class="bar" style="--w:${v/md*100}%;background:var(--ink)"></span><span class="num">${v}명</span></div>`).join('')}</section>
  <div class="actions"><button class="btn" id="dlList">비교과 이수 명단 내려받기</button>${isProf()?'<button class="btn ghost" id="centerBack">교수용 화면으로</button>':''}</div>`;
}
function studentDetail(s){
  if(s.real){const e=s.e,p=e.process||{};
    return `<div class="stud"><p class="h" style="font-size:1.02rem">${esc(e.nickname)}의 글</p>
      <p class="proc">작성 시간 <b>${mmss(p.seconds||0)}</b> 붙여넣기 차단 <b>${p.paste||0}번</b> 고쳐 쓰기 <b>${p.revisions||0}번</b> 대필 요청 거절 <b>${p.refused||0}번</b></p>
      ${e.task?`<p class="proc">오늘의 과제: <b>${esc(e.task.title)}</b> (${e.task.done?'해냄':'아직'})</p>`:''}
      <p style="font-weight:700;font-size:.84rem;color:var(--ink2)">처음 글</p><p class="tx">${esc(e.draft)}</p>
      <p style="font-weight:700;font-size:.84rem;color:var(--ink2);margin-top:10px">고친 글</p><p class="tx">${esc(e.revised)}</p></div>`}
  const ex=DB.essays.find(e=>e.id===`ex-${s.art}-boksi-${s.seed}`);
  return `<div class="stud"><p class="h" style="font-size:1.02rem"><span class="badge ex">예시</span>${esc(s.n)}의 글</p>
    <p class="proc">작성 시간 <b>${mmss(s.sec)}</b> 붙여넣기 차단 <b>${s.paste}번</b> 고쳐 쓰기 <b>${s.rev}번</b> 대필 요청 거절 <b>${s.flag}번</b></p>
    <p class="tx">${esc(ex?.revised||'')}</p></div>`;
}

/* ---------- 이벤트 ---------- */
function guard(el){
  const block=e=>{e.preventDefault();S.log.paste++;drawMeter();toast('붙여넣기는 막혀 있습니다. 직접 쓴 글만 반론을 받을 수 있습니다.')};
  el.addEventListener('paste',block);el.addEventListener('drop',block);
}
async function afterLogin(u){
  S.user=u;S.auth.err='';
  if(u.role==='professor'){S.teacher.sel=null;view('teacher');return}
  if(u.role==='center'){view('center');return}
  const prof=await AI.writingProfile(u);
  S.todayTask=await AI.todayTask({profile:prof,classFocus:u.role==='student'?classFocusOf(CLASSES[u.classId]):null});
  const after=S.auth.after;S.auth.after=null;
  if(after?.write&&S.picked&&S.levelChosen){go(STEP.WRITE);return}
  if(after?.view==='flow'){S.view='flow';S.step=Math.min(after.step,reached());render(true);return}
  S.view='flow';S.step=S.picked?STEP.QUESTION:STEP.PICK;render(true);
}
function bind(){
  $$('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  $$('[data-back]').forEach(b=>b.onclick=()=>{S.auth.err='';view(b.dataset.back)});

  /* 첫 화면, 로그인 */
  $$('[data-start]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.start;S.auth.err='';
    if(t==='guest'){S.view='flow';S.step=0;render(true);return}
    if(t==='p'){S.auth={...S.auth,scope:'p',tab:'login',org:null,cls:null,role:null};view('auth');return}
    view('org');
  });
  const of=$('#orgForm');if(of)of.onsubmit=async e=>{e.preventDefault();
    try{const org=$('#og').value,{cls,role}=await DB.classByCode(org,$('#oc').value);S.auth={...S.auth,scope:'o',org,cls,role,tab:'login',err:''};view('auth')}
    catch(x){S.auth.err=x.message;render()}};
  $$('[data-atab]').forEach(b=>b.onclick=()=>{S.auth.tab=b.dataset.atab;S.auth.err='';render()});
  const af=$('#authForm');if(af)af.onsubmit=async e=>{e.preventDefault();
    const A=S.auth,u=$('#au').value.trim(),p=$('#ap').value;
    try{
      let user;
      if(A.tab==='signup') user=await DB.signUp({scope:A.scope,username:u,password:p,nickname:$('#an').value,role:A.scope==='o'?A.role:'personal',classId:A.scope==='o'?A.cls.id:null});
      else{
        user=await DB.signIn({scope:A.scope,username:u,password:p});
        if(A.scope==='o'&&(user.classId!==A.cls.id||user.role!==A.role))throw new Error('이 코드로 들어갈 수 없는 계정입니다. 받은 코드를 확인해 주세요.');
      }
      afterLogin(user);
    }catch(x){S.auth.err=x.message;render()}};
  $$('[data-demo]').forEach(b=>b.onclick=async()=>{const d=b.dataset.demo;afterLogin(await DB.signIn({scope:d==='demo'?'p':'o',username:d,password:DEMO_PW}))});

  /* (v4.3) 방의 기둥을 누르면 그 그룹 답안으로 (제출 전에는 펼치지 않고 대표 답안까지만) */
  $$('[data-col]').forEach(b=>b.onclick=()=>{const g=document.getElementById('grp'+b.dataset.col);if(!g)return;
    if(!g.classList.contains('locked'))g.open=true;
    g.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});
  /* 기사, 난이도, 질문 */
  $$('[data-art]').forEach(b=>b.onclick=()=>{if(S.articleId!==b.dataset.art){S.articleId=b.dataset.art;resetWriting();S.levelChosen=false}S.picked=true;S.srcTab='body';go(STEP.QUESTION)});
  const da=$('#doAssigned');if(da)da.onclick=()=>{const as=myClass().assigned;if(S.articleId!==as.articleId||S.level!==as.level)resetWriting();S.articleId=as.articleId;S.level=as.level;S.picked=true;S.levelChosen=true;S.srcTab='body';go(STEP.QUESTION)};
  $$('[data-tab]').forEach(b=>b.onclick=()=>{S.srcTab=b.dataset.tab;const inDet=!!b.closest('details');render();if(inDet){const n=$('#main details.check');if(n)n.open=true}});
  $$('[data-lv]').forEach(b=>b.onclick=()=>{
    const lv=b.dataset.lv;
    if(lv==='jeonsi'){toast(isOrg()?'전시 문제는 준비 중입니다. 곧 열립니다.':'전시는 프리미엄(월 구독)에서 열립니다.');return}
    if(S.level!==lv){S.level=lv;resetWriting()}S.levelChosen=true;render(true);
  });
  const cl=$('#chLevel');if(cl)cl.onclick=()=>{S.levelChosen=false;render(true)};
  const ab=$('#answerBtn');if(ab)ab.onclick=()=>{
    if(!S.user){S.auth={...S.auth,scope:'p',tab:'login',org:null,cls:null,role:null,err:'',after:{write:true}};toast('글을 쓰려면 로그인이 필요합니다.');view('auth');return}
    go(STEP.WRITE)};
  const pk=$('#peekBtn');if(pk)pk.onclick=async()=>{S.plaza=null;view('peek');await loadPlaza();render()};
  const bq=$('#backQ');if(bq)bq.onclick=()=>{S.plaza=null;go(STEP.QUESTION)};
  $$('[data-locked]').forEach(s=>s.onclick=e=>{e.preventDefault();toast(S.user?'답안을 제출하면 펼쳐 볼 수 있습니다.':'로그인하고 답안을 제출하면 펼쳐 볼 수 있습니다.')});

  /* 쓰기 */
  const d=$('#draft');
  if(d){
    guard(d);
    d.addEventListener('input',()=>{
      if(!S.log.start)S.log.start=Date.now();
      S.draft=d.value;
      if(S.feedback||S.running){clearAfterDraft()}
      drawTrack();drawMeter();
    });
    $('#loadSample').onclick=()=>{d.value=art().samples[S.level]||'';S.draft=d.value;S.log.start=S.log.start||Date.now()-95000;clearAfterDraft();drawTrack();drawMeter()};
    $('#toRebut').onclick=()=>{if(!S.feedback)runFeedback();go(STEP.REBUT)};
    drawMeter();
  }
  const pw=$('#prewriteBtn');
  if(pw)pw.onclick=async()=>{pw.disabled=true;pw.textContent='생각할 거리를 고르는 중입니다';S.prewrite=await AI.prewrite({article:art(),level:S.level});render()};

  /* 반론 + 시관에게 묻기(재반박 포함) */
  if(S.view==='flow'&&S.step===STEP.REBUT){
    drawPipe();
    if(S.draft&&!S.feedback&&!S.running)runFeedback();
    const op=$('#otherPersona');if(op)op.onclick=runOtherPersona;
    const ask=async q=>{
      S.chat.push({me:1,t:q});render();
      const r=await AI.ask({question:q,feedback:S.feedback});
      if(r.refused)S.log.refused++;
      S.chat.push({t:r.reply,refused:r.refused});render();
      const i=$('#askIn');if(i)i.focus();
    };
    const f=$('#askForm');if(f)f.onsubmit=e=>{e.preventDefault();const v=$('#askIn').value.trim();if(v)ask(v)};
  }

  /* 고쳐 쓰기 (우회 요청 입력 차단) */
  const rv=$('#rev');
  if(rv){
    guard(rv);
    rv.addEventListener('input',()=>{S.revised=rv.value});
    const lr=$('#loadRevised');if(lr)lr.onclick=()=>{rv.value=art().revised[S.level];S.revised=rv.value;S.blocked=null};
    $('#compareBtn').onclick=async e=>{
      const after=S.revised||S.draft;
      const b=e.currentTarget;
      if((await AI.checkRevised({text:after})).blocked){
        S.log.refused++;
        S.blocked='고쳐 쓰기 칸에는 내 답안만 적을 수 있습니다. "고쳐 줘", "써 줘" 같은 요청은 받지 않습니다. 궁금한 점은 앞 단계의 시관에게 묻기에서 물어보세요.';
        S.compare=null;render();return;
      }
      S.blocked=null;
      if(after.trim()===S.draft.trim()){toast('아직 고친 곳이 없습니다.');return}
      b.disabled=true;b.textContent='채점하고 있습니다';
      S.log.revisions++;
      const tk=S.todayTask?{id:S.todayTask.id,title:S.todayTask.title,how:S.level==='choshi'?S.todayTask.choshi:S.todayTask.how}:null;
      const score=await AI.scoreRevision({draft:S.draft,revised:after,rebuttal:S.feedback.rebuttal,level:S.level,rubric:rubricFor(),task:tk});
      /* 서버가 task 판정을 주면 그것, 형식이 틀리거나 없으면 규칙으로 대신 판정 */
      const okT=x=>x&&typeof x.done==='boolean';
      S.taskResult=S.todayTask?(okT(score.task?.draft)&&okT(score.task?.revised)?score.task
        :{draft:checkTask(S.todayTask,S.draft,art(),S.level),revised:checkTask(S.todayTask,after,art(),S.level)}):null;
      S.next=await AI.nextTask({scores:score,today:S.todayTask,result:S.taskResult});
      S.compare={score,diff:diffWords(S.draft,after)};
      render();
    };
    const sb=$('#submitBtn');
    if(sb)sb.onclick=async()=>{
      sb.disabled=true;
      const text=S.revised||S.draft;
      S.submitted=true;S.plaza=null;go(STEP.PLAZA);
      const r=await AI.clusterAnswers({article:art(),text,level:S.level});
      S.myEssay=await DB.saveEssay({userId:S.user.id,nickname:S.user.nickname,articleId:S.articleId,level:S.level,draft:S.draft,revised:text,
        scores:S.compare?.score||null,weak:S.next?.axis||null,task:S.todayTask?{id:S.todayTask.id,axis:S.todayTask.axis,title:S.todayTask.title,done:!!S.taskResult?.revised?.done}:null,group:r.mine,published:true,isExample:false,classId:isStudent()?S.user.classId:null,
        process:{seconds:S.log.start?Math.floor((Date.now()-S.log.start)/1000):0,paste:S.log.paste,revisions:S.log.revisions,refused:S.log.refused},base:{ag:0,pn:0}});
      await loadPlaza();
      render();
    };
  }

  /* 광장 투표: 로그인 필요, 모든 글에 가능, 다시 누르면 취소 */
  $$('[data-vote]').forEach(b=>b.onclick=async()=>{
    if(!S.user){toast('투표하려면 로그인이 필요합니다.');return}
    const[id,t]=b.dataset.vote.split(':');
    await DB.toggleVote(S.user.id,id,t);
    const open=[...$$('details.grp')].map(x=>x.open), y=window.scrollY;
    render();[...$$('details.grp')].forEach((x,i)=>{x.open=open[i]});window.scrollTo(0,y);
  });
  const ag=$('#again');
  if(ag)ag.onclick=()=>{if(S.next)S.todayTask=S.next;resetWriting();S.picked=false;S.levelChosen=false;go(STEP.PICK)};

  /* 교수용 */
  $$('[data-stud]').forEach(r=>r.onclick=()=>{S.teacher.sel=S.teacher.sel===r.dataset.stud?null:r.dataset.stud;render()});
  const rf=$('#rubForm');if(rf)rf.onsubmit=async e=>{e.preventDefault();const fd=new FormData(rf),r={};
    Object.keys(RUBRIC).forEach(k=>{r[k]={def:String(fd.get('def:'+k)||'').trim()||RUBRIC[k].def,weight:+fd.get('w:'+k)||1}});
    await DB.saveRubric(myClass().id,r);toast('우리 반 채점 기준을 저장했습니다. 다음 채점부터 반영됩니다.');render()};
  const rr=$('#rubReset');if(rr)rr.onclick=async()=>{await DB.saveRubric(myClass().id,null);toast('원래 기준으로 되돌렸습니다.');render()};
  const fcb=$('#focusBtn');if(fcb)fcb.onclick=async()=>{await DB.saveFocus(myClass().id,$('#focusSel').value);toast('초점 기준을 저장했습니다. 학생이 다시 들어오면 오늘의 과제가 바뀝니다.');render()};
  const asb=$('#assignBtn');if(asb)asb.onclick=async()=>{await DB.assign(myClass().id,$('#asArt').value,$('#asLv').value);toast('다음 수업 시제를 배정했습니다. 학생 첫 화면에 보입니다.');render()};
  /* (v4.4) 수업 화면, 센터 리포트 */
  const bb=$('#boardBtn');if(bb)bb.onclick=()=>view('board');
  const bc=$('#boardClose');if(bc)bc.onclick=()=>view('teacher');
  const cb=$('#centerBtn');if(cb)cb.onclick=()=>view('center');
  const cbk=$('#centerBack');if(cbk)cbk.onclick=()=>view('teacher');
  const dl=$('#dlList');if(dl)dl.onclick=()=>toast('시연판에서는 내려받기를 지원하지 않습니다. 실제 서비스에서는 이수 학생 명단을 CSV로 받습니다.');
}

/* ---------- 시작 ---------- */
(async()=>{
  const now=new Date();
  $('#today').textContent=`${now.getMonth()+1}월 ${now.getDate()}일 ${'일월화수목금토'[now.getDay()]}요일`;
  render();
  await Promise.all([API.init(),REMOTE.init()]);
  drawTop();
})();

</script>
